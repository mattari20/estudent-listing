name: Isolated MySQL Approval Migration Validation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/isolated-mysql-approval-migration-validation.yml'
      - '.github/workflows/laravel-ci.yml'
      - 'database/migrations/**'
      - 'tests/Feature/LegacyIdentityKeyInventoryTest.php'
      - 'tests/Feature/AuditLegacyIdentityKeysCommandSafetyTest.php'
      - 'docs/audits/PHASE_1C_LEGACY_NULL_IDENTITY_KEY_INVENTORY.md'
      - 'tests/Feature/InstitutionFieldApprovalServiceTest.php'
      - 'tests/Feature/ExecutionLeaseServiceTest.php'
      - 'tests/Support/verify-execution-lease-multiprocess.php'
      - 'tests/Feature/SourceSnapshotTest.php'
      - 'tests/Feature/SourceRetrievalTest.php'
      - 'tests/Support/verify-source-snapshot-ordering-multiprocess.php'
      - 'app/Models/SourceSnapshotReconciliationRequest.php'
      - 'app/Services/SourceSnapshotService.php'
      - 'app/Services/SourceChangeObservationService.php'
      - 'database/migrations/2026_11_04_000013_create_source_snapshot_reconciliation_requests_table.php'
      - 'tests/Feature/SourceChangeDiscoveryIdempotencyTest.php'
      - 'tests/Feature/SourceChangeDiscoveryServiceTest.php'
      - 'tests/Feature/InstituteDiscoveryAgentTest.php'
      - 'tests/Support/verify-discovery-batch-multiprocess.php'
      - 'tests/Support/verify-review-package-multiprocess.php'
      - 'tests/Feature/InstituteIdentityPersistenceRecoveryTest.php'
      - 'tests/Support/verify-identity-conflict-multiprocess.php'
      - '.github/workflows/phase-1c-21-apply-patch.yml'
      - '.github/phase-1c-21.patch.parts/part06'
      - 'app/Services/BulkImportPromotionService.php'
      - 'app/Services/OperatorTransitionService.php'
      - 'app/Services/InstituteImportPromoter.php'
      - 'app/Services/GeographyPromotionService.php'
      - 'app/Http/Controllers/InstituteBulkPromotionController.php'
      - 'tests/Feature/OperatorTransitionAtomicityTest.php'
      - 'tests/Support/verify-operator-transition-multiprocess.php'
      - 'app/Services/ImportConflictDetectionService.php'
      - 'app/Services/ImportConflictLifecycleService.php'
      - 'app/Services/InstituteIdentityResolver.php'
      - 'app/Services/IdentityResolutionDecisionService.php'
      - 'app/Models/IdentityMatchCandidate.php'
      - 'app/Models/IdentityResolutionDecision.php'
      - 'app/Models/ImportConflict.php'
      - 'app/Models/ImportConflictEvent.php'
      - 'app/Http/Controllers/InstituteImportPromotionController.php'
      - 'app/Http/Controllers/InstituteOperationsController.php'
      - 'resources/views/institutes/operations/row.blade.php'
      - 'tests/Feature/InstituteDiscoveryReviewPackageTest.php'
      - 'tests/Feature/InstituteDiscoveryReviewPackageRecoveryTest.php'
      - 'app/Services/InstituteDiscoveryReviewPackageService.php'
      - 'app/Console/Commands/PruneInstituteDiscoveryReviewPackages.php'
      - 'docs/audits/PHASE_1C_REVIEW_PACKAGE_FILESYSTEM_RECOVERY.md'
      - 'app/Services/DiscoveryPersistenceIdentityService.php'
      - 'app/Services/InstituteDiscoveryAgentService.php'
      - 'app/Services/InstituteIdentityDiscoveryService.php'
      - 'app/Models/ImportBatch.php'
      - 'app/Models/ImportRow.php'
      - 'app/Models/Evidence.php'
      - 'app/Models/Assertion.php'
      - 'tests/Feature/SourceChangeIntelligenceTest.php'
      - 'app/Services/SourceChangeReverificationService.php'
      - 'app/Services/MonitoringAlertService.php'
      - 'app/Services/MonitoringAuditService.php'
      - 'app/Services/SourceMonitoringBatchService.php'
      - 'database/migrations/2026_11_04_000011_add_discovery_candidate_persistence_identity_keys.php'
      - 'app/Services/MonitoringPolicyCheckpointService.php'
      - 'app/Services/MonitoringPolicyStateService.php'
      - 'app/Models/SecurityAuditEvent.php'
      - 'tests/Feature/MonitoringAlertsTest.php'
      - 'tests/Feature/SourceMonitoringBatchRecoveryTest.php'
      - 'docs/audits/PHASE_1C_POLICY_CHECKPOINT_FAILURE_BOUNDARY_RECOVERY.md'
      - 'docs/audits/PHASE_1C_DISCOVERY_CANDIDATE_BATCH_FAILURE_RECOVERY.md'
      - 'docs/PROJECT_MASTER_TRACKER.md'
      - 'database/migrations/2026_11_04_000010_create_monitoring_policy_run_checkpoints.php'
      - 'app/Console/Commands/MonitorSourceChanges.php'
      - 'app/Services/SourceMonitoringBatchService.php'
      - 'app/Models/ChangeEvent.php'
      - 'app/Services/SourceChangeEventProjector.php'
      - 'app/Services/SourceChangeDiscoveryService.php'
      - 'app/Models/InstituteDiscoveryRunOutcome.php'
      - 'app/Services/SourceSnapshotService.php'
      - 'app/Services/SourceChangeObservationService.php'
      - 'app/Services/SourceRetrievalService.php'
      - 'app/Services/ExecutionLeaseService.php'
      - 'tests/Support/verify-institution-field-approvals-schema.php'
      - 'composer.json'
      - 'composer.lock'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-mysql-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-${{ github.run_id }}-${{ github.run_attempt }}
          MYSQL_DATABASE: approval_migration_test
          MYSQL_USER: approval_ci
          MYSQL_PASSWORD: ci-user-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-${{ github.run_id }}-${{ github.run_attempt }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: approval_migration_test
      DB_USERNAME: approval_ci
      DB_PASSWORD: ci-user-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, mbstring, xml, curl, pdo_mysql
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Confirm isolated MySQL server version
        run: mysql --host=127.0.0.1 --port=3306 --user="$DB_USERNAME" --password="$DB_PASSWORD" --database="$DB_DATABASE" --batch --skip-column-names -e 'SELECT VERSION();'
      - name: Prepare prerequisites without the target migration
        shell: bash
        run: |
          set -euo pipefail
          target=database/migrations/2026_10_29_000001_create_institution_field_approvals_table.php
          hold="$RUNNER_TEMP/2026_10_29_000001_create_institution_field_approvals_table.php"
          test -f "$target"
          test ! -e "$hold"
          mv "$target" "$hold"
          restore_target() { if [ -f "$hold" ]; then mv "$hold" "$target"; fi; }
          trap restore_target EXIT
          php artisan migrate:fresh --force
          php -r 'require "vendor/autoload.php"; $app=require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); if (Illuminate\Support\Facades\Schema::hasTable("institution_field_approvals")) { fwrite(STDERR, "Target table unexpectedly exists before target migration\n"); exit(1); } echo "Confirmed target table absent before target migration.\n";'
          mv "$hold" "$target"
          trap - EXIT
      - name: Execute existing migration through Laravel migrator
        run: php artisan migrate --force --path=database/migrations/2026_10_29_000001_create_institution_field_approvals_table.php
      - name: Verify exact schema and migration ledger
        run: php tests/Support/verify-institution-field-approvals-schema.php
      - name: Verify second migration run is idempotent
        shell: bash
        run: |
          set -euo pipefail
          before="$(mysql --host=127.0.0.1 --port=3306 --user="$DB_USERNAME" --password="$DB_PASSWORD" --database="$DB_DATABASE" --batch --skip-column-names -e "SELECT COUNT(*) FROM migrations WHERE migration='2026_10_29_000001_create_institution_field_approvals_table';")"
          test "$before" = "1"
          php artisan migrate --force --path=database/migrations/2026_10_29_000001_create_institution_field_approvals_table.php
          after="$(mysql --host=127.0.0.1 --port=3306 --user="$DB_USERNAME" --password="$DB_PASSWORD" --database="$DB_DATABASE" --batch --skip-column-names -e "SELECT COUNT(*) FROM migrations WHERE migration='2026_10_29_000001_create_institution_field_approvals_table';")"
          test "$after" = "1"
      - name: Run approval-specific tests against the migrated MySQL schema
        run: vendor/bin/phpunit --filter InstitutionFieldApprovalServiceTest
      - name: Validate execution lease ownership and recovery on MySQL
        run: vendor/bin/phpunit tests/Feature/ExecutionLeaseServiceTest.php
      - name: Prove lease exclusion across independent PHP processes on MySQL
        run: php tests/Support/verify-execution-lease-multiprocess.php
      - name: Validate chronological source snapshot ordering and retrieval recovery on MySQL
        run: vendor/bin/phpunit tests/Feature/SourceSnapshotTest.php tests/Feature/SourceRetrievalTest.php
      - name: Prove source snapshot ordering across independent PHP processes on MySQL
        run: php tests/Support/verify-source-snapshot-ordering-multiprocess.php
      - name: Validate discovery outcome idempotency on MySQL
        run: vendor/bin/phpunit tests/Feature/SourceChangeDiscoveryIdempotencyTest.php
      - name: Validate discovery outcome batch consistency on MySQL
        run: vendor/bin/phpunit tests/Feature/SourceChangeDiscoveryServiceTest.php
      - name: Validate discovery candidate batch failure recovery on MySQL
        run: vendor/bin/phpunit tests/Feature/InstituteDiscoveryAgentTest.php
      - name: Prove candidate batch identity across independent PHP processes on MySQL
        run: php tests/Support/verify-discovery-batch-multiprocess.php
      - name: Validate review-package filesystem recovery on MySQL
        run: vendor/bin/phpunit tests/Feature/InstituteDiscoveryReviewPackageTest.php tests/Feature/InstituteDiscoveryReviewPackageRecoveryTest.php
      - name: Prove review-package writer concurrency on independent PHP processes
        run: php tests/Support/verify-review-package-multiprocess.php
      - name: Validate legacy NULL identity-key inventory on MySQL
        run: vendor/bin/phpunit tests/Feature/LegacyIdentityKeyInventoryTest.php
      - name: Prove identity inventory command refuses production and ambiguous database configs
        run: vendor/bin/phpunit tests/Feature/AuditLegacyIdentityKeysCommandSafetyTest.php
      - name: Validate institution identity conflict and decision replay on MySQL
        run: vendor/bin/phpunit tests/Feature/InstituteIdentityPersistenceRecoveryTest.php
      - name: Prove institution identity conflict and decision concurrency on MySQL
        run: php tests/Support/verify-identity-conflict-multiprocess.php
      - name: Validate operator transition atomicity and failure recovery on MySQL
        run: vendor/bin/phpunit tests/Feature/OperatorTransitionAtomicityTest.php
      - name: Prove operator transition concurrency across independent PHP processes on MySQL
        run: php tests/Support/verify-operator-transition-multiprocess.php
      - name: Validate source change event and reverification queue replay on MySQL
        run: vendor/bin/phpunit tests/Feature/SourceChangeIntelligenceTest.php
      - name: Validate monitoring alert and audit replay idempotency on MySQL
        run: vendor/bin/phpunit tests/Feature/MonitoringAlertsTest.php
      - name: Validate monitoring policy recovery and durable checkpoints on MySQL
        run: vendor/bin/phpunit tests/Feature/SourceMonitoringBatchRecoveryTest.php
