name: Complete UVAS Campuses and Offerings
on:
  push:
    branches:
      - ops/complete-uvas-campuses-offerings
permissions:
  contents: read
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Add source-verified UVAS campuses and program offerings
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          command_timeout: 3m
          script: |
            set -euo pipefail
            cd /home/u537436044/domains/estudent.pk/public_html/institutes
            php <<'PHP'
            <?php
            require 'vendor/autoload.php';
            $app=require_once 'bootstrap/app.php';
            $kernel=$app->make(Illuminate\Contracts\Console\Kernel::class);
            $kernel->bootstrap();
            $db=Illuminate\Support\Facades\DB::class;
            $db::transaction(function() use($db) {
              $i=$db::table('institutions')->where('id',5)->lockForUpdate()->first();
              if(!$i || $i->name!=='University of Veterinary and Animal Sciences Lahore' || $i->status!=='active') throw new RuntimeException('UVAS identity guard failed');
              $cities=[
                ['Pattoki','pattoki',2],
                ['Jhang','jhang',2],
                ['Narowal','narowal',2],
              ];
              $geo=[];
              foreach($cities as [$name,$slug,$parent]) {
                $rows=$db::table('geographies')->where('slug',$slug)->lockForUpdate()->get();
                if($rows->count()>1) throw new RuntimeException('Duplicate geography '.$slug);
                if($rows->count()===0) {
                  $id=$db::table('geographies')->insertGetId(['parent_id'=>$parent,'name'=>$name,'slug'=>$slug,'type'=>'city','code'=>null,'status'=>'active','created_at'=>now(),'updated_at'=>now()]);
                  echo "GEOGRAPHY_ADDED={$name};ID={$id}\n";
                } else {
                  $r=$rows->first();
                  if($r->name!==$name || $r->type!=='city' || $r->status!=='active' || (int)$r->parent_id!==$parent) throw new RuntimeException('Geography identity mismatch '.$slug);
                  $id=(int)$r->id;
                }
                $geo[$slug]=$id;
              }
              $campuses=[
                ['Ravi Campus, Pattoki','ravi-campus-pattoki','sub', $geo['pattoki'],'Ravi Campus, Pattoki, Punjab, Pakistan','https://uvas.edu.pk/other_campuses/Ravi-Campus/index.htm'],
                ['Jhang Campus','jhang-campus','sub',$geo['jhang'],'12 km Chiniot Road, Jhang, Punjab, Pakistan','https://www.uvas.edu.pk/other_campuses/CVAS/'],
                ['Narowal Campus','narowal-campus','sub',$geo['narowal'],'5-KM Shakargarh Road, Narowal, Punjab, Pakistan','https://www.uvas.edu.pk/other_campuses/Narowal/principal-message.htm'],
              ];
              $campusIds=[];
              foreach($campuses as [$name,$slug,$type,$geography,$address,$source]) {
                $rows=$db::table('campuses')->where('institution_id',5)->where('slug',$slug)->lockForUpdate()->get();
                if($rows->count()>1) throw new RuntimeException('Duplicate campus '.$slug);
                if($rows->count()===0) {
                  $id=$db::table('campuses')->insertGetId(['institution_id'=>5,'geography_id'=>$geography,'name'=>$name,'slug'=>$slug,'campus_type'=>$type,'status'=>'active','address'=>$address,'postal_code'=>null,'latitude'=>null,'longitude'=>null,'created_at'=>now(),'updated_at'=>now()]);
                  echo "CAMPUS_ADDED={$name};ID={$id};SOURCE={$source}\n";
                } else {
                  $c=$rows->first();
                  if($c->name!==$name || $c->status!=='active' || (int)$c->geography_id!==$geography) throw new RuntimeException('Campus identity mismatch '.$slug);
                  $id=(int)$c->id;
                }
                $campusIds[$slug]=$id;
              }
              $offeringSpecs=[
                ['uvas-bs-medical-laboratory-technology','ravi-campus-pattoki','4 years'],
                ['uvas-bs-zoology','ravi-campus-pattoki','4 years'],
                ['uvas-bs-poultry-science','ravi-campus-pattoki','4 years'],
                ['uvas-bs-dairy-technology','ravi-campus-pattoki','4 years'],
                ['uvas-bs-computer-science','ravi-campus-pattoki','4 years'],
                ['uvas-bs-biotechnology','ravi-campus-pattoki','4 years'],
                ['uvas-bs-food-science-technology','ravi-campus-pattoki','4 years'],
                ['uvas-bs-biology','ravi-campus-pattoki','4 years'],
                ['uvas-doctor-of-veterinary-medicine','jhang-campus','5 years'],
                ['uvas-bs-applied-microbiology','jhang-campus','4 years'],
                ['uvas-bs-medical-laboratory-technology','jhang-campus','4 years'],
                ['uvas-doctor-of-veterinary-medicine','narowal-campus','5 years'],
                ['uvas-bs-applied-microbiology','narowal-campus','4 years'],
                ['uvas-bs-medical-laboratory-technology','narowal-campus','4 years'],
              ];
              foreach($offeringSpecs as [$programSlug,$campusSlug,$duration]) {
                $p=$db::table('programs')->where('institution_id',5)->where('slug',$programSlug)->where('status','active')->first();
                $c=$db::table('campuses')->where('id',$campusIds[$campusSlug])->where('institution_id',5)->where('status','active')->first();
                if(!$p || !$c || !$c->geography_id) throw new RuntimeException('Program/campus guard failed '.$programSlug.' @ '.$campusSlug);
                $rows=$db::table('program_offerings')->where('program_id',$p->id)->where('campus_id',$c->id)->where('delivery_mode','on_campus')->lockForUpdate()->get();
                if($rows->count()>1) throw new RuntimeException('Duplicate offering '.$programSlug.' @ '.$campusSlug);
                if($rows->count()===0) {
                  $id=$db::table('program_offerings')->insertGetId(['program_id'=>$p->id,'campus_id'=>$c->id,'delivery_mode'=>'on_campus','status'=>'active','intake_label'=>null,'duration'=>$duration,'availability'=>'unknown','effective_from'=>null,'effective_until'=>null,'created_at'=>now(),'updated_at'=>now()]);
                  echo "OFFERING_ADDED={$programSlug};CAMPUS={$campusSlug};ID={$id}\n";
                } else {
                  if($rows->first()->status!=='active') throw new RuntimeException('Offering existing but inactive');
                  echo "OFFERING_REUSED={$programSlug};CAMPUS={$campusSlug}\n";
                }
              }
            });
            $campuses=$db::table('campuses')->where('institution_id',5)->where('status','active')->get(['id','name','geography_id','address']);
            $programs=$db::table('programs')->where('institution_id',5)->where('status','active')->count();
            $offerings=$db::table('program_offerings as o')->join('programs as p','p.id','=','o.program_id')->join('campuses as c','c.id','=','o.campus_id')->where('p.institution_id',5)->where('o.status','active')->get(['o.id','p.name as program','c.name as campus']);
            $broken=$db::table('program_offerings as o')->leftJoin('programs as p','p.id','=','o.program_id')->leftJoin('campuses as c','c.id','=','o.campus_id')->where('o.status','active')->where(function($q){$q->whereNull('p.id')->orWhereNull('c.id')->orWhere('p.status','<>','active')->orWhere('c.status','<>','active')->orWhereNull('c.geography_id');})->count();
            echo "UVAS_FINAL_CAMPUSES=".json_encode($campuses,JSON_UNESCAPED_SLASHES)."\n";
            echo "UVAS_FINAL_PROGRAM_COUNT={$programs}\n";
            echo "UVAS_FINAL_OFFERINGS=".json_encode($offerings,JSON_UNESCAPED_SLASHES)."\n";
            echo "UVAS_BROKEN_OFFERINGS={$broken}\n";
            if($campuses->count()!==4 || $programs!==15 || $offerings->count()<17 || $broken!==0) throw new RuntimeException('UVAS campus/offering verification failed');
            PHP
            php artisan institutes:data-gap-report --json | php -r '$d=json_decode(stream_get_contents(STDIN),true); if(!is_array($d)) exit(2); echo "DATA_GAP_STATUS=".($d["status"]??"unknown")."\n"; echo "POPULATION=".json_encode($d["sections"]["canonical_population"]??null)."\n"; echo "GAPS=".json_encode($d["sections"]["canonical_relationship_gaps"]??null)."\n"; if(($d["mutation_performed"]??null)!==false || ($d["status"]??null)!=="healthy") exit(5);'
