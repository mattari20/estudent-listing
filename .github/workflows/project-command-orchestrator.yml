name: Institutes Directory Command Orchestrator
on:
  workflow_dispatch:
    inputs:
      command:
        description: "Continue, Resume, Move to Step 2, or Move to Step 3"
        required: true
        type: choice
        options: [Continue, Resume, Move to Step 2, Move to Step 3]
      issue_number:
        description: "Optional issue/PR number for persistent resume state"
        required: false
        type: string
  issue_comment:
    types: [created]
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write
concurrency:
  group: institutes-directory-command-orchestrator
  cancel-in-progress: false
jobs:
  command:
    # Keep the job-level condition simple and supported. Command allow-listing
    # is enforced in the first shell step, which exits early for unrelated comments.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve command and state target
        id: cmd
        env:
          EVENT: ${{ github.event_name }}
          INPUT_COMMAND: ${{ inputs.command }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
          COMMENT: ${{ github.event.comment.body }}
          COMMENT_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          accepted=true
          if [[ "$EVENT" == issue_comment ]]; then
            c="$(printf '%s' "$COMMENT" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"; i="$COMMENT_ISSUE"
            case "$c" in
              Continue|continue|Resume|resume|"Move to Step 2"|"move to step 2"|"Move to Step 3"|"move to step 3") ;;
              *) accepted=false ;;
            esac
          elif [[ "$EVENT" == push ]]; then
            c="Continue"; i=""
          else
            c="$INPUT_COMMAND"; i="$INPUT_ISSUE"
          fi
          echo "value=$c" >> "$GITHUB_OUTPUT"
          echo "issue=$i" >> "$GITHUB_OUTPUT"
          echo "accepted=$accepted" >> "$GITHUB_OUTPUT"
          if [[ "$accepted" != true ]]; then echo "Ignoring unrelated issue comment; no project command was requested."; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && github.event.repository.default_branch || github.ref_name }}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Restore persistent state from issue/PR comment
        if: steps.cmd.outputs.accepted == 'true' && steps.cmd.outputs.issue != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ steps.cmd.outputs.issue }}
        run: |
          # --jq emits one JSON object per line, so pagination cannot concatenate
          # arrays into invalid JSON. Keep only well-formed state-marker comments.
          gh api "repos/$GH_REPO/issues/$ISSUE/comments?per_page=100" --paginate --jq '.[] | select(.body | contains("<!-- institutes-project-controller-state -->")) | {id: .id, body: .body, created_at: .created_at}' > state-comments.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          items = [json.loads(line) for line in Path("state-comments.jsonl").read_text().splitlines() if line.strip()]
          items.sort(key=lambda x: (x.get("created_at", ""), x.get("id", 0)))
          raw = "{}"
          if items:
              body = items[-1].get("body", "")
              marker = "<!-- institutes-project-controller-state -->"
              end = "<!-- end-state -->"
              if marker in body and end in body.split(marker, 1)[1]:
                  raw = body.split(marker, 1)[1].split(end, 1)[0].strip()
          # Validate the persisted data is an object; corrupt state fails closed.
          state = json.loads(raw)
          if not isinstance(state, dict):
              raise SystemExit("Persisted resume state must be a JSON object.")
          Path("controller-state.json").write_text(json.dumps(state, indent=2) + "\n")
          PY
      - name: Initialize empty state
        if: steps.cmd.outputs.accepted == 'true' && steps.cmd.outputs.issue == ''
        run: echo '{}' > controller-state.json
      - name: Verify restored resume state
        if: steps.cmd.outputs.issue != ''
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path("controller-state.json").read_text())
          # This workflow is allowed to restore resume metadata only; it must
          # never let a persisted state value bypass the authoritative tracker.
          assert isinstance(state, dict)
          print(json.dumps({"restored_state_valid": True, "has_resume_point": isinstance(state.get("resume_point"), str)}))
          PY
      - name: Enforce current step gate
        if: steps.cmd.outputs.accepted == 'true'
        id: gate
        env: {COMMAND: ${{ steps.cmd.outputs.value }}}
        run: |
          set -euo pipefail
          mkdir -p controller-report
          set +e
          python scripts/project_command_orchestrator.py --command "$COMMAND" --state-file controller-state.json --output controller-report/command-state.json > controller-report/command-state.stdout.json
          rc=$?; set -e; echo "exit_code=$rc" >> "$GITHUB_OUTPUT"; cat controller-report/command-state.stdout.json
          [[ "$rc" == 3 ]] && exit 0
          exit "$rc"
      - name: Run supported controller tests and smoke checks
        if: steps.cmd.outputs.accepted == 'true' && steps.gate.outputs.exit_code == '0'
        run: |
          python -m unittest discover -s tests/project_controller -v
          python -m unittest discover -s tests/project_controller -p 'test_project_command_orchestrator.py' -v
          python scripts/project_controller.py --offline --output-dir controller-report/offline-smoke
      - name: Run read-only GitHub inventory
        if: steps.gate.outputs.exit_code == '0'
        env: {GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}, GITHUB_REPOSITORY: ${{ github.repository }}}
        run: python scripts/project_controller.py --output-dir controller-report/live
      - name: Persist resume point in issue/PR comment
        if: always() && steps.cmd.outputs.accepted == 'true' && steps.cmd.outputs.issue != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ steps.cmd.outputs.issue }}
          COMMAND: ${{ steps.cmd.outputs.value }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("controller-report/command-state.json")
          if p.exists():
              r = json.loads(p.read_text())
          else:
              r = {"decision": "STOP", "resume_point": "Inspect workflow logs", "reason": "No command report was produced."}
          r.update(last_command=os.environ["COMMAND"], workflow_run=os.environ["RUN_URL"])
          Path("persisted-state.json").write_text(json.dumps(r, indent=2) + "\n")
          # Round-trip the exact JSON to catch an invalid report before persisting.
          restored = json.loads(Path("persisted-state.json").read_text())
          assert restored == r and isinstance(restored, dict)
          PY
          body="$(printf '<!-- institutes-project-controller-state -->\n%s\n<!-- end-state -->\n\nLast command: %s\nWorkflow: %s' "$(cat persisted-state.json)" "$COMMAND" "$RUN_URL")"
          id="$(gh api "repos/$GH_REPO/issues/$ISSUE/comments?per_page=100" --paginate --jq '[.[] | select(.body | contains("<!-- institutes-project-controller-state -->"))] | sort_by(.created_at, .id) | last | .id // empty')"
          if [[ -n "$id" ]]; then gh api --method PATCH "repos/$GH_REPO/issues/comments/$id" -f body="$body" >/dev/null; else gh api --method POST "repos/$GH_REPO/issues/$ISSUE/comments" -f body="$body" >/dev/null; fi
      - name: Upload report and resume state
        if: always() && steps.cmd.outputs.accepted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: institutes-command-orchestration-${{ github.run_id }}
          path: controller-report/
          if-no-files-found: warn
          retention-days: 90
