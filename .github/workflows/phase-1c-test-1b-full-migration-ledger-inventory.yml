name: Phase 1C Test 1B — Full Migration Ledger Inventory (Read-only)
on:
  workflow_dispatch:
    inputs:
      project_path:
        description: "Absolute path to the existing Institutes Laravel project"
        required: true
        type: string
        default: "/home/u537436044/domains/estudent.pk/public_html/institutes"
      target_sha:
        description: "Exact 40-character SHA of current main."
        required: true
        type: string
      operation_reason:
        description: "Reason or ticket reference for this read-only inventory."
        required: true
        type: string
        default: "Phase1C-Test1B-full-migration-ledger-inventory-readonly"
      confirm_production_operation:
        description: "Type the exact operation-specific confirmation phrase."
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: phase-1c-test1b-full-migration-ledger-inventory
  cancel-in-progress: false
jobs:
  full-migration-inventory:
    environment: production-readonly-diagnostics
    name: Compare all source migrations with deployed files and ledger
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact dispatch revision
        uses: actions/checkout@v4
        with:
          ref: \${{ github.sha }}
          fetch-depth: 0
          path: .production-dispatch-guard
      - name: Validate protected production dispatch
        env:
          TARGET_SHA: \${{ inputs.target_sha }}
          OPERATION_REASON: \${{ inputs.operation_reason }}
          CONFIRM_PRODUCTION_OPERATION: \${{ inputs.confirm_production_operation }}
          EXPECTED_CONFIRMATION: "AUTHORIZE-PHASE1C-TEST1B-FULL-MIGRATION-INVENTORY-READONLY"
        run: bash .production-dispatch-guard/scripts/ci/validate-production-dispatch.sh
      - name: Build expected migration manifest and validate diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cd .production-dispatch-guard
          php -l scripts/diagnostics/phase1c-full-migration-ledger-inventory.php
          find database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\\n' | sed 's/\\.php$//' | sort -u > "$RUNNER_TEMP/expected-migrations.txt"
          test -s "$RUNNER_TEMP/expected-migrations.txt"
          EXPECTED_MIGRATIONS_B64="$(base64 -w0 "$RUNNER_TEMP/expected-migrations.txt")"
          SCRIPT_B64="$(base64 -w0 scripts/diagnostics/phase1c-full-migration-ledger-inventory.php)"
          echo "EXPECTED_MIGRATIONS_B64=$EXPECTED_MIGRATIONS_B64" >> "$GITHUB_ENV"
          echo "RECONCILIATION_SCRIPT_B64=$SCRIPT_B64" >> "$GITHUB_ENV"
          echo "expected_migration_count=$(wc -l < "$RUNNER_TEMP/expected-migrations.txt" | tr -d ' ')"
      - name: Validate environment-scoped production credentials
        env:
          PRODUCTION_READONLY_HOSTINGER_SSH_HOST: \${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_HOST }}
          PRODUCTION_READONLY_HOSTINGER_SSH_USER: \${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_USER }}
          PRODUCTION_READONLY_HOSTINGER_SSH_PRIVATE_KEY: \${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_PRIVATE_KEY }}
          PRODUCTION_READONLY_HOSTINGER_SSH_PORT: \${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_READONLY_HOSTINGER_SSH_HOST"
          test -n "$PRODUCTION_READONLY_HOSTINGER_SSH_USER"
          test -n "$PRODUCTION_READONLY_HOSTINGER_SSH_PRIVATE_KEY"
          test -n "$PRODUCTION_READONLY_HOSTINGER_SSH_PORT"
      - name: Run full read-only inventory over SSH stdin
        uses: appleboy/ssh-action@v1.2.0
        env:
          PROJECT_PATH: \${{ inputs.project_path }}
          RECONCILIATION_SCRIPT_B64: \${{ env.RECONCILIATION_SCRIPT_B64 }}
          EXPECTED_MIGRATIONS_B64: \${{ env.EXPECTED_MIGRATIONS_B64 }}
        with:
          host: \${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_HOST }}
          username: \${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_USER }}
          key: \${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_PRIVATE_KEY }}
          port: \${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_PORT }}
          envs: PROJECT_PATH,RECONCILIATION_SCRIPT_B64,EXPECTED_MIGRATIONS_B64
          command_timeout: 5m
          script: |
            set -eu
            case "$PROJECT_PATH" in /*) ;; *) echo "ERROR: project_path must be absolute"; exit 2 ;; esac
            case "$PROJECT_PATH" in *".."*) echo "ERROR: project_path must not contain .."; exit 2 ;; esac
            [ -f "$PROJECT_PATH/artisan" ] || { echo "ERROR: artisan not found"; exit 3; }
            [ -f "$PROJECT_PATH/vendor/autoload.php" ] || { echo "ERROR: Composer autoloader not found"; exit 4; }
            PHP_BIN="/opt/alt/php85/usr/bin/php"
            [ -x "$PHP_BIN" ] || { echo "ERROR: approved PHP executable unavailable"; exit 5; }
            cd "$PROJECT_PATH"
            export EXPECTED_MIGRATIONS_B64
            printf '%s' "$RECONCILIATION_SCRIPT_B64" | base64 -d | "$PHP_BIN"
      - name: Confirm read-only execution contract
        if: \${{ always() }}
        run: |
          echo "migration_source_manifest=read_from_checked_out_main"
          echo "production_application_rows_read=0"
          echo "production_database_mutations=NOT_PERMITTED"
          echo "production_migrations=NOT_RUN"
          echo "production_application_file_writes=NOT_PERMITTED"
          echo "persistent_diagnostic_reports=NOT_WRITTEN"
