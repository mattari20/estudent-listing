name: Official Source Refresh Readiness (Read-only)

on:
  workflow_dispatch:
    inputs:
      project_path:
        description: "Absolute path to the Institutes Laravel project directory containing artisan"
        required: true
        type: string
        default: "/home/u537436044/domains/estudent.pk/public_html/institutes"
  workflow_run:
    workflows:
      - Controlled Hostinger Code Deployment
      - Controlled Official-Source Refresh Migration
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: official-source-refresh-readiness
  cancel-in-progress: false

jobs:
  resolve-revision:
    name: Resolve expected application revision
    runs-on: ubuntu-latest
    outputs:
      expected_revision: ${{ steps.revision.outputs.expected_revision }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve latest application-code revision
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git log -1 --format=%H -- app bootstrap config database resources routes composer.json composer.lock public artisan)"
          test -n "$revision"
          echo "expected_revision=$revision" >> "$GITHUB_OUTPUT"
          echo "expected_application_revision=$revision"

  diagnose:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Verify deployed code and refresh migration without writes
    needs: resolve-revision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run read-only SSH diagnostics
        uses: appleboy/ssh-action@v1.2.0
        env:
          PROJECT_PATH: ${{ inputs.project_path || '/home/u537436044/domains/estudent.pk/public_html/institutes' }}
          EXPECTED_REVISION: ${{ needs.resolve-revision.outputs.expected_revision }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          envs: PROJECT_PATH,EXPECTED_REVISION
          command_timeout: 3m
          script: |
            set -eu
            case "$PROJECT_PATH" in /*) ;; *) echo "ERROR: project_path must be absolute"; exit 2 ;; esac
            case "$PROJECT_PATH" in *".."*) echo "ERROR: project_path must not contain .."; exit 2 ;; esac
            test -f "$PROJECT_PATH/artisan" || { echo "ERROR: artisan not found"; exit 3; }
            cd "$PROJECT_PATH"

            echo "=== Application code revision comparison (read-only) ==="
            if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              DEPLOYED_CHECKOUT_HEAD="$(git rev-parse HEAD)"
              echo "deployed_checkout_head=$DEPLOYED_CHECKOUT_HEAD"
              echo "expected_application_revision=$EXPECTED_REVISION"

              # The full checkout HEAD can advance for docs/workflow-only changes.
              # Verify the actual application-path tree against the expected app revision.
              # If the target object is absent in a shallow Hostinger checkout, fetch only
              # that Git object; this does not checkout files or modify the working tree.
              if ! git cat-file -e "$EXPECTED_REVISION^{commit}" 2>/dev/null; then
                if git remote get-url origin >/dev/null 2>&1; then
                  git fetch --quiet --no-tags origin "$EXPECTED_REVISION" \
                    || echo "expected_revision_fetch=UNAVAILABLE"
                fi
              fi

              if git cat-file -e "$EXPECTED_REVISION^{commit}" 2>/dev/null \
                && git diff --quiet "$EXPECTED_REVISION" "$DEPLOYED_CHECKOUT_HEAD" -- app bootstrap config database resources routes composer.json composer.lock public artisan \
                && git diff --quiet -- app bootstrap config database resources routes composer.json composer.lock public artisan \
                && git diff --cached --quiet -- app bootstrap config database resources routes composer.json composer.lock public artisan; then
                echo "application_code_status=APPLICATION_CODE_MATCH"
              else
                echo "application_code_status=APPLICATION_CODE_DRIFT_OR_UNVERIFIABLE"
              fi
            else
              echo "application_code_status=UNVERIFIABLE_NO_GIT_METADATA"
            fi

            echo "=== Official-source refresh schema verification (read-only) ==="
            php <<'PHP'
            <?php
            require __DIR__.'/vendor/autoload.php';
            $app = require __DIR__.'/bootstrap/app.php';
            $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();

            $db = \Illuminate\Support\Facades\DB::class;
            $schema = \Illuminate\Support\Facades\Schema::class;
            $table = 'official_source_refresh_events';
            $migration = '2026_10_25_000002_create_official_source_refresh_events_table';
            $migrationFile = base_path('database/migrations/'.$migration.'.php');
            $migrationFileExists = is_file($migrationFile);
            $migrationTableExists = $schema::hasTable('migrations');
            $tableExists = $schema::hasTable($table);
            $requiredColumns = [
                'id',
                'source_id',
                'source_change_observation_id',
                'canonical_type',
                'canonical_id',
                'field_name',
                'before_value',
                'after_value',
                'evidence_url',
                'evidence_excerpt',
                'content_fingerprint',
                'observed_at',
                'occurred_at',
                'created_at',
                'updated_at',
            ];
            $requiredIndexes = [
                'official_refresh_source_idx' => ['source_id'],
                'official_refresh_observation_idx' => ['source_change_observation_id'],
                'official_refresh_canonical_field_idx' => ['canonical_type', 'canonical_id', 'field_name'],
            ];
            $missingColumns = [];
            $missingIndexes = [];
            $existingIndexes = [];
            if ($tableExists) {
                foreach ($requiredColumns as $column) {
                    if (! $schema::hasColumn($table, $column)) {
                        $missingColumns[] = $column;
                    }
                }

                foreach ($schema::getIndexes($table) as $index) {
                    $name = $index['name'] ?? null;
                    if (is_string($name) && $name !== '') {
                        $existingIndexes[$name] = [
                            'columns' => array_values($index['columns'] ?? []),
                            'unique' => (bool) ($index['unique'] ?? false),
                        ];
                    }
                }
                foreach ($requiredIndexes as $name => $columns) {
                    $actual = $existingIndexes[$name] ?? null;
                    if ($actual === null || $actual['columns'] !== $columns || $actual['unique'] !== false) {
                        $missingIndexes[$name] = $columns;
                    }
                }
            } else {
                $missingColumns = $requiredColumns;
                $missingIndexes = $requiredIndexes;
            }
            $migrationRows = [];
            if ($migrationTableExists) {
                $migrationRows = $db::table('migrations')
                    ->where('migration', $migration)
                    ->get(['migration', 'batch'])
                    ->map(fn ($row) => ['migration' => $row->migration, 'batch' => (int) $row->batch])
                    ->all();
            }
            $migrationApplied = count($migrationRows) > 0;
            $columnsReady = $tableExists && $missingColumns === [];
            $indexesReady = $tableExists && $missingIndexes === [];
            $indexDiagnostics = [];
            foreach ($requiredIndexes as $name => $columns) {
                $actual = $existingIndexes[$name] ?? null;
                if ($actual === null) {
                    $sameColumnsElsewhere = [];
                    foreach ($existingIndexes as $existingName => $existingDefinition) {
                        if ($existingDefinition['columns'] === $columns) {
                            $sameColumnsElsewhere[] = $existingName;
                        }
                    }
                    $classification = $sameColumnsElsewhere === [] ? 'absent' : 'equivalent_under_different_name';
                } elseif ($actual['columns'] !== $columns) {
                    $classification = 'name_collision_wrong_columns';
                } elseif ($actual['unique'] !== false) {
                    $classification = 'wrong_uniqueness';
                } else {
                    $classification = 'exact';
                }
                $indexDiagnostics[$name] = [
                    'classification' => $classification,
                    'expected_columns' => $columns,
                    'actual' => $actual,
                ];
            }
            $ready = $tableExists && $migrationApplied && $columnsReady && $indexesReady && $migrationFileExists;
            echo json_encode([
                'check' => 'official_source_refresh_schema_readiness',
                'checked_at' => now()->toIso8601String(),
                'mutation_performed' => false,
                'table' => $table,
                'table_exists' => $tableExists,
                'required_columns' => $requiredColumns,
                'missing_columns' => $missingColumns,
                'columns_ready' => $columnsReady,
                'required_indexes' => $requiredIndexes,
                'existing_indexes' => $existingIndexes,
                'index_diagnostics' => $indexDiagnostics,
                'missing_indexes' => $missingIndexes,
                'indexes_ready' => $indexesReady,
                'migrations_table_exists' => $migrationTableExists,
                'expected_migration' => $migration,
                'migration_file_exists' => $migrationFileExists,
                'migration_applied' => $migrationApplied,
                'matching_migrations' => $migrationRows,
                'schema_ready' => $ready,
                'next_action' => $ready
                    ? 'continue_staging_acceptance_tests'
                    : (($tableExists && $columnsReady && $indexesReady && ! $migrationApplied)
                        ? 'run_controlled_official_source_refresh_migration_with_confirm_migration_true_to_reconcile_verified_schema_ledger'
                        : 'review_schema_or_migration_status_apply_only_through_approved_controlled_workflow'),
            ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES), PHP_EOL;
            if (! $ready) {
                fwrite(STDERR, "ERROR: official-source refresh schema is not ready; no migration or production data mutation was run.".PHP_EOL);
                exit(10);
            }
            PHP
            echo "database_migrations=NOT_RUN"
            echo "production_data_mutations=NOT_RUN"
