name: Add UVAS Campuses and Verified Offerings
on:
  push:
    branches:
      - ops/add-uvas-verified-campuses-and-offerings
permissions:
  contents: read
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Add verified UVAS campus geography and confirmed offerings
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          command_timeout: 3m
          script: |
            set -euo pipefail
            cd /home/u537436044/domains/estudent.pk/public_html/institutes
            php <<'PHP'
            <?php
            require 'vendor/autoload.php';
            $app=require_once 'bootstrap/app.php';
            $kernel=$app->make(Illuminate\Contracts\Console\Kernel::class);
            $kernel->bootstrap();
            $db=Illuminate\Support\Facades\DB::class;
            echo "GEOGRAPHY_SCHEMA=".json_encode($db::select('SHOW COLUMNS FROM geographies'))."\n";
            echo "EXISTING_GEOS=".json_encode($db::table('geographies')->get())."\n";
            echo "UVAS_CAMPUS_COUNT=".$db::table('campuses')->where('institution_id',5)->count()."\n";
            PHP
