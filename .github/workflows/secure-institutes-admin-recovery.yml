name: Recover Existing Institutes Administrator

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RECOVER-EXISTING-ADMIN-1 to authorize recovery"
        required: true
        type: string
      project_path:
        description: "Absolute path to deployed Laravel project"
        required: true
        default: "/home/u537436044/domains/estudent.pk/public_html/institutes"
        type: string
      expected_user_id:
        description: "Existing user ID shown in phpMyAdmin"
        required: true
        default: "1"
        type: string
      existing_admin_email:
        description: "Existing administrator email; must remain unchanged"
        required: true
        default: "m_attari20@yahoo.com"
        type: string

permissions:
  contents: read

concurrency:
  group: institutes-existing-admin-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Preflight and recover existing administrator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate identity and reset existing account password
        uses: appleboy/ssh-action@v1.2.0
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          PROJECT_PATH: ${{ inputs.project_path }}
          EXPECTED_USER_ID: ${{ inputs.expected_user_id }}
          EXISTING_ADMIN_EMAIL: ${{ inputs.existing_admin_email }}
          RECOVERY_PASSWORD: ${{ secrets.INSTITUTES_ADMIN_RECOVERY_PASSWORD }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          envs: CONFIRMATION,PROJECT_PATH,EXPECTED_USER_ID,EXISTING_ADMIN_EMAIL,RECOVERY_PASSWORD
          command_timeout: 4m
          script: |
            set -eu
            [ "$CONFIRMATION" = "RECOVER-EXISTING-ADMIN-1" ] || { echo "STOP: confirmation phrase mismatch"; exit 2; }
            [ "$EXPECTED_USER_ID" = "1" ] || { echo "STOP: this recovery is restricted to verified existing user ID 1"; exit 2; }
            [ "$EXISTING_ADMIN_EMAIL" = "m_attari20@yahoo.com" ] || { echo "STOP: source email must remain m_attari20@yahoo.com"; exit 2; }
            case "$PROJECT_PATH" in /*) ;; *) echo "STOP: project path must be absolute"; exit 2 ;; esac
            case "$PROJECT_PATH" in *".."*) echo "STOP: project path must not contain .."; exit 2 ;; esac
            [ -f "$PROJECT_PATH/artisan" ] || { echo "STOP: Laravel artisan file not found"; exit 3; }
            [ -n "$RECOVERY_PASSWORD" ] || { echo "STOP: repository secret INSTITUTES_ADMIN_RECOVERY_PASSWORD is missing"; exit 4; }
            cd "$PROJECT_PATH"
            export RECOVERY_PASSWORD EXISTING_ADMIN_EMAIL EXPECTED_USER_ID
            php <<'PHP'
            <?php
            declare(strict_types=1);

            require __DIR__.'/vendor/autoload.php';
            $app = require __DIR__.'/bootstrap/app.php';
            $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();

            $fail = static function (string $message): never {
                fwrite(STDERR, 'STOP: '.$message.PHP_EOL);
                exit(10);
            };

            $email = trim((string) getenv('EXISTING_ADMIN_EMAIL'));
            $expectedId = (int) getenv('EXPECTED_USER_ID');
            $password = (string) getenv('RECOVERY_PASSWORD');

            if (strlen($password) < 12
                || preg_match('/[a-z]/', $password) !== 1
                || preg_match('/[A-Z]/', $password) !== 1
                || preg_match('/[0-9]/', $password) !== 1
                || preg_match('/[^A-Za-z0-9]/', $password) !== 1) {
                $fail('recovery password must be at least 12 characters and include lowercase, uppercase, number, and symbol');
            }

            if (!\Illuminate\Support\Facades\Schema::hasTable('users')) {
                $fail('users table is missing');
            }

            $user = \App\Models\User::query()->find($expectedId);
            if (!$user) $fail('expected user ID was not found; no changes made');
            if (strcasecmp((string) $user->email, $email) !== 0) {
                $fail('user ID and expected email do not match; no changes made');
            }
            if ($user->role !== 'admin') {
                $fail('verified account does not currently have admin role; no changes made');
            }

            \Illuminate\Support\Facades\DB::transaction(function () use ($user, $password): void {
                $user->forceFill([
                    'password' => $password,
                    'remember_token' => \Illuminate\Support\Str::random(60),
                ])->save();
            });

            $verified = \App\Models\User::query()->find($expectedId);
            if (!$verified
                || strcasecmp((string) $verified->email, $email) !== 0
                || $verified->role !== 'admin'
                || !\Illuminate\Support\Facades\Hash::check($password, (string) $verified->password)) {
                $fail('post-write verification failed; inspect the account before retrying');
            }

            echo 'PASS: existing admin record ID '.$verified->id.' preserved.'.PHP_EOL;
            echo 'PASS: email remains '.$verified->email.'.'.PHP_EOL;
            echo 'PASS: admin role preserved and password hash verified.'.PHP_EOL;
            echo 'PASS: remember token rotated; password and hash were not printed.'.PHP_EOL;
            PHP
