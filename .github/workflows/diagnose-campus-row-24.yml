name: Diagnose campus row 24 promotion failure

on:
  push:
    branches:
      - ops/diagnose-campus-row-24-promotion

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read promotion failure details from Hostinger
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          command_timeout: 3m
          script: |
            set -eu
            cd "/home/u537436044/domains/estudent.pk/public_html/institutes"
            php <<'PHP'
            <?php
            require __DIR__.'/vendor/autoload.php';
            $app = require __DIR__.'/bootstrap/app.php';
            $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();

            $row = \Illuminate\Support\Facades\DB::table('import_rows')
                ->where('id', 24)->first([
                    'id','import_batch_id','status','match_state','parent_subject_type',
                    'parent_subject_id','canonical_subject_type','canonical_subject_id','validation_errors'
                ]);
            $events = \Illuminate\Support\Facades\DB::table('import_promotion_events')
                ->where('import_row_id', 24)->orderByDesc('id')->limit(5)
                ->get(['id','event_type','reason','metadata','occurred_at']);
            $out = [
                'check' => 'campus_row_24_failure_diagnosis',
                'mutation_performed' => false,
                'row' => $row ? (array) $row : null,
                'recent_events' => $events->map(function ($event) {
                    $metadata = is_string($event->metadata) ? json_decode($event->metadata, true) : $event->metadata;
                    return [
                        'event_id' => (int) $event->id,
                        'event_type' => $event->event_type,
                        'reason' => mb_substr((string) ($event->reason ?? ''), 0, 500),
                        'error_class' => is_array($metadata) ? ($metadata['error_class'] ?? null) : null,
                        'occurred_at' => $event->occurred_at,
                    ];
                })->all(),
            ];
            echo json_encode($out, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES), PHP_EOL;
            PHP