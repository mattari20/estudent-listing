            echo "=== Institution import row trace (read-only; no payloads or notes) ==="
            php <<'PHP'
            <?php
            require __DIR__.'/vendor/autoload.php';
            $app = require __DIR__.'/bootstrap/app.php';
            $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $db = \Illuminate\Support\Facades\DB::class;
            $schema = \Illuminate\Support\Facades\Schema::class;

            $rows = $db::table('import_rows')
                ->join('import_batches', 'import_batches.id', '=', 'import_rows.import_batch_id')
                ->where('import_batches.entity_type', 'institution')
                ->orderBy('import_rows.import_batch_id')
                ->orderBy('import_rows.row_number')
                ->get([
                    'import_rows.id',
                    'import_rows.import_batch_id',
                    'import_rows.row_number',
                    'import_rows.status',
                    'import_rows.match_state',
                    'import_rows.parent_subject_type',
                    'import_rows.parent_subject_id',
                    'import_rows.validation_errors',
                    'import_rows.payload',
                    'import_rows.normalized_payload',
                    'import_batches.status as batch_status',
                    'import_batches.source_id as batch_source_id',
                ]);

            $report = ['check' => 'institution_import_row_trace', 'mutation_performed' => false, 'rows' => []];
            foreach ($rows as $row) {
                $errors = $row->validation_errors;
                if (is_string($errors)) {
                    $errors = json_decode($errors, true);
                }
                $payload = is_array($row->normalized_payload) ? $row->normalized_payload : (is_array($row->payload) ? $row->payload : []);
                if (is_string($row->normalized_payload)) {
                    $decoded = json_decode($row->normalized_payload, true);
                    if (is_array($decoded)) $payload = $decoded;
                } elseif (is_string($row->payload)) {
                    $decoded = json_decode($row->payload, true);
                    if (is_array($decoded)) $payload = $decoded;
                }
                $item = [
                    'id' => (int) $row->id,
                    'institution_name' => $payload['name'] ?? null,
                    'institution_slug' => $payload['slug'] ?? null,
                    'institution_type' => $payload['institution_type'] ?? null,
                    'requested_status' => $payload['status'] ?? null,
                    'batch_id' => (int) $row->import_batch_id,
                    'row_number' => (int) $row->row_number,
                    'status' => $row->status,
                    'batch_status' => $row->batch_status,
                    'batch_source_id' => $row->batch_source_id === null ? null : (int) $row->batch_source_id,
                    'source_status' => $schema::hasTable('sources') && $row->batch_source_id !== null
                        ? $db::table('sources')->where('id', $row->batch_source_id)->value('status')
