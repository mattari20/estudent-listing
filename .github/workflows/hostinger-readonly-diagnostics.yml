name: Hostinger Read-only Diagnostics

on:
  push:
    branches:
      - main
  schedule:
    # Automatically re-check Hostinger revision alignment every six hours.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      project_path:
        description: "Absolute path to the existing Institutes Laravel project (directory containing artisan)"
        required: true
        type: string
        default: "/home/u537436044/domains/estudent.pk/public_html/institutes"

permissions:
  contents: read

concurrency:
  group: hostinger-readonly-diagnostics
  cancel-in-progress: false

jobs:
  diagnostics:
    name: Run read-only Institutes diagnostics over SSH
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository for revision comparison
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve latest application-code revision
        id: app_revision
        shell: bash
        run: |
          # Workflow/docs-only commits do not require application deployment.
          revision="$(git log -1 --format=%H -- app bootstrap config database resources routes composer.json composer.lock public artisan)"
          if [[ -z "$revision" ]]; then
            echo "::error::Could not determine the latest application-code revision."
            exit 1
          fi
          echo "expected_revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Run diagnostics on Hostinger
        uses: appleboy/ssh-action@v1.2.0
        env:
          PROJECT_PATH: ${{ inputs.project_path || '/home/u537436044/domains/estudent.pk/public_html/institutes' }}
          EXPECTED_REVISION: ${{ steps.app_revision.outputs.expected_revision }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          envs: PROJECT_PATH,EXPECTED_REVISION
          command_timeout: 3m
          script: |
            set -eu
            case "$PROJECT_PATH" in
              /*) ;;
              *) echo "ERROR: project_path must be an absolute path"; exit 2 ;;
            esac
            case "$PROJECT_PATH" in
              *".."*) echo "ERROR: project_path must not contain .."; exit 2 ;;
            esac
            if [ ! -f "$PROJECT_PATH/artisan" ]; then
              echo "ERROR: artisan not found in the supplied project_path"
              exit 3
            fi
            cd "$PROJECT_PATH"
            echo "=== Application environment ==="
            php artisan env
            echo "=== Laravel scheduled task definitions (read-only) ==="
            php artisan schedule:list --no-ansi
            echo "=== Import-batch duplicate_rows schema/migration verification (read-only) ==="
            php <<'PHP'
            <?php
            require __DIR__.'/vendor/autoload.php';
            $app = require __DIR__.'/bootstrap/app.php';
            $app->make(\Illuminate\\Contracts\\Console\\Kernel::class)->bootstrap();

            $schema = \Illuminate\\Support\\Facades\\Schema::class;
            $db = \Illuminate\\Support\\Facades\\DB::class;
            $table = 'import_batches';
            $migration = '2026_10_23_000001_add_duplicate_rows_to_import_batches_table';
            $tableExists = $schema::hasTable($table);
            $columnExists = $tableExists && $schema::hasColumn($table, 'duplicate_rows');
            $migrationFileExists = is_file(base_path('database/migrations/'.$migration.'.php'));
            $migrationLedgerExists = $schema::hasTable('migrations');
            $migrationRows = [];
            if ($migrationLedgerExists) {
                $migrationRows = $db::table('migrations')
                    ->where('migration', $migration)
                    ->orderBy('batch')
                    ->get(['migration', 'batch'])
                    ->map(fn ($row) => ['migration' => $row->migration, 'batch' => (int) $row->batch])
                    ->all();
            }
            $migrationApplied = count($migrationRows) > 0;
            $diagnosis = match (true) {
                ! $tableExists => 'IMPORT_BATCHES_TABLE_MISSING',
                ! $columnExists && ! $migrationApplied => 'COLUMN_MISSING_MIGRATION_NOT_RECORDED',
                ! $columnExists && $migrationApplied => 'SCHEMA_DRIFT_MIGRATION_RECORDED_COLUMN_MISSING',
                $columnExists && ! $migrationApplied => 'COLUMN_PRESENT_MIGRATION_NOT_RECORDED',
                default => 'COLUMN_AND_MIGRATION_LEDGER_CONSISTENT',
            };
            echo json_encode([
                'check' => 'import_batches_duplicate_rows_schema_verification',
                'checked_at' => now()->toIso8601String(),
                'mutation_performed' => false,
                'table' => $table,
                'table_exists' => $tableExists,
                'duplicate_rows_column_exists' => $columnExists,
                'migration_name' => $migration,
                'migration_file_exists' => $migrationFileExists,
                'migration_ledger_exists' => $migrationLedgerExists,
                'migration_applied' => $migrationApplied,
                'matching_migration_rows' => $migrationRows,
                'diagnosis' => $diagnosis,
            ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES), PHP_EOL;
            PHP

            echo "=== Discovery outcome schema/migration verification (read-only) ==="
            php <<'PHP'
            <?php
            require __DIR__.'/vendor/autoload.php';
            $app = require __DIR__.'/bootstrap/app.php';
            $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $schema = \Illuminate\Support\Facades\Schema::class;
            $db = \Illuminate\Support\Facades\DB::class;
            $table = 'institute_discovery_run_outcomes';
            $tableExists = $schema::hasTable($table);
            $migrationTableExists = $schema::hasTable('migrations');
            $migrationApplied = false;
            $migrationRows = [];
            if ($migrationTableExists) {
                $migrationRows = $db::table('migrations')
                    ->where('migration', 'like', '%create_institute_discovery_run_outcomes_table%')
                    ->orderBy('migration')
                    ->get(['migration', 'batch'])
                    ->map(fn ($row) => ['migration' => $row->migration, 'batch' => (int) $row->batch])
                    ->all();
                $migrationApplied = count($migrationRows) > 0;
            }
            echo json_encode([
                'check' => 'discovery_outcome_schema_verification',
                'checked_at' => now()->toIso8601String(),
                'mutation_performed' => false,
                'outcome_table' => $table,
                'outcome_table_exists' => $tableExists,
                'migrations_table_exists' => $migrationTableExists,
                'migration_applied' => $migrationApplied,
                'matching_migrations' => $migrationRows,
            ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES), PHP_EOL;
            PHP
            echo "=== Discovery review package storage boundary (read-only) ==="
            php <<'PHP'
            <?php
            require __DIR__.'/vendor/autoload.php';
            $app = require __DIR__.'/bootstrap/app.php';
            $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $disk = \Illuminate\Support\Facades\Storage::disk('local');
            $publicRoot = realpath(public_path());
            $packagePath = $disk->path('institute-discovery-review-packages');
            $existingPath = realpath($packagePath);
            $parentPath = realpath(dirname($packagePath));
            $resolvedPackagePath = $existingPath ?: ($parentPath ? $parentPath.DIRECTORY_SEPARATOR.basename($packagePath) : null);
            $insidePublicRoot = $publicRoot !== false && $resolvedPackagePath !== null
                && ($resolvedPackagePath === $publicRoot || strpos($resolvedPackagePath, $publicRoot.DIRECTORY_SEPARATOR) === 0);
            $files = [];
            if ($existingPath && is_dir($existingPath)) {
                $iterator = new \RecursiveIteratorIterator(
                    new \RecursiveDirectoryIterator($existingPath, \FilesystemIterator::SKIP_DOTS)
                );
                foreach ($iterator as $file) {
                    if ($file->isFile() && in_array($file->getFilename(), ['candidates.csv', 'manifest.json'], true)) {
                        $files[] = $file->getPathname();
                    }
                }
            }
            $report = [
                'check' => 'discovery_review_package_storage_boundary',
                'mutation_performed' => false,
                'local_disk_driver' => config('filesystems.disks.local.driver'),
                'public_root_resolved' => $publicRoot !== false,
                'package_root_resolved' => $resolvedPackagePath !== null,
                'package_root_inside_public_root' => $insidePublicRoot,
                'package_root_exists' => $existingPath !== false,
                'private_package_files_found' => count($files),
            ];
            echo json_encode($report, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES), PHP_EOL;
            if ($publicRoot === false || $resolvedPackagePath === null || $insidePublicRoot) {
                fwrite(STDERR, "ERROR: discovery package storage is not proven outside the public web root\n");
                exit(21);
            }
            PHP
            echo "=== Hostinger scheduler cron presence (read-only; command contents suppressed) ==="
            # Distinguish an explicitly empty user crontab from an unreadable or
            # otherwise failing crontab command. Never print scheduler command contents.
            set +e
            CRON_OUTPUT="$(crontab -l 2>&1)"
            CRON_STATUS=$?
            set -e
            if [ "$CRON_STATUS" -eq 0 ]; then
              if printf '%s\n' "$CRON_OUTPUT" | grep -Eq 'artisan[[:space:]]+schedule:run|schedule:run[[:space:]]'; then
                echo "hostinger_scheduler_cron=present"
              else
                echo "hostinger_scheduler_cron=missing"
                echo "hostinger_scheduler_cron_evidence=crontab_read_succeeded_no_laravel_schedule_entry"
              fi
            elif printf '%s\n' "$CRON_OUTPUT" | grep -Eiq 'no crontab for'; then
              echo "hostinger_scheduler_cron=missing"
              echo "hostinger_scheduler_cron_evidence=crontab_reports_no_user_crontab"
            else
              echo "hostinger_scheduler_cron=unreadable"
              echo "hostinger_scheduler_cron_exit_code=$CRON_STATUS"
              echo "hostinger_scheduler_cron_evidence=crontab_command_failed_or_access_denied"
            fi
            echo "=== Deployed code revision (read-only) ==="
            DEPLOYMENT_DRIFT=0
            if git rev-parse --show-toplevel >/dev/null 2>&1; then
              DEPLOYED_REVISION="$(git rev-parse HEAD)"
              echo "deployed_revision=$DEPLOYED_REVISION"
              echo "expected_application_revision=$EXPECTED_REVISION"
              # Compare deployed application paths, not full commit IDs. Documentation-only
              # commits can advance main without requiring an application deployment.
              # Use the same fail-closed content comparison as discovery/deployment.
              # A shallow checkout can make a docs-only tip look like an application revision.
              if [ -f .git/shallow ]; then
                git fetch --quiet --no-tags --unshallow origin main || DEPLOYMENT_DRIFT=1
              else
                git fetch --quiet --no-tags origin main || DEPLOYMENT_DRIFT=1
              fi
              if ! git cat-file -e "$EXPECTED_REVISION^{commit}" 2>/dev/null; then
                git fetch --quiet --no-tags origin "$EXPECTED_REVISION" || DEPLOYMENT_DRIFT=1
              fi
              git fetch --quiet --no-tags origin main || DEPLOYMENT_DRIFT=1
              APP_CODE_PATHS='app bootstrap config database resources routes composer.json composer.lock public artisan'
              if [ "$DEPLOYMENT_DRIFT" -eq 0 ] &&
                git cat-file -e "$EXPECTED_REVISION^{commit}" 2>/dev/null &&
                git merge-base --is-ancestor "$EXPECTED_REVISION" FETCH_HEAD &&
                git diff --quiet "$EXPECTED_REVISION" "$DEPLOYED_REVISION" -- $APP_CODE_PATHS &&
                git diff --quiet HEAD -- $APP_CODE_PATHS &&
                git diff --cached --quiet HEAD -- $APP_CODE_PATHS; then
                echo "deployment_revision_status=APPLICATION_CODE_MATCH"
                echo "application_code_parity=match"
                echo "application_code_parity_method=git_diff_target_vs_deployed_paths"
                DEPLOYMENT_DRIFT=0
              else
                echo "deployment_revision_status=APPLICATION_CODE_DRIFT_OR_UNVERIFIABLE"
                echo "application_code_parity=mismatch_or_unverifiable"
                DEPLOYMENT_DRIFT=1
              fi
            else
              echo "deployed_revision=git_metadata_unavailable"
              echo "expected_application_revision=$EXPECTED_REVISION"
              echo "deployment_revision_status=UNVERIFIABLE"
              DEPLOYMENT_DRIFT=1
            fi
            echo "=== Canonical institution identity export (read-only; names and slugs only) ==="
            php <<'PHP'
            <?php
            require __DIR__.'/vendor/autoload.php';
            $app = require __DIR__.'/bootstrap/app.php';
            $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $rows = \Illuminate\Support\Facades\DB::table('institutions')
                ->orderBy('id')
                ->get(['id', 'name', 'official_name', 'short_name', 'slug', 'status']);
            $aliases = \Illuminate\Support\Facades\DB::table('institution_names')
                ->orderBy('institution_id')
                ->orderBy('name')
                ->get(['institution_id', 'name', 'name_type', 'language', 'is_current'])
                ->groupBy('institution_id');
            echo json_encode([
                'check' => 'canonical_institution_identity_export',
                'mutation_performed' => false,
                'record_count' => $rows->count(),
                'institutions' => $rows->map(fn ($row) => [
                    'id' => (int) $row->id,
                    'name' => $row->name,
                    'official_name' => $row->official_name,
                    'short_name' => $row->short_name,
                    'slug' => $row->slug,
                    'status' => $row->status,
                    'aliases' => ($aliases->get($row->id, collect()))->map(fn ($alias) => [
                        'name' => $alias->name,
                        'name_type' => $alias->name_type,
                        'language' => $alias->language,
                        'is_current' => (bool) $alias->is_current,
                    ])->values()->all(),
                ])->values()->all(),
                'alias_record_count' => $aliases->flatten(1)->count(),
            ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES), PHP_EOL;
            PHP
            echo "=== Latest Laravel exception fingerprint (read-only; message and request data omitted) ==="
            php <<'PHP'
            <?php
            $path = __DIR__.'/storage/logs/laravel.log';
            if (!is_file($path) || !is_readable($path)) {
                echo json_encode(['check' => 'latest_laravel_exception_fingerprint', 'available' => false, 'reason' => 'log_unavailable'], JSON_PRETTY_PRINT), PHP_EOL;
                exit(0);
            }
            $lines = file($path, FILE_IGNORE_NEW_LINES);
            $result = ['check' => 'latest_laravel_exception_fingerprint', 'available' => false, 'message_emitted' => false];
            foreach (array_reverse($lines) as $line) {
                if (!preg_match('/(?:production|local)\.ERROR:/', $line)) continue;
                $result['available'] = true;
                $result['exception_class'] = 'unparsed';
                $result['source_location'] = null;
                if (preg_match('/(?:production|local)\.ERROR:\s*([A-Za-z_\\\\][A-Za-z0-9_\\\\]*)/', $line, $matches)) {
                    $result['exception_class'] = $matches[1];
                }
                // Emit only narrow SQL error fingerprints; never emit SQL text or the raw exception message.
                if (preg_match('/SQLSTATE\[([A-Z0-9]+)\]/', $line, $matches)) {
                    $result['sqlstate_code'] = $matches[1];
                }
                if (preg_match('/Column not found:\s*(\d+)/i', $line, $matches)) {
                    $result['driver_error_code'] = $matches[1];
                }
                if (preg_match("/Unknown column '([^']+)'/i", $line, $matches)) {
                    $result['unknown_column'] = $matches[1];
                }
                if (preg_match('/(?: in | at )(\/[^:\s]+:\d+)/', $line, $matches)) {
                    $result['source_location'] = basename(dirname($matches[1])).'/'.basename($matches[1]);
                }
                if (preg_match('/^\[([^]]+)\]/', $line, $time)) $result['logged_at'] = $time[1];
                break;
            }
            echo json_encode($result, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES), PHP_EOL;
            PHP
            echo "=== Profile-to-canonical-record trace (read-only) ==="
            php <<'PHP'
            <?php
            require __DIR__.'/vendor/autoload.php';
            $app = require __DIR__.'/bootstrap/app.php';
            $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $db = \Illuminate\Support\Facades\DB::class;
            $report = ['check' => 'institution_profile_record_trace', 'mutation_performed' => false, 'institutions' => []];
            foreach (['lahore-university-of-management-sciences', 'university-of-veterinary-and-animal-sciences-lahore'] as $slug) {
                $institution = $db::table('institutions')->where('slug', $slug)->first(['id', 'name', 'slug', 'status']);
                if (!$institution) {
                    $report['institutions'][] = ['requested_slug' => $slug, 'found' => false];
                    continue;
                }
                $campuses = $db::table('campuses')->where('institution_id', $institution->id)
                    ->orderBy('id')->get(['id', 'name', 'slug', 'status', 'geography_id']);
                $programs = $db::table('programs')->where('institution_id', $institution->id)
                    ->orderBy('id')->get(['id', 'name', 'slug', 'status']);
                $report['institutions'][] = [
                    'id' => (int) $institution->id,
                    'name' => $institution->name,
                    'slug' => $institution->slug,
                    'status' => $institution->status,
                    'active_campus_count' => $campuses->where('status', 'active')->count(),
                    'campuses' => $campuses->map(fn ($row) => [
                        'id' => (int) $row->id,
                        'name' => $row->name,
                        'slug' => $row->slug,
                        'status' => $row->status,
                        'geography_id' => $row->geography_id === null ? null : (int) $row->geography_id,
                    ])->values()->all(),
                    'active_program_count' => $programs->where('status', 'active')->count(),
                    'programs' => $programs->map(fn ($row) => [
                        'id' => (int) $row->id,
                        'name' => $row->name,
                        'slug' => $row->slug,
                        'status' => $row->status,
                    ])->values()->all(),
                ];
            }
            echo json_encode($report, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES), PHP_EOL;
            PHP
            echo "=== Data-gap report (read-only) ==="
            php artisan institutes:data-gap-report --json
            echo "=== Official-source refresh schema/index/migration-ledger readiness (read-only) ==="
            php <<'PHP'
            <?php
            require __DIR__.'/vendor/autoload.php';
            $app = require __DIR__.'/bootstrap/app.php';
            $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();

            $schema = \Illuminate\Support\Facades\Schema::class;
            $db = \Illuminate\Support\Facades\DB::class;
            $table = 'official_source_refresh_events';
            $migration = '2026_10_25_000002_create_official_source_refresh_events_table';
            $migrationFile = base_path('database/migrations/'.$migration.'.php');
            $requiredColumns = [
                'id', 'source_id', 'source_change_observation_id', 'canonical_type',
                'canonical_id', 'field_name', 'before_value', 'after_value',
                'evidence_url', 'evidence_excerpt', 'content_fingerprint',
                'observed_at', 'occurred_at', 'created_at', 'updated_at',
            ];
            $requiredIndexes = [
                'official_refresh_source_idx' => ['source_id'],
                'official_refresh_observation_idx' => ['source_change_observation_id'],
                'official_refresh_canonical_field_idx' => ['canonical_type', 'canonical_id', 'field_name'],
            ];
            $tableExists = $schema::hasTable($table);
            $columnsPresent = [];
            $missingColumns = [];
            $indexes = [];
            $missingIndexes = $requiredIndexes;
            $satisfiedBy = [];
            if ($tableExists) {
                foreach ($requiredColumns as $column) {
                    if ($schema::hasColumn($table, $column)) {
                        $columnsPresent[] = $column;
                    } else {
                        $missingColumns[] = $column;
                    }
                }
                foreach ($schema::getIndexes($table) as $index) {
                    $name = $index['name'] ?? null;
                    $columns = array_values($index['columns'] ?? []);
                    $unique = (bool) ($index['unique'] ?? false);
                    $indexes[] = ['name' => $name, 'columns' => $columns, 'unique' => $unique];
                    if (!$unique) {
                        foreach ($requiredIndexes as $requiredName => $requiredIndexColumns) {
                            if ($columns === $requiredIndexColumns) {
                                $satisfiedBy[$requiredName] = $name;
                                unset($missingIndexes[$requiredName]);
                            }
                        }
                    }
                }
            }
            $ledgerTableExists = $schema::hasTable('migrations');
            $ledgerRows = [];
            if ($ledgerTableExists) {
                $ledgerRows = $db::table('migrations')->where('migration', $migration)
                    ->get(['migration', 'batch'])
                    ->map(fn ($row) => ['migration' => $row->migration, 'batch' => (int) $row->batch])->all();
            }
            $schemaReady = $tableExists && $missingColumns === [] && $missingIndexes === [];
            echo json_encode([
                'check' => 'official_source_refresh_schema_readiness',
                'checked_at' => now()->toIso8601String(),
                'mutation_performed' => false,
                'table' => $table,
                'table_exists' => $tableExists,
                'required_columns_present' => $columnsPresent,
                'missing_columns' => $missingColumns,
                'existing_indexes' => $indexes,
                'required_non_unique_indexes' => $requiredIndexes,
                'missing_required_indexes' => $missingIndexes,
                'equivalent_index_satisfied_by' => $satisfiedBy,
                'migration_file_exists' => is_file($migrationFile),
                'migration_ledger_table_exists' => $ledgerTableExists,
                'matching_migration_ledger_rows' => $ledgerRows,
                'schema_ready' => $schemaReady,
                'ledger_ready' => count($ledgerRows) > 0,
                'next_action' => !$tableExists || $missingColumns !== []
                    ? 'review_missing_table_or_columns_before_any_write'
                    : ($missingIndexes !== []
                        ? 'review_additive_index_repair_separately'
                        : (count($ledgerRows) === 0
                            ? 'review_ledger_only_reconciliation_separately'
                            : 'schema_and_ledger_ready')),
            ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES), PHP_EOL;
            PHP
            echo "=== Discovery profile parent validation (read-only) ==="
            php <<'PHP'
            <?php
            require __DIR__.'/vendor/autoload.php';
            $app = require __DIR__.'/bootstrap/app.php';
            $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $db = \Illuminate\Support\Facades\DB::class;

            $institutions = $db::table('institutions')
                ->orderBy('id')
                ->get(['id', 'name', 'official_name', 'short_name', 'slug', 'institution_type', 'status']);

            $profiles = collect(config('institute_agent.profiles', []))->map(
                function (array $definition, string $profileKey) use ($institutions): array {
                    $parentSlug = (string) ($definition['institution_slug'] ?? '');
                    $parent = $institutions->firstWhere('slug', $parentSlug);
                    $identity = strtolower(implode(' ', array_filter([
                        $parent->name ?? null,
                        $parent->official_name ?? null,
                        $parent->short_name ?? null,
                        $parent->institution_type ?? null,
                        $parent->slug ?? null,
                    ])));
                    $campusLike = preg_match('/(^|[^a-z])campus([^a-z]|$)/', $identity) === 1;
                    $enabled = ($definition['monitoring']['enabled'] ?? true) === true;

                    $action = ! $parent
                        ? 'resolve_missing_canonical_parent_slug'
                        : ($campusLike
                            ? 'resolve_campus_like_parent_before_discovery'
                            : (! $enabled ? 'disabled_by_profile_configuration' : 'ready_for_discovery'));

                    return [
                        'profile' => $profileKey,
                        'entity_type' => $definition['entity_type'] ?? null,
                        'enabled' => $enabled,
                        'source_url' => $definition['source']['url'] ?? null,
                        'configured_parent_slug' => $parentSlug,
                        'parent_found' => $parent !== null,
                        'parent_id' => $parent ? (int) $parent->id : null,
                        'parent_name' => $parent->name ?? null,
                        'parent_slug' => $parent->slug ?? null,
                        'parent_institution_type' => $parent->institution_type ?? null,
                        'campus_like_parent' => $campusLike,
                        'next_action' => $action,
                    ];
                }
            )->values();

            $comsatsCandidates = $institutions->filter(fn ($institution): bool =>
                str_contains(strtolower((string) $institution->name), 'comsats')
                || str_contains(strtolower((string) $institution->official_name), 'comsats')
                || str_contains(strtolower((string) $institution->short_name), 'comsats')
                || str_contains(strtolower((string) $institution->slug), 'comsats')
            )->map(fn ($institution): array => [
                'institution_id' => (int) $institution->id,
                'name' => $institution->name,
                'official_name' => $institution->official_name,
                'short_name' => $institution->short_name,
                'slug' => $institution->slug,
                'institution_type' => $institution->institution_type,
                'status' => $institution->status,
            ])->values();

            echo json_encode([
                'check' => 'discovery_profile_parent_validation',
