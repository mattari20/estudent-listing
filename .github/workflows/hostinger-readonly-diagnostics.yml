                }

                $item['canonical_institution_status'] = null;
                if ($row->parent_subject_type === 'App\\Models\\Institution' && $row->parent_subject_id !== null
                    && $schema::hasTable('institutions')) {
                    $item['canonical_institution_status'] = $db::table('institutions')
                        ->where('id', $row->parent_subject_id)->value('status');
                }
                if ($schema::hasTable('institutions') && $schema::hasColumn('import_rows', 'canonical_subject_type')
                    && $schema::hasColumn('import_rows', 'canonical_subject_id')) {
                    $canonical = $db::table('import_rows')->where('id', $row->id)
                        ->first(['canonical_subject_type', 'canonical_subject_id']);
                    if ($canonical && $canonical->canonical_subject_type === 'App\\Models\\Institution'
                        && $canonical->canonical_subject_id !== null) {
                        $item['canonical_institution_status'] = $db::table('institutions')
                            ->where('id', $canonical->canonical_subject_id)->value('status');
                    }
                }

                if ($schema::hasTable('identity_resolution_decisions')) {
                    $decisionQuery = $db::table('identity_resolution_decisions');
                    if ($schema::hasColumn('identity_resolution_decisions', 'import_row_id')) {
                        $item['identity_decisions'] = $decisionQuery->where('import_row_id', $row->id)
                            ->orderBy('id')->get()->map(function ($decision) {
                                $result = [];
                                foreach (['decision', 'status', 'match_type', 'canonical_institution_id'] as $field) {
                                    if (isset($decision->$field)) {
                                        $result[$field] = $decision->$field;
                                    }
                                }
                                return $result;
                            })->values()->all();
                    }
                }

                // Keep the SSH trace aligned with the application's read-only audit.
                // Recommendations are advisory only and never authorize mutations.
                $item['review_reasons'] = [];
                $rowStatus = (string) ($item['status'] ?? '');
                $eventType = (string) ($item['latest_promotion_event_type'] ?? '');
                $validationErrorCount = (int) ($item['validation_error_count'] ?? 0);
                $promotionDecisions = $item['promotion_decisions'] ?? [];
                $hasApprovedPromotionDecision = in_array('approved', $promotionDecisions, true);
                $item['has_approved_promotion_decision'] = $hasApprovedPromotionDecision;

                if ($rowStatus === 'promoted') {
                    $item['review_disposition'] = 'retain_promoted_history';
                    $item['review_reasons'][] = 'Row is already promoted; retain its audit history.';
                } elseif ($rowStatus === 'duplicate' || ($item['match_state'] ?? null) === 'duplicate') {
                    $item['review_disposition'] = 'verify_duplicate_link';
                    $item['review_reasons'][] = 'Verify the canonical match and dependency links before any archival decision.';
                } elseif ($validationErrorCount > 0) {
                    $item['review_disposition'] = 'correct_validation_errors';
                    $item['review_reasons'][] = 'Validation errors are recorded; inspect private validation details before retrying.';
                } elseif ($rowStatus === 'rejected' || $eventType === 'promotion_rejected') {
                    $item['review_disposition'] = 'review_rejection';
                    $item['review_reasons'][] = 'Preserve the rejection audit trail and inspect the decision/event reason before reprocessing.';
                } elseif (in_array($eventType, ['promotion_failed', 'promotion_error'], true)) {
                    $item['review_disposition'] = 'investigate_promotion_failure';
                    $item['review_reasons'][] = 'A promotion failure event exists; inspect its private details before retrying.';
                } elseif (! $hasApprovedPromotionDecision) {
                    $item['review_disposition'] = 'review_promotion_decision';
                    $item['review_reasons'][] = 'No approved promotion decision is recorded; do not promote or publish automatically.';
                } else {
                    $item['review_disposition'] = 'manual_review';
                    $item['review_reasons'][] = 'Available audit fields do not establish a safe automated disposition.';
                }

                $report['rows'][] = $item;
            }
            echo json_encode($report, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES), PHP_EOL;
            PHP
            echo "=== Campus import row trace (read-only; no payloads or notes) ==="
            php <<'PHP'
            <?php
            require __DIR__.'/vendor/autoload.php';
            $app = require __DIR__.'/bootstrap/app.php';
            $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();

            $rows = \Illuminate\Support\Facades\DB::table('import_rows')
                ->join('import_batches', 'import_batches.id', '=', 'import_rows.import_batch_id')
                ->where('import_batches.entity_type', 'campus')
                ->orderBy('import_rows.import_batch_id')
                ->orderBy('import_rows.row_number')
                ->get([
                    'import_rows.id',
                    'import_rows.import_batch_id',
                    'import_rows.row_number',
                    'import_rows.status',
                    'import_rows.match_state',
                    'import_rows.parent_subject_type',
                    'import_rows.parent_subject_id',
                    'import_rows.validation_errors',
                ]);

            $report = ['check' => 'campus_import_row_trace', 'mutation_performed' => false, 'rows' => []];
            foreach ($rows as $row) {
                $errors = $row->validation_errors;
                if (is_string($errors)) {
                    $errors = json_decode($errors, true);
                }
                $reportRow = [
                    'id' => (int) $row->id,
                    'batch_id' => (int) $row->import_batch_id,
                    'row_number' => (int) $row->row_number,
                    'status' => $row->status,
                    'match_state' => $row->match_state,
                    'parent_subject_type' => $row->parent_subject_type,
                    'parent_subject_id' => $row->parent_subject_id === null ? null : (int) $row->parent_subject_id,
                    'validation_error_fields' => is_array($errors) ? array_keys($errors) : [],
                    'validation_error_count' => is_array($errors) ? array_sum(array_map(
                        fn ($messages) => is_array($messages) ? count($messages) : (is_string($messages) && trim($messages) !== '' ? 1 : 0),
                        $errors,
                    )) : 0,
                    'has_approved_promotion_decision' => \Illuminate\Support\Facades\Schema::hasTable('import_promotion_decisions')
                        && \Illuminate\Support\Facades\DB::table('import_promotion_decisions')
                            ->where('import_row_id', $row->id)->where('decision', 'approved')->exists(),
                ];
                if (\Illuminate\Support\Facades\Schema::hasTable('import_promotion_events')) {
                    $event = \Illuminate\Support\Facades\DB::table('import_promotion_events')
                        ->where('import_row_id', $row->id)->orderByDesc('occurred_at')->orderByDesc('id')
                        ->first(['event_type', 'metadata']);
                    $metadata = isset($event->metadata) ? json_decode((string) $event->metadata, true) : [];
                    $reportRow['latest_promotion_event_type'] = $event->event_type ?? null;
                    $reportRow['latest_promotion_error_class'] = is_array($metadata) ? ($metadata['error_class'] ?? null) : null;
                }
                $report['rows'][] = $reportRow;
            }
            echo json_encode($report, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES), PHP_EOL;
            PHP
            if [ "$DEPLOYMENT_DRIFT" -ne 0 ]; then
              echo "ERROR: Hostinger deployed revision does not match this GitHub Actions revision."
              echo "Diagnostics were read-only; no production records were changed."
              exit 10
            fi

      - name: Verify public directory and API response contracts
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://estudent.pk"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          inspect_response() {
            local label="$1"
            local url="$2"
            local expect_json="$3"
            local body="$workdir/$label.body"
            local headers="$workdir/$label.headers"
            local status content_type
            status="$(curl --silent --show-error --max-time 25 --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$url")" || {
              echo "$label request_transport=FAILED"
              return 1
            }
            content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); value=$0} END{print value}' "$headers")"
            if [[ -z "$content_type" ]]; then content_type="missing"; fi
            echo "$label request_url=$url"
            echo "$label http_status=$status"
            echo "$label content_type=$content_type"
            echo "$label response_bytes=$(wc -c < "$body" | tr -d ' ')"
            if [[ "$expect_json" == "true" ]]; then
              if jq -e 'type == "object" and (.data | type == "array") and (.total | type == "number") and (.current_page | type == "number") and (.last_page | type == "number")' "$body" >/dev/null 2>&1; then
                jq -c '{json_valid:true,data_count:(.data|length),ids:(.data|map(.id)),total,current_page,last_page,from,to,per_page}' "$body" | sed "s/^/$label json_summary=/"
                jq -c '{data:(.data|map({id,name,slug,status})),total,current_page,last_page,from,to,per_page} | tojson | .[0:500]' "$body" | sed "s/^/$label sanitized_response_body=/"
                echo "$label json_contract=PASS"
              else
                echo "$label json_contract=FAIL_OR_UNEXPECTED_SHAPE"
                head -c 400 "$body" | tr '\r\n\t' '   ' | sed "s/^/$label sanitized_body_prefix=/"
                echo
              fi
              [[ "$status" == "200" && "$content_type" == application/json* ]] || return 1
              jq -e 'type == "object" and (.data | type == "array") and (.total | type == "number") and (.current_page | type == "number") and (.last_page | type == "number")' "$body" >/dev/null
            else
              [[ "$status" == "200" && "$content_type" == text/html* ]] || return 1
              echo "$label html_contract=PASS"
            fi
          }

          inspect_response directory_page "$BASE_URL/institutes/" false

          # Derive candidate base paths from the known subfolder layout and capture
          # redirects rather than following into WordPress fallback pages.
          api_base=""
          declare -a api_candidates=(
            "$BASE_URL/institutes/api/v1/institutions"
            "$BASE_URL/institutes/v1/institutions"
            "$BASE_URL/api/v1/institutions"
          )
          for candidate in "${api_candidates[@]}"; do
            probe_body="$workdir/api-probe.body"
            probe_headers="$workdir/api-probe.headers"
            probe_status="$(curl --silent --show-error --max-time 25 --max-redirs 0 --dump-header "$probe_headers" --output "$probe_body" --write-out '%{http_code}' "$candidate?per_page=2" || true)"
            probe_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); value=$0} END{print value}' "$probe_headers")"
            probe_bytes="$(wc -c < "$probe_body" | tr -d ' ')"
            probe_redirect="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); value=$0} END{print value}' "$probe_headers")"
            echo "institutions_api_candidate_path=${candidate#"$BASE_URL"}"
            echo "institutions_api_candidate_status=$probe_status"
            echo "institutions_api_candidate_content_type=${probe_type:-missing}"
            echo "institutions_api_candidate_bytes=$probe_bytes"
            if [[ -n "$probe_redirect" ]]; then
              echo "institutions_api_candidate_redirect=${probe_redirect%%\?*}"
            fi
            if [[ "$probe_status" == "200" && "$probe_type" == application/json* ]] && jq -e 'type == "object" and (.data | type == "array") and (.total | type == "number") and (.current_page | type == "number") and (.last_page | type == "number")' "$probe_body" >/dev/null 2>&1; then
              api_base="$candidate"
              echo "institutions_api_base_path=PASS"
              echo "institutions_api_base_url=$candidate"
              break
            fi
          done
          if [[ -z "$api_base" ]]; then
            echo "institutions_api_base_path=FAIL_NO_VALID_JSON_ENDPOINT"
            echo "No candidate returned HTTP 200 + application/json + a Laravel paginator contract."
            exit 1
          fi

          inspect_response institutions_api_page_1 "${api_base}?per_page=2" true
          inspect_response institutions_api_search "${api_base}?q=COMSATS&per_page=2" true
          inspect_response institutions_api_page_2 "${api_base}?per_page=2&page=2" true

          total="$(jq -r '.total' "$workdir/institutions_api_page_1.body")"
          if [[ "$total" =~ ^[0-9]+$ ]] && (( total > 2 )); then
            jq -en --slurpfile first "$workdir/institutions_api_page_1.body" --slurpfile second "$workdir/institutions_api_page_2.body" '
              ($first[0].data | map(.id)) as $a |
              ($second[0].data | map(.id)) as $b |
              (($b | length) > 0) and ([ $a[] as $id | select($b | index($id)) ] | length == 0)
            ' >/dev/null
            echo "institutions_api_pagination=PASS"
          else
            echo "institutions_api_pagination=NOT_APPLICABLE_TOTAL_LE_2"
          fi

      - name: Verify guest denial for operator-only discovery endpoints
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://estudent.pk/institutes"
          check_guest_denied() {
            local path="$1"
            local label="$2"
            local response
            response="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code} %{redirect_url}' "$BASE_URL$path")" || {
              echo "ERROR: request failed for $label"
              return 1
            }
            local status="${response%% *}"
            local redirect="${response#* }"
            echo "$label http_status=$status redirect_target=${redirect:-none}"
            case "$status" in
              302|401|403) ;;
              *)
                echo "ERROR: guest request was not denied for $label"
                return 1
                ;;
            esac
            if [[ "$status" == "302" && "$redirect" != *"/institutes/login"* ]]; then
              echo "ERROR: guest was redirected somewhere other than the Institutes login for $label"
              return 1
            fi
          }
          check_guest_denied "/operations/discovery-run-history" "guest_discovery_history"
          check_guest_denied "/operations/discovery-packages/999999999/csv" "guest_discovery_package_download"
          echo "live_guest_denial_status=PASS"
