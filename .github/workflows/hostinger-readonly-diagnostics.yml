name: Hostinger Read-only Diagnostics

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      project_path:
        description: "Absolute path to the existing Institutes Laravel project (directory containing artisan)"
        required: true
        type: string
        default: "/home/u537436044/domains/estudent.pk/public_html/institutes"

permissions:
  contents: read

concurrency:
  group: hostinger-readonly-diagnostics
  cancel-in-progress: false

jobs:
  diagnostics:
    name: Run read-only Institutes diagnostics over SSH
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run diagnostics on Hostinger
        uses: appleboy/ssh-action@v1.2.0
        env:
          PROJECT_PATH: ${{ inputs.project_path || '/home/u537436044/domains/estudent.pk/public_html/institutes' }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          envs: PROJECT_PATH
          command_timeout: 3m
          script: |
            set -eu
            case "$PROJECT_PATH" in
              /*) ;;
              *) echo "ERROR: project_path must be an absolute path"; exit 2 ;;
            esac
            case "$PROJECT_PATH" in
              *".."*) echo "ERROR: project_path must not contain .."; exit 2 ;;
            esac
            if [ ! -f "$PROJECT_PATH/artisan" ]; then
              echo "ERROR: artisan not found in the supplied project_path"
              exit 3
            fi
            cd "$PROJECT_PATH"
            echo "=== Application environment ==="
            php artisan env
            echo "=== Deployed code revision (read-only) ==="
            if git rev-parse --show-toplevel >/dev/null 2>&1; then
              git rev-parse HEAD
            else
              echo "git_metadata_unavailable"
            fi
            echo "=== Canonical institution identity export (read-only; names and slugs only) ==="
            php <<'PHP'
            <?php
            require __DIR__.'/vendor/autoload.php';
            $app = require __DIR__.'/bootstrap/app.php';
            $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $rows = \Illuminate\Support\Facades\DB::table('institutions')
                ->orderBy('id')
                ->get(['id', 'name', 'official_name', 'short_name', 'slug', 'status']);
            $aliases = \Illuminate\Support\Facades\DB::table('institution_names')
                ->orderBy('institution_id')
                ->orderBy('name')
                ->get(['institution_id', 'name', 'name_type', 'language', 'is_current'])
                ->groupBy('institution_id');
            echo json_encode([
                'check' => 'canonical_institution_identity_export',
                'mutation_performed' => false,
                'record_count' => $rows->count(),
                'institutions' => $rows->map(fn ($row) => [
                    'id' => (int) $row->id,
                    'name' => $row->name,
                    'official_name' => $row->official_name,
                    'short_name' => $row->short_name,
                    'slug' => $row->slug,
                    'status' => $row->status,
                    'aliases' => ($aliases->get($row->id, collect()))->map(fn ($alias) => [
                        'name' => $alias->name,
                        'name_type' => $alias->name_type,
                        'language' => $alias->language,
                        'is_current' => (bool) $alias->is_current,
                    ])->values()->all(),
                ])->values()->all(),
                'alias_record_count' => $aliases->flatten(1)->count(),
            ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES), PHP_EOL;
            PHP
            echo "=== Profile-to-canonical-record trace (read-only) ==="
            php <<'PHP'
            <?php
            require __DIR__.'/vendor/autoload.php';
            $app = require __DIR__.'/bootstrap/app.php';
            $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $db = \Illuminate\Support\Facades\DB::class;
            $report = ['check' => 'institution_profile_record_trace', 'mutation_performed' => false, 'institutions' => []];
            foreach (['lahore-university-of-management-sciences', 'university-of-veterinary-and-animal-sciences-lahore'] as $slug) {
                $institution = $db::table('institutions')->where('slug', $slug)->first(['id', 'name', 'slug', 'status']);
                if (!$institution) {
                    $report['institutions'][] = ['requested_slug' => $slug, 'found' => false];
                    continue;
                }
                $campuses = $db::table('campuses')->where('institution_id', $institution->id)
                    ->orderBy('id')->get(['id', 'name', 'slug', 'status', 'geography_id']);
                $programs = $db::table('programs')->where('institution_id', $institution->id)
                    ->orderBy('id')->get(['id', 'name', 'slug', 'status']);
                $report['institutions'][] = [
                    'id' => (int) $institution->id,
                    'name' => $institution->name,
                    'slug' => $institution->slug,
                    'status' => $institution->status,
                    'active_campus_count' => $campuses->where('status', 'active')->count(),
                    'campuses' => $campuses->map(fn ($row) => [
                        'id' => (int) $row->id,
                        'name' => $row->name,
                        'slug' => $row->slug,
                        'status' => $row->status,
                        'geography_id' => $row->geography_id === null ? null : (int) $row->geography_id,
                    ])->values()->all(),
                    'active_program_count' => $programs->where('status', 'active')->count(),
                    'programs' => $programs->map(fn ($row) => [
                        'id' => (int) $row->id,
                        'name' => $row->name,
                        'slug' => $row->slug,
                        'status' => $row->status,
                    ])->values()->all(),
                ];
            }
            echo json_encode($report, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES), PHP_EOL;
            PHP
            echo "=== Data-gap report (read-only) ==="
            php artisan institutes:data-gap-report --json
            echo "=== Record-level audit (read-only) ==="
            php artisan institutes:data-gap-record-audit --json
            echo "=== Institution import row trace (read-only; no payloads or notes) ==="
            php <<'PHP'
            <?php
            require __DIR__.'/vendor/autoload.php';
            $app = require __DIR__.'/bootstrap/app.php';
            $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $db = \Illuminate\Support\Facades\DB::class;
            $schema = \Illuminate\Support\Facades\Schema::class;

            $rows = $db::table('import_rows')
                ->join('import_batches', 'import_batches.id', '=', 'import_rows.import_batch_id')
                ->where('import_batches.entity_type', 'institution')
                ->orderBy('import_rows.import_batch_id')
                ->orderBy('import_rows.row_number')
                ->get([
                    'import_rows.id',
                    'import_rows.import_batch_id',
                    'import_rows.row_number',
                    'import_rows.status',
                    'import_rows.match_state',
                    'import_rows.parent_subject_type',
                    'import_rows.parent_subject_id',
                    'import_rows.validation_errors',
                    'import_rows.payload',
                    'import_rows.normalized_payload',
                    'import_batches.status as batch_status',
                    'import_batches.source_id as batch_source_id',
                ]);

            $report = ['check' => 'institution_import_row_trace', 'mutation_performed' => false, 'rows' => []];
            foreach ($rows as $row) {
                $errors = $row->validation_errors;
                if (is_string($errors)) {
                    $errors = json_decode($errors, true);
                }
                $payload = is_array($row->normalized_payload) ? $row->normalized_payload : (is_array($row->payload) ? $row->payload : []);
                if (is_string($row->normalized_payload)) {
                    $decoded = json_decode($row->normalized_payload, true);
                    if (is_array($decoded)) $payload = $decoded;
                } elseif (is_string($row->payload)) {
                    $decoded = json_decode($row->payload, true);
                    if (is_array($decoded)) $payload = $decoded;
                }
                $item = [
                    'id' => (int) $row->id,
                    'institution_name' => $payload['name'] ?? null,
                    'institution_slug' => $payload['slug'] ?? null,
                    'institution_type' => $payload['institution_type'] ?? null,
                    'requested_status' => $payload['status'] ?? null,
                    'batch_id' => (int) $row->import_batch_id,
                    'row_number' => (int) $row->row_number,
                    'status' => $row->status,
                    'batch_status' => $row->batch_status,
                    'batch_source_id' => $row->batch_source_id === null ? null : (int) $row->batch_source_id,
                    'source_status' => $schema::hasTable('sources') && $row->batch_source_id !== null
                        ? $db::table('sources')->where('id', $row->batch_source_id)->value('status')
                        : null,
                    'match_state' => $row->match_state,
                    'parent_subject_type' => $row->parent_subject_type,
                    'parent_subject_id' => $row->parent_subject_id === null ? null : (int) $row->parent_subject_id,
                    'validation_error_fields' => is_array($errors) ? array_keys($errors) : [],
                    'validation_error_count' => is_array($errors) ? array_sum(array_map(
                        fn ($messages) => is_array($messages) ? count($messages) : (is_string($messages) && trim($messages) !== '' ? 1 : 0),
                        $errors,
                    )) : 0,
                ];

                if ($schema::hasTable('import_promotion_decisions')) {
                    $item['promotion_decisions'] = $db::table('import_promotion_decisions')
                        ->where('import_row_id', $row->id)
                        ->orderBy('id')
                        ->get(['decision'])
                        ->pluck('decision')->values()->all();
                } else {
                    $item['promotion_decisions_table_available'] = false;
                }

                if ($schema::hasTable('import_promotion_events')) {
                    $event = $db::table('import_promotion_events')
                        ->where('import_row_id', $row->id)
                        ->orderByDesc('occurred_at')->orderByDesc('id')
                        ->first(['event_type', 'metadata']);
                    $metadata = isset($event->metadata) ? json_decode((string) $event->metadata, true) : [];
                    $item['latest_promotion_event_type'] = $event->event_type ?? null;
                    $item['latest_promotion_error_class'] = is_array($metadata) ? ($metadata['error_class'] ?? null) : null;
                }

                if ($schema::hasTable('identity_resolution_decisions')
                    && $schema::hasColumn('identity_resolution_decisions', 'import_row_id')) {
                    $identityDecisions = $db::table('identity_resolution_decisions')
                        ->where('import_row_id', $row->id)
                        ->orderByDesc('id')
                        ->get(['decision']);
                    $item['identity_decisions'] = $identityDecisions->pluck('decision')->values()->all();
                    $item['has_approved_identity_decision'] = $identityDecisions->contains(
                        fn ($decision) => in_array($decision->decision, ['approved_new', 'approved_match'], true)
                    );
                }

                $item['open_conflict_count'] = $schema::hasTable('import_conflicts')
                    ? $db::table('import_conflicts')->where('import_row_id', $row->id)->where('status', 'open')->count()
                    : null;

                if ($schema::hasTable('assertions') && $schema::hasTable('evidence')
                    && $schema::hasColumn('assertions', 'subject_type')
                    && $schema::hasColumn('assertions', 'subject_id')
                    && $schema::hasColumn('assertions', 'evidence_id')) {
                    $item['has_active_source_evidence'] = $db::table('assertions')
                        ->join('evidence', 'evidence.id', '=', 'assertions.evidence_id')
                        ->where('assertions.subject_type', 'App\\Models\\ImportRow')
                        ->where('assertions.subject_id', $row->id)
                        ->where('evidence.status', 'active')
                        ->exists();
                }

                $item['canonical_institution_status'] = null;
                if ($row->parent_subject_type === 'App\\Models\\Institution' && $row->parent_subject_id !== null
                    && $schema::hasTable('institutions')) {
                    $item['canonical_institution_status'] = $db::table('institutions')
                        ->where('id', $row->parent_subject_id)->value('status');
                }
                if ($schema::hasTable('institutions') && $schema::hasColumn('import_rows', 'canonical_subject_type')
                    && $schema::hasColumn('import_rows', 'canonical_subject_id')) {
                    $canonical = $db::table('import_rows')->where('id', $row->id)
                        ->first(['canonical_subject_type', 'canonical_subject_id']);
                    if ($canonical && $canonical->canonical_subject_type === 'App\\Models\\Institution'
                        && $canonical->canonical_subject_id !== null) {
                        $item['canonical_institution_status'] = $db::table('institutions')
                            ->where('id', $canonical->canonical_subject_id)->value('status');
                    }
                }

                if ($schema::hasTable('institution_identity_decisions')) {
                    $decisionQuery = $db::table('institution_identity_decisions');
                    if ($schema::hasColumn('institution_identity_decisions', 'import_row_id')) {
                        $item['identity_decisions'] = $decisionQuery->where('import_row_id', $row->id)
                            ->orderBy('id')->get()->map(function ($decision) {
                                $result = [];
                                foreach (['decision', 'status', 'match_type', 'canonical_institution_id'] as $field) {
                                    if (isset($decision->$field)) {
                                        $result[$field] = $decision->$field;
                                    }
                                }
                                return $result;
                            })->values()->all();
                    }
                }

                $report['rows'][] = $item;
            }
            echo json_encode($report, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES), PHP_EOL;
            PHP
            echo "=== Campus import row trace (read-only; no payloads or notes) ==="
            php <<'PHP'
            <?php
            require __DIR__.'/vendor/autoload.php';
            $app = require __DIR__.'/bootstrap/app.php';
            $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();

            $rows = \Illuminate\Support\Facades\DB::table('import_rows')
                ->join('import_batches', 'import_batches.id', '=', 'import_rows.import_batch_id')
                ->where('import_batches.entity_type', 'campus')
                ->orderBy('import_rows.import_batch_id')
                ->orderBy('import_rows.row_number')
                ->get([
                    'import_rows.id',
                    'import_rows.import_batch_id',
                    'import_rows.row_number',
                    'import_rows.status',
                    'import_rows.match_state',
                    'import_rows.parent_subject_type',
                    'import_rows.parent_subject_id',
                    'import_rows.validation_errors',
                ]);

            $report = ['check' => 'campus_import_row_trace', 'mutation_performed' => false, 'rows' => []];
            foreach ($rows as $row) {
                $errors = $row->validation_errors;
                if (is_string($errors)) {
                    $errors = json_decode($errors, true);
                }
                $reportRow = [
                    'id' => (int) $row->id,
                    'batch_id' => (int) $row->import_batch_id,
                    'row_number' => (int) $row->row_number,
                    'status' => $row->status,
                    'match_state' => $row->match_state,
                    'parent_subject_type' => $row->parent_subject_type,
                    'parent_subject_id' => $row->parent_subject_id === null ? null : (int) $row->parent_subject_id,
                    'validation_error_fields' => is_array($errors) ? array_keys($errors) : [],
                    'validation_error_count' => is_array($errors) ? array_sum(array_map(
                        fn ($messages) => is_array($messages) ? count($messages) : (is_string($messages) && trim($messages) !== '' ? 1 : 0),
                        $errors,
                    )) : 0,
                    'has_approved_promotion_decision' => \Illuminate\Support\Facades\Schema::hasTable('import_promotion_decisions')
                        && \Illuminate\Support\Facades\DB::table('import_promotion_decisions')
                            ->where('import_row_id', $row->id)->where('decision', 'approved')->exists(),
                ];
                if (\Illuminate\Support\Facades\Schema::hasTable('import_promotion_events')) {
                    $event = \Illuminate\Support\Facades\DB::table('import_promotion_events')
                        ->where('import_row_id', $row->id)->orderByDesc('occurred_at')->orderByDesc('id')
                        ->first(['event_type', 'metadata']);
                    $metadata = isset($event->metadata) ? json_decode((string) $event->metadata, true) : [];
                    $reportRow['latest_promotion_event_type'] = $event->event_type ?? null;
                    $reportRow['latest_promotion_error_class'] = is_array($metadata) ? ($metadata['error_class'] ?? null) : null;
                }
                $report['rows'][] = $reportRow;
            }
            echo json_encode($report, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES), PHP_EOL;
            PHP
