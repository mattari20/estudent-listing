name: Hostinger Read-only Diagnostics

on:
  push:
    branches:
      - main
  schedule:
    # Automatically re-check Hostinger revision alignment every six hours.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      project_path:
        description: "Absolute path to the existing Institutes Laravel project (directory containing artisan)"
        required: true
        type: string
        default: "/home/u537436044/domains/estudent.pk/public_html/institutes"

permissions:
  contents: read

concurrency:
  group: hostinger-readonly-diagnostics
  cancel-in-progress: false

jobs:
  diagnostics:
    name: Run read-only Institutes diagnostics over SSH
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository for revision comparison
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve latest application-code revision
        id: app_revision
        shell: bash
        run: |
          # Workflow/docs-only commits do not require application deployment.
          revision="$(git log -1 --format=%H -- app bootstrap config database resources routes composer.json composer.lock public artisan)"
          if [[ -z "$revision" ]]; then
            echo "::error::Could not determine the latest application-code revision."
            exit 1
          fi
          echo "expected_revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Run diagnostics on Hostinger
        uses: appleboy/ssh-action@v1.2.0
        env:
          PROJECT_PATH: ${{ inputs.project_path || '/home/u537436044/domains/estudent.pk/public_html/institutes' }}
          EXPECTED_REVISION: ${{ steps.app_revision.outputs.expected_revision }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          envs: PROJECT_PATH,EXPECTED_REVISION
          command_timeout: 3m
          script: |
            set -eu
            case "$PROJECT_PATH" in
              /*) ;;
              *) echo "ERROR: project_path must be an absolute path"; exit 2 ;;
            esac
            case "$PROJECT_PATH" in
              *".."*) echo "ERROR: project_path must not contain .."; exit 2 ;;
            esac
            if [ ! -f "$PROJECT_PATH/artisan" ]; then
              echo "ERROR: artisan not found in the supplied project_path"
              exit 3
            fi
            cd "$PROJECT_PATH"
            echo "=== Application environment ==="
            php artisan env
            echo "=== Deployed API route registration (read-only; bounded) ==="
            API_ROUTE_REPORT="$(mktemp)"
            php artisan route:list --json --no-ansi > "$API_ROUTE_REPORT"
            php -r '
            $routes = json_decode(file_get_contents($argv[1]), true);
            if (! is_array($routes)) {
                fwrite(STDERR, "ERROR: route:list JSON was invalid or empty".PHP_EOL);
                exit(2);
            }
            $matched = array_values(array_filter($routes, fn ($route) => str_contains((string) ($route["uri"] ?? ""), "api/v1/institutions") || str_contains((string) ($route["uri"] ?? ""), "v1/institutions")));
            echo json_encode(["check" => "institution_api_route_registration", "mutation_performed" => false, "route_count" => count($matched), "routes" => array_map(fn ($route) => ["method" => $route["method"] ?? null, "uri" => $route["uri"] ?? null, "name" => $route["name"] ?? null, "action" => $route["action"] ?? null, "middleware" => $route["middleware"] ?? []], $matched)], JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES).PHP_EOL;
            if (count($matched) === 0) exit(3);
            ' "$API_ROUTE_REPORT"
            rm -f "$API_ROUTE_REPORT"
            echo "=== Laravel scheduled task definitions (read-only) ==="
            php artisan schedule:list --no-ansi
            echo "=== Import-batch duplicate_rows schema/migration verification (read-only) ==="
            php <<'PHP'
            <?php
            require __DIR__.'/vendor/autoload.php';
            $app = require __DIR__.'/bootstrap/app.php';
            $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();

            $schema = \Illuminate\Support\Facades\Schema::class;
            $table = 'import_batches';
            $migration = '2026_10_23_000001_add_duplicate_rows_to_import_batches_table';
            $migrationFile = base_path('database/migrations/'.$migration.'.php');
            $tableExists = null;
            $columnExists = null;
            $ledgerExists = null;
            $driver = null;
            $migrationRows = [];
            $relatedMigrationEntries = [];
            $relatedMigrationFiles = [];
            $matchingMigrationCount = null;
            $metadataError = false;
            try {
                $connection = \Illuminate\Support\Facades\DB::connection();
                $driver = $connection->getDriverName();
                $tableExists = $schema::hasTable($table);
                $columnExists = $tableExists && $schema::hasColumn($table, 'duplicate_rows');
                $ledgerExists = $schema::hasTable('migrations');
                if ($ledgerExists) {
                    $migrationRows = $connection->table('migrations')
                        ->where('migration', $migration)->orderBy('batch')
                        ->get(['migration', 'batch'])
                        ->map(static fn ($row) => ['migration' => (string) $row->migration, 'batch' => (int) $row->batch])
                        ->all();
                    $matchingMigrationCount = count($migrationRows);
                    $relatedMigrationEntries = $connection->table('migrations')
                        ->where(function ($query): void {
                            $query->where('migration', 'like', '%duplicate_rows%')
                                ->orWhere('migration', 'like', '%import_batches%');
                        })->orderBy('batch')->orderBy('migration')
                        ->get(['migration', 'batch'])
                        ->map(static fn ($row) => [
                            'migration' => (string) $row->migration,
                            'batch' => (int) $row->batch,
                            'migration_file_exists' => is_file(base_path('database/migrations/'.$row->migration.'.php')),
                        ])->all();
                }
                foreach (glob(base_path('database/migrations/*.php')) ?: [] as $candidatePath) {
                    $source = file_get_contents($candidatePath);
                    if (! is_string($source)) { continue; }
                    $mentionsDuplicateRows = str_contains($source, 'duplicate_rows');
                    $mentionsImportBatches = str_contains($source, 'import_batches');
                    if ($mentionsDuplicateRows || $mentionsImportBatches) {
                        $candidateName = basename($candidatePath, '.php');
                        $relatedMigrationFiles[] = [
                            'migration' => $candidateName,
                            'mentions_duplicate_rows' => $mentionsDuplicateRows,
                            'mentions_import_batches' => $mentionsImportBatches,
                            'migration_ledger_count' => $ledgerExists
                                ? (int) $connection->table('migrations')->where('migration', $candidateName)->count()
                                : null,
                        ];
                    }
                }
            } catch (\Throwable $exception) {
                // Suppress exception details; report incomplete introspection without exposing SQL or credentials.
                $metadataError = true;
                $migrationRows = [];
                $relatedMigrationEntries = [];
                $relatedMigrationFiles = [];
                $matchingMigrationCount = null;
            }

            $columnDefinition = null;
            $columnPositionVerified = false;
            $candidateRowsPrecedes = null;
            $columnDefinitionMatches = false;
            $tableDefinition = null;
            $indexes = [];
            $foreignKeys = [];
            try {
                if ($tableExists) {
                    $columns = $schema::getColumns($table);
                    $columnNames = array_map(static fn ($column) => (string) ($column['name'] ?? ''), $columns);
                    $candidatePosition = array_search('candidate_rows', $columnNames, true);
                    $duplicatePosition = array_search('duplicate_rows', $columnNames, true);
                    if ($duplicatePosition !== false) {
                        $column = $columns[$duplicatePosition];
                        $typeLabel = strtolower((string) ($column['type_name'] ?? '').' '.(string) ($column['type'] ?? ''));
                        $nullable = $column['nullable'] ?? null;
                        $default = $column['default'] ?? null;
                        $autoIncrement = $column['auto_increment'] ?? null;
                        $columnPositionVerified = $candidatePosition !== false;
                        $candidateRowsPrecedes = $candidatePosition !== false
                            && $duplicatePosition === $candidatePosition + 1;
                        $columnDefinition = [
                            'name' => 'duplicate_rows',
                            'type_name' => $column['type_name'] ?? null,
                            'type' => $column['type'] ?? null,
                            'unsigned' => str_contains($typeLabel, 'unsigned'),
                            'nullable' => $nullable,
                            'default' => $default,
                            'auto_increment' => $autoIncrement,
                            'ordinal_position' => $duplicatePosition + 1,
                            'previous_column' => $duplicatePosition > 0 ? $columnNames[$duplicatePosition - 1] : null,
                            'next_column' => $duplicatePosition + 1 < count($columnNames) ? $columnNames[$duplicatePosition + 1] : null,
                            'candidate_rows_exists' => $candidatePosition !== false,
                        ];
                        $columnDefinitionMatches = str_contains($typeLabel, 'int')
                            && str_contains($typeLabel, 'unsigned')
                            && $nullable === false
                            && $default !== null && (string) $default === '0'
                            && $autoIncrement === false;
                    }
                    $indexes = $schema::getIndexes($table);
                    $foreignKeys = $schema::getForeignKeys($table);
                    if ($driver === 'mysql') {
                        $rows = $connection->select(
                            'SELECT ENGINE, TABLE_COLLATION, ROW_FORMAT FROM information_schema.TABLES WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = ?',
                            [$table]
                        );
                        if ($rows !== []) {
                            $tableDefinition = [
                                'engine' => $rows[0]->ENGINE ?? null,
                                'collation' => $rows[0]->TABLE_COLLATION ?? null,
                                'row_format' => $rows[0]->ROW_FORMAT ?? null,
                            ];
                        }
                    } elseif ($driver === 'sqlite') {
                        $rows = $connection->select("SELECT sql FROM sqlite_master WHERE type = 'table' AND name = ?", [$table]);
                        $tableDefinition = ['create_sql_available' => $rows !== []];
                    } elseif ($driver === 'pgsql') {
                        $tableDefinition = ['metadata_driver' => 'pgsql', 'engine' => null];
                    }
                }
            } catch (\Throwable $exception) {
                // Suppress exception details because they may contain SQL or connection metadata.
                $metadataError = true;
                $columnDefinition = null;
                $columnPositionVerified = false;
                $candidateRowsPrecedes = null;
                $columnDefinitionMatches = false;
            }
            $columnAndPositionMatch = $columnExists && $columnDefinitionMatches
                && $columnPositionVerified && $candidateRowsPrecedes === true;
            if ($matchingMigrationCount > 1) {
                $diagnosis = 'DUPLICATE_MIGRATION_LEDGER_ENTRIES';
            } elseif ($metadataError) {
                $diagnosis = 'SCHEMA_EQUIVALENCE_UNVERIFIED';
            } elseif ($columnExists && ! $columnAndPositionMatch) {
                $diagnosis = 'COLUMN_DEFINITION_MISMATCH';
            } elseif (! $columnExists && $matchingMigrationCount > 0) {
                $diagnosis = 'COLUMN_ABSENT_LEDGER_PRESENT';
            } elseif ($columnExists && $matchingMigrationCount === 0) {
                $diagnosis = 'COLUMN_PRESENT_LEDGER_ABSENT';
            } elseif ($columnExists && $matchingMigrationCount === 1) {
                $diagnosis = 'COLUMN_AND_LEDGER_CONSISTENT';
            } else {
                $diagnosis = 'SCHEMA_EQUIVALENCE_UNVERIFIED';
            }
            $columnDefinitionEquivalence = $metadataError ? 'UNVERIFIED' : ($columnAndPositionMatch ? 'MATCH' : ($columnExists ? 'MISMATCH' : 'NOT_APPLICABLE'));
            // Full table-schema equivalence cannot be asserted until the original creation migration is identified and compared.
            $schemaEquivalence = 'UNVERIFIED';
            echo json_encode([
                'check' => 'import_batches_duplicate_rows_schema_verification',
                'checked_at' => now()->toIso8601String(),
                'mutation_performed' => false,
                'write_requested' => false,
                'database_driver' => $driver,
                'table' => $table,
                'table_exists' => $tableExists,
                'column_exists' => $columnExists,
                'duplicate_rows_column_exists' => $columnExists,
                'duplicate_rows_column_definition' => $columnDefinition,
                'column_definition' => $columnDefinition,
                'column_definition_matches_migration' => $columnDefinitionMatches,
                'column_definition_equivalence' => $columnDefinitionEquivalence,
                'column_position_verified' => $columnPositionVerified,
                'candidate_rows_precedes_duplicate_rows' => $candidateRowsPrecedes,
                'table_definition' => $tableDefinition,
                'indexes' => $indexes,
                'foreign_keys' => $foreignKeys,
                'migration_name' => $migration,
                'migration_file_exists' => is_file($migrationFile),
                'migration_ledger_exists' => $ledgerExists,
                'matching_migration_count' => $matchingMigrationCount,
                'matching_migrations' => $migrationRows,
                'matching_migration_rows' => $migrationRows,
                'migration_applied' => $matchingMigrationCount > 0,
                'related_migration_ledger_entries' => $relatedMigrationEntries,
                'related_migration_files' => $relatedMigrationFiles,
                'schema_equivalence' => $schemaEquivalence,
                'metadata_introspection_succeeded' => ! $metadataError,
                'migration_origin' => 'UNKNOWN',
                'diagnosis' => $diagnosis,
            ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES), PHP_EOL;
            PHP

            echo "=== Discovery outcome schema/migration verification (read-only) ==="
            php <<'PHP'
            <?php
            require __DIR__.'/vendor/autoload.php';
            $app = require __DIR__.'/bootstrap/app.php';
            $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $schema = \Illuminate\Support\Facades\Schema::class;
            $db = \Illuminate\Support\Facades\DB::class;
            $table = 'institute_discovery_run_outcomes';
            $tableExists = $schema::hasTable($table);
            $migrationTableExists = $schema::hasTable('migrations');
            $migrationApplied = false;
            $migrationRows = [];
            if ($migrationTableExists) {
                $migrationRows = $db::table('migrations')
                    ->where('migration', 'like', '%create_institute_discovery_run_outcomes_table%')
                    ->orderBy('migration')
                    ->get(['migration', 'batch'])
                    ->map(fn ($row) => ['migration' => $row->migration, 'batch' => (int) $row->batch])
                    ->all();
                $migrationApplied = $migrationCount > 0;
            }
            echo json_encode([
                'check' => 'discovery_outcome_schema_verification',
                'checked_at' => now()->toIso8601String(),
                'mutation_performed' => false,
                'outcome_table' => $table,
                'outcome_table_exists' => $tableExists,
                'migrations_table_exists' => $migrationTableExists,
                'migration_applied' => $migrationApplied,
                'matching_migrations' => $migrationRows,
            ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES), PHP_EOL;
            PHP
            echo "=== Institution field approvals schema and migration-ledger readiness (read-only) ==="
            php <<'PHP'
            <?php
            require __DIR__.'/vendor/autoload.php';
            $app = require __DIR__.'/bootstrap/app.php';
            $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();

            $table = 'institution_field_approvals';
            $migration = '2026_10_29_000001_create_institution_field_approvals_table';
            $metadataError = false;
            $metadataErrors = [];
            $tableExists = false;
            $ledgerExists = false;
            $migrationRows = [];
            $migrationCount = null;
            $actualColumns = [];
            $missingColumns = [];
            $columnDefinitionMismatches = [];
            $indexes = [];
            $missingIndexes = [];
            $foreignKeys = [];
            $missingForeignKeys = [];
            $driver = null;
            $tableEngine = null;
            $prerequisites = [];
            $prerequisiteBlockers = [];
            $expectedColumns = [
                'id' => ['pattern' => '/bigint.*unsigned/', 'nullable' => false, 'auto_increment' => true],
                'institution_id' => ['pattern' => '/bigint.*unsigned/', 'nullable' => false],
                'field_name' => ['pattern' => '/varchar\(100\)/', 'nullable' => false],
                'expected_current_value' => ['pattern' => '/longtext/', 'nullable' => true],
                'proposed_value' => ['pattern' => '/longtext/', 'nullable' => false],
                'source_id' => ['pattern' => '/bigint.*unsigned/', 'nullable' => false],
                'source_change_observation_id' => ['pattern' => '/bigint.*unsigned/', 'nullable' => false],
                'source_snapshot_id' => ['pattern' => '/bigint.*unsigned/', 'nullable' => false],
                'evidence_id' => ['pattern' => '/bigint.*unsigned/', 'nullable' => false],
                'evidence_url' => ['pattern' => '/\btext\b/', 'nullable' => false],
                'evidence_excerpt' => ['pattern' => '/longtext/', 'nullable' => false],
                'content_fingerprint' => ['pattern' => '/varchar\(128\)/', 'nullable' => false],
                'source_observed_at' => ['pattern' => '/varchar\(40\)/', 'nullable' => false],
                'evidence_observed_at' => ['pattern' => '/varchar\(40\)/', 'nullable' => true],
                'proposal_hash' => ['pattern' => '/char\(64\)/', 'nullable' => false],
                'status' => ['pattern' => '/varchar\(24\)/', 'nullable' => false, 'default' => 'pending'],
                'created_by' => ['pattern' => '/bigint.*unsigned/', 'nullable' => false],
                'reviewer_id' => ['pattern' => '/bigint.*unsigned/', 'nullable' => true],
                'decision_at' => ['pattern' => '/timestamp/', 'nullable' => true],
                'decision_reason' => ['pattern' => '/\btext\b/', 'nullable' => true],
                'applied_at' => ['pattern' => '/timestamp/', 'nullable' => true],
                'application_outcome' => ['pattern' => '/varchar\(40\)/', 'nullable' => true],
                'applied_refresh_event_id' => ['pattern' => '/bigint.*unsigned/', 'nullable' => true],
                'created_at' => ['pattern' => '/timestamp/', 'nullable' => true],
                'updated_at' => ['pattern' => '/timestamp/', 'nullable' => true],
            ];
            $expectedIndexes = [
                'institution_field_approvals_proposal_hash_unique' => ['columns' => ['proposal_hash'], 'unique' => true],
                'inst_field_approval_state_idx' => ['columns' => ['institution_id', 'field_name', 'status'], 'unique' => false],
                'inst_field_approval_source_idx' => ['columns' => ['source_id', 'source_change_observation_id'], 'unique' => false],
                'inst_field_approval_decision_idx' => ['columns' => ['status', 'decision_at'], 'unique' => false],
            ];
            $expectedForeignKeys = [
                'institution_id' => ['institutions', 'id'],
                'source_id' => ['sources', 'id'],
                'source_change_observation_id' => ['source_change_observations', 'id'],
                'source_snapshot_id' => ['source_snapshots', 'id'],
                'evidence_id' => ['evidence', 'id'],
                'created_by' => ['users', 'id'],
                'reviewer_id' => ['users', 'id'],
                'applied_refresh_event_id' => ['official_source_refresh_events', 'id'],
            ];
            $foreignKeyPrerequisites = [
                'institutions' => 'institution_id',
                'sources' => 'source_id',
                'source_change_observations' => 'source_change_observation_id',
                'source_snapshots' => 'source_snapshot_id',
                'evidence' => 'evidence_id',
                'users' => 'created_by/reviewer_id',
                'official_source_refresh_events' => 'applied_refresh_event_id',
            ];

            // Read-only schema inspection only; no migration, DDL, DML, or ledger repair.
            try {
                $db = \Illuminate\Support\Facades\DB::connection();
                $schema = \Illuminate\Support\Facades\Schema::class;
                $driver = $db->getDriverName();
                $migrationPrivilegeReadiness = [
                    'check' => 'institution_field_approvals_migration_privilege_readiness',
                    'status' => 'UNVERIFIED',
                    'database_driver' => $driver,
                    'database_scope_grant_found' => false,
                    'required_privileges' => [
                        'CREATE' => null,
                        'ALTER' => null,
                        'INDEX' => null,
                        'REFERENCES_all_parent_tables' => null,
                    ],
                    'introspection_succeeded' => false,
                    'raw_grants_emitted' => false,
                    'mutation_performed' => false,
                ];

                // SHOW GRANTS is read-only. Never print grant strings or account names.
                if ($driver === 'mysql') {
                    try {
                        $grantRows = $db->select('SHOW GRANTS FOR CURRENT_USER()');
                        $databaseName = strtolower((string) $db->getDatabaseName());
                        $parentTables = array_keys($foreignKeyPrerequisites);
                        $schemaGrantFound = false;
                        $globalGrantFound = false;
                        $referencesTables = [];
                        $privileges = ['CREATE' => false, 'ALTER' => false, 'INDEX' => false];
                        foreach ($grantRows as $grantRow) {
                            $grant = (string) (array_values((array) $grantRow)[0] ?? '');
                            if (! preg_match('/^GRANT\\s+(.+?)\\s+ON\\s+(.+?)\\s+TO\\s+/i', $grant, $matches)) {
                                continue;
                            }
                            $granted = strtoupper(trim($matches[1]));
                            $scope = strtolower(str_replace('`', '', trim($matches[2])));
                            $isGlobal = $scope === '*.*';
                            $isDatabase = $scope === $databaseName.'.*';
                            $scopeGrant = $isGlobal || $isDatabase;
                            if ($scopeGrant) {
                                $globalGrantFound = $globalGrantFound || $isGlobal;
                                $schemaGrantFound = $schemaGrantFound || $isDatabase;
                                foreach (array_keys($privileges) as $requiredPrivilege) {
                                    if ($granted === 'ALL PRIVILEGES' || preg_match('/(?:^|,\\s*)'.preg_quote($requiredPrivilege, '/').'(?:\\s*,|$)/', $granted)) {
                                        $privileges[$requiredPrivilege] = true;
                                    }
                                }
                                if ($granted === 'ALL PRIVILEGES' || preg_match('/(?:^|,\\s*)REFERENCES(?:\\s*,|$)/', $granted)) {
                                    $referencesTables = array_fill_keys($parentTables, true);
                                }
                                continue;
                            }

                            $normalizedScope = preg_replace('/\\s+/', '', $scope);
                            if (preg_match('/^'.preg_quote($databaseName, '/'). '\\.('.implode('|', array_map(static fn ($name) => preg_quote(strtolower($name), '/'), $parentTables)).')$/i', $normalizedScope, $scopeMatches)) {
                                if ($granted === 'ALL PRIVILEGES' || preg_match('/(?:^|,\\s*)REFERENCES(?:\\s*,|$)/', $granted)) {
                                    $referencesTables[strtolower($scopeMatches[1])] = true;
                                }
                            }
                        }

                        $referencesComplete = count(array_intersect(array_map('strtolower', $parentTables), array_keys($referencesTables))) === count($parentTables);
                        $migrationPrivilegeReadiness['database_scope_grant_found'] = $globalGrantFound || $schemaGrantFound;
                        $migrationPrivilegeReadiness['required_privileges'] = [
                            'CREATE' => $privileges['CREATE'],
                            'ALTER' => $privileges['ALTER'],
                            'INDEX' => $privileges['INDEX'],
                            'REFERENCES_all_parent_tables' => $referencesComplete,
                        ];
                        $migrationPrivilegeReadiness['introspection_succeeded'] = true;
                        $migrationPrivilegeReadiness['status'] = ! in_array(false, $migrationPrivilegeReadiness['required_privileges'], true)
                            ? 'PASS'
                            : 'INSUFFICIENT_OR_UNVERIFIED_GRANTS';
                    } catch (\Throwable $privilegeError) {
                        // Keep the diagnostic useful without exposing credentials, grants, or exception text.
                        $migrationPrivilegeReadiness['status'] = 'UNVERIFIED_GRANT_INTROSPECTION_FAILED';
                    }
                } else {
                    $migrationPrivilegeReadiness['status'] = 'UNSUPPORTED_DATABASE_DRIVER';
                }

                echo json_encode($migrationPrivilegeReadiness, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES), PHP_EOL;
                $tableExists = $schema::hasTable($table);
                $ledgerExists = $schema::hasTable('migrations');
                if ($ledgerExists) {
                    $migrationQuery = $db->table('migrations')->where('migration', $migration);
                    $migrationCount = (int) (clone $migrationQuery)->count();
                    // Keep sample ledger detail bounded while reporting the full count separately.
                    $migrationRows = $migrationQuery->orderBy('batch')->limit(3)
                        ->get(['migration', 'batch'])
                        ->map(static fn ($row) => ['migration' => (string) $row->migration, 'batch' => (int) $row->batch])->all();
                }

                if ($driver === 'mysql') {
                    $tableRows = $db->select(
                        'SELECT ENGINE FROM information_schema.TABLES WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = ?',
                        [$table]
                    );
                    $tableEngine = isset($tableRows[0]) ? (string) ($tableRows[0]->ENGINE ?? '') : null;
                }

                foreach ($foreignKeyPrerequisites as $parentTable => $childColumn) {
                    $entry = [
                        'table' => $parentTable,
                        'required_by_columns' => $childColumn,
                        'table_exists' => false,
                        'id_exists' => false,
                        'id_type' => null,
                        'id_nullable' => null,
                        'id_is_primary_or_unique' => false,
                        'primary_key_columns' => [],
                        'unique_reference_verified' => false,
                        'storage_engine' => null,
                        'storage_engine_foreign_key_compatible' => null,
                        'metadata_introspection_succeeded' => false,
                        'blockers' => [],
                    ];
                    try {
                        $entry['table_exists'] = $schema::hasTable($parentTable);
                        if ($entry['table_exists']) {
                            foreach ($schema::getColumns($parentTable) as $column) {
                                if (($column['name'] ?? null) === 'id') {
                                    $entry['id_exists'] = true;
