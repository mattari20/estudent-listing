name: Application Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Require committed Composer lock
        run: test -f composer.lock

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Lint changed PHP files
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags --prune origin "$GITHUB_BASE_REF"
            files=$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" -- '*.php')
          else
            files=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- '*.php')
          fi

          if [[ -z "$files" ]]; then
            echo "No changed PHP files to lint."
            exit 0
          fi

          printf '%s\\n' "$files" | xargs -r vendor/bin/pint --test

      - name: Test
        run: composer test
