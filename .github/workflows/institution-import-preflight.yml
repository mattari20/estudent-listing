name: Institution import preflight

on:
  pull_request:
    paths:
      - "scripts/data-quality/**"
      - "tests/data_quality/**"
      - "docs/09-data-enrichment/INSTITUTION-IMPORT-PREFLIGHT.md"
      - ".github/workflows/institution-import-preflight.yml"
  push:
    branches: [main]
    paths:
      - "scripts/data-quality/**"
      - "tests/data_quality/**"
      - ".github/workflows/institution-import-preflight.yml"

permissions:
  contents: read

jobs:
  test-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run duplicate-preflight tests
        run: python -m unittest discover -s tests/data_quality -p "test_*.py" -v
