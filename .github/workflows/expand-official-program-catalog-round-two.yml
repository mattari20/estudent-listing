                  $db::table('program_offerings')->insert(['program_id'=>$p->id,'campus_id'=>$c->id,'delivery_mode'=>'on_campus','status'=>'active','intake_label'=>null,'duration'=>$o['duration'],'availability'=>'unknown','effective_from'=>null,'effective_until'=>null,'created_at'=>now(),'updated_at'=>now()]);
                  echo "OFFERING_ADDED=".$o['slug'].";CAMPUS=".$c->name."\n";
                }
              }
              // GCU's official Fall 2026 BS admissions page gives the deadline as 3 July 2026.
              $p=$db::table('programs')->where('institution_id',1)->where('slug','gcu-lahore-bs-computer-science')->first();
              $o=$db::table('program_offerings')->where('program_id',$p->id)->where('status','active')->first();
              $existing=$db::table('admission_intakes')->where('program_offering_id',$o->id)->where('label','Fall 2026 (closed)')->lockForUpdate()->get();
              if($existing->count()>1) throw new RuntimeException('Duplicate GCU Fall 2026 intake');
              if($existing->count()===0) {
                $db::table('admission_intakes')->insert(['program_offering_id'=>$o->id,'label'=>'Fall 2026 (closed)','status'=>'closed','application_open_at'=>null,'application_close_at'=>'2026-07-03','test_date'=>null,'selection_date'=>null,'enrollment_start_at'=>null,'enrollment_end_at'=>null,'seat_capacity'=>null,'application_url'=>'https://gcu.edu.pk/admissions.php?pg=bs-program','notes'=>'Official GCU admissions page states the Fall 2026 application deadline was 3 July 2026. Opening date was not entered because not verified from the source reviewed.','created_at'=>now(),'updated_at'=>now()]);
                echo "HISTORICAL_INTAKE_ADDED=GCU Fall 2026 closed\n";
              }
            });
            $counts=['active_programs'=>$db::table('programs')->where('status','active')->count(),'active_offerings'=>$db::table('program_offerings')->where('status','active')->count(),'intakes'=>$db::table('admission_intakes')->count(),'bad_offerings'=>$db::table('program_offerings as o')->leftJoin('programs as p','p.id','=','o.program_id')->where('o.status','active')->whereNull('p.id')->count(),'intakes_without_offering'=>$db::table('admission_intakes as a')->leftJoin('program_offerings as o','o.id','=','a.program_offering_id')->whereNull('o.id')->count()];
            echo "ROUND_TWO_COUNTS=".json_encode($counts)."\n";
            if($counts['active_programs']<55 || $counts['active_offerings']<29 || $counts['intakes']<3 || $counts['bad_offerings']!==0 || $counts['intakes_without_offering']!==0) throw new RuntimeException('Round two integrity verification failed.');
            PHP
            php artisan institutes:data-gap-report --json | php -r '$d=json_decode(stream_get_contents(STDIN),true); if(!is_array($d)) exit(2); echo "ROUND_TWO_REPORT_STATUS=".($d["status"]??"unknown")."\n"; echo "ROUND_TWO_POPULATION=".json_encode($d["sections"]["canonical_population"]??null)."\n"; echo "ROUND_TWO_GAPS=".json_encode($d["sections"]["canonical_relationship_gaps"]??null)."\n"; if(($d["mutation_performed"]??null)!==false || ($d["status"]??null)!=="healthy") exit(5);'
