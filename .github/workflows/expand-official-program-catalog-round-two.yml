              ['institution_id'=>15,'institution'=>'Air University','name'=>'BS Artificial Intelligence','slug'=>'air-university-bs-artificial-intelligence','level'=>'undergraduate','award'=>'BS','discipline'=>'Artificial Intelligence','source'=>'https://webdata.au.edu.pk/Pages/Admission/FAQS.aspx'],
              ['institution_id'=>15,'institution'=>'Air University','name'=>'BS Cyber Security','slug'=>'air-university-bs-cyber-security','level'=>'undergraduate','award'=>'BS','discipline'=>'Cyber Security','source'=>'https://webdata.au.edu.pk/Pages/Admission/FAQS.aspx'],
