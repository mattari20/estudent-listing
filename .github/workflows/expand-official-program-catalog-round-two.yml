              ['slug'=>'nust-bs-software-engineering','institution_id'=>19,'campus_id'=>9,'duration'=>'4 years'],
            ];
            $db::transaction(function() use ($db,$programs,$offerings) {
              foreach($programs as $p) {
                $i=$db::table('institutions')->where('id',$p['institution_id'])->lockForUpdate()->first();
                if(!$i || $i->name!==$p['institution'] || $i->status!=='active') throw new RuntimeException("Institution identity guard failed ".$p['slug']);
                $found=$db::table('programs')->where('institution_id',$p['institution_id'])->where('slug',$p['slug'])->lockForUpdate()->get();
                if($found->count()>1) throw new RuntimeException("Duplicate program ".$p['slug']);
                if($found->count()===1) {
                  if($found->first()->name!==$p['name'] || $found->first()->status!=='active') throw new RuntimeException("Existing program mismatch ".$p['slug']);
                } else {
                  $db::table('programs')->insert(['institution_id'=>$p['institution_id'],'name'=>$p['name'],'slug'=>$p['slug'],'program_level'=>$p['level'],'award'=>$p['award'],'discipline'=>$p['discipline'],'status'=>'active','description'=>'Official program listing: '.$p['source'],'created_at'=>now(),'updated_at'=>now()]);
                  echo "PROGRAM_ADDED=".$p['slug']."\n";
                }
              }
              foreach($offerings as $o) {
                $p=$db::table('programs')->where('institution_id',$o['institution_id'])->where('slug',$o['slug'])->where('status','active')->first();
                $c=$db::table('campuses')->where('id',$o['campus_id'])->where('institution_id',$o['institution_id'])->where('status','active')->whereNotNull('geography_id')->first();
                // COMSATS is institution record 9 (Lahore campus) and has a dedicated campus record; locate by its canonical campus name instead of assuming an ID.
                if($o['institution_id']===9) $c=$db::table('campuses')->where('institution_id',9)->where('status','active')->whereNotNull('geography_id')->first();
                if(!$p || !$c) throw new RuntimeException("Offering relationship guard failed ".$o['slug']);
                $existing=$db::table('program_offerings')->where('program_id',$p->id)->where('campus_id',$c->id)->where('delivery_mode','on_campus')->lockForUpdate()->get();
                if($existing->count()>1) throw new RuntimeException("Duplicate offering ".$o['slug']);
