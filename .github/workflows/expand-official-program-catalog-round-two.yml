              ['slug'=>'comsats-lahore-bs-artificial-intelligence','institution_id'=>9,'campus_id'=>2,'duration'=>null],
              ['slug'=>'comsats-lahore-bs-software-engineering','institution_id'=>9,'campus_id'=>2,'duration'=>null],
              ['slug'=>'bahria-islamabad-bs-artificial-intelligence','institution_id'=>14,'campus_id'=>4,'duration'=>'4 years'],
              ['slug'=>'bahria-islamabad-bs-information-technology','institution_id'=>14,'campus_id'=>4,'duration'=>'4 years'],
              ['slug'=>'bahria-islamabad-bachelor-studies-english','institution_id'=>14,'campus_id'=>4,'duration'=>'4 years'],
              ['slug'=>'vu-bs-data-science','institution_id'=>16,'campus_id'=>6,'duration'=>'4 years'],
              ['slug'=>'vu-bs-software-engineering','institution_id'=>16,'campus_id'=>6,'duration'=>'4 years'],
              ['slug'=>'vu-bs-information-technology','institution_id'=>16,'campus_id'=>6,'duration'=>'4 years'],
              ['slug'=>'nust-bs-artificial-intelligence','institution_id'=>19,'campus_id'=>9,'duration'=>'4 years'],
              ['slug'=>'nust-bs-data-science','institution_id'=>19,'campus_id'=>9,'duration'=>'4 years'],
