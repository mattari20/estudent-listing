name: Final Public Directory Verification

on:
  push:
    branches:
      - ops/final-public-directory-verification

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every active institution profile and canonical data health
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          command_timeout: 3m
          script: |
            set -euo pipefail
            cd /home/u537436044/domains/estudent.pk/public_html/institutes
            php <<'PHP' > /tmp/active-institutions.tsv
            <?php
            require 'vendor/autoload.php';
            $app=require_once 'bootstrap/app.php';
            $kernel=$app->make(Illuminate\Contracts\Console\Kernel::class);
            $kernel->bootstrap();
            $db=Illuminate\Support\Facades\DB::class;
            foreach($db::table('institutions')->where('status','active')->orderBy('id')->get(['id','slug']) as $i) {
              echo $i->id."\t".$i->slug."\n";
            }
            PHP
            count=0
            failures=0
            while IFS="$(printf '\t')" read -r id slug; do
              [ -n "$slug" ] || continue
              count=$((count+1))
              body="/tmp/institute-profile-$id.html"
              status=$(curl -sS -L --max-time 15 -o "$body" -w '%{http_code}' "https://estudent.pk/institutes/$slug")
              if [ "$status" = "200" ] && [ -s "$body" ] && [ "$(wc -c < "$body")" -gt 100 ]; then
                echo "PASS | HTTP=$status | ID=$id | $slug"
              else
                echo "FAIL | HTTP=$status | ID=$id | $slug"
                failures=$((failures+1))
              fi
            done < /tmp/active-institutions.tsv
            echo "PROFILE_ROUTES_CHECKED=$count"
            echo "PROFILE_ROUTE_FAILURES=$failures"
            [ "$count" -eq 19 ]
            [ "$failures" -eq 0 ]
            curl -sS -L --max-time 15 -o /tmp/institutes-index.html -w "DIRECTORY_INDEX_HTTP=%{http_code}\n" https://estudent.pk/institutes/
            test -s /tmp/institutes-index.html
            echo "DIRECTORY_INDEX_NONEMPTY=yes"
            php <<'PHP'
            <?php
            require 'vendor/autoload.php';
            $app=require_once 'bootstrap/app.php';
            $kernel=$app->make(Illuminate\\Contracts\\Console\\Kernel::class);
            $kernel->bootstrap();
            $db=Illuminate\\Support\\Facades\\DB::class;
            $profiles=$db::table('institutions')->where('status','active')->whereNotNull('description')->whereNotNull('verified_at')->count();
            $campuses=$db::table('campuses')->where('status','active')->whereNotNull('geography_id')->count();
            $programs=$db::table('programs')->where('status','active')->count();
            echo "VERIFIED_PROFILES={$profiles};ACTIVE_GEO_LINKED_CAMPUSES={$campuses};ACTIVE_PROGRAMS={$programs}\\n";
            if($profiles!==19 || $campuses!==19 || $programs!==11) exit(6);
            PHP
            php artisan institutes:data-gap-report --json | php -r '$d=json_decode(stream_get_contents(STDIN),true); if(!is_array($d)) exit(2); echo "FINAL_DATA_GAP_STATUS=".($d["status"]??"unknown")."\n"; echo "FINAL_POPULATION=".json_encode($d["sections"]["canonical_population"]??null)."\n"; echo "FINAL_RELATIONSHIP_GAPS=".json_encode($d["sections"]["canonical_relationship_gaps"]??null)."\n"; if(($d["mutation_performed"]??null)!==false) exit(4); if(($d["status"]??null)!=="healthy") exit(5);'
