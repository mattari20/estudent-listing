name: Phase 1C — Protected Read-only Schema Diagnostic

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact current main SHA to verify"
        required: true
        type: string
      operation_reason:
        description: "Reason for full read-only schema evidence collection"
        required: true
        type: string
      confirm_production_operation:
        description: "Exact operation-specific read-only confirmation"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phase1c-protected-readonly-schema-diagnostic
  cancel-in-progress: false

jobs:
  collect:
    environment: production-readonly-diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout immutable dispatch revision for authorization
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: .production-dispatch-guard

      - name: Validate existing protected dispatch controls
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          OPERATION_REASON: ${{ inputs.operation_reason }}
          CONFIRM_PRODUCTION_OPERATION: ${{ inputs.confirm_production_operation }}
          EXPECTED_CONFIRMATION: "AUTHORIZE-PHASE1C-STRUCTURAL-READONLY-DIAGNOSTIC"
        run: bash .production-dispatch-guard/scripts/ci/validate-production-dispatch.sh

      - name: Validate environment-scoped production credentials (Hostinger)
        env:
          HOST: ${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_HOST }}
          USER: ${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_USER }}
          KEY: ${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_PRIVATE_KEY }}
          PORT: ${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USER" && test -n "$KEY" && test -n "$PORT"
          echo "hostinger_readonly_credentials=present"

      - name: Checkout exact validated source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          path: .target-source

      - name: Prepare binary-safe SSH transfer client
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_PORT }}
          SSH_KEY: ${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/phase1c-hostinger-readonly-key"
          known_hosts_file="$RUNNER_TEMP/phase1c-hostinger-known-hosts"
          printf '%s\n' "$SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" > "$known_hosts_file" 2>/dev/null
          test -s "$known_hosts_file"
          echo "binary_ssh_transport=prepared"

      - name: Prepare standalone collector transfer
        id: collector
        working-directory: .target-source
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/phase1c/readonly-schema-diagnostic.php
          base64 -w0 scripts/phase1c/readonly-schema-diagnostic.php > collector.b64
          echo "collector_b64=$(cat collector.b64)" >> "$GITHUB_OUTPUT"
          rm -f collector.b64

      - name: Run standalone read-only collector and stage bounded compressed evidence
        id: collect
        uses: appleboy/ssh-action@v1.2.1
        env:
          PROJECT_PATH: /home/u537436044/domains/estudent.pk/public_html/institutes
          TRANSFER_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          TARGET_SHA: ${{ inputs.target_sha }}
          COLLECTOR_B64: ${{ steps.collector.outputs.collector_b64 }}
        with:
          host: ${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_USER }}
          key: ${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_PORT }}
          envs: PROJECT_PATH,TRANSFER_ID,TARGET_SHA,COLLECTOR_B64
          command_timeout: 5m
          script: |
            set -eu
            case "$PROJECT_PATH" in /*) ;; *) echo '{"diagnostic_state":"FAILED_SAFE","reason":"INVALID_PROJECT_PATH"}'; exit 2 ;; esac
            case "$PROJECT_PATH" in *".."*) echo '{"diagnostic_state":"FAILED_SAFE","reason":"INVALID_PROJECT_PATH"}'; exit 2 ;; esac
            case "$TRANSFER_ID" in ''|*[!0-9-]*) echo '{"diagnostic_state":"FAILED_SAFE","reason":"INVALID_TRANSFER_ID"}'; exit 2 ;; esac
            case "$TARGET_SHA" in *[!0-9a-f]*|'') echo '{"diagnostic_state":"FAILED_SAFE","reason":"INVALID_TARGET_SHA"}'; exit 2 ;; esac
            [ "${#TARGET_SHA}" -eq 40 ] || { echo '{"diagnostic_state":"FAILED_SAFE","reason":"INVALID_TARGET_SHA"}'; exit 2; }
            [ -f "$PROJECT_PATH/artisan" ] || { echo '{"diagnostic_state":"FAILED_SAFE","reason":"PROJECT_ARTISAN_MISSING"}'; exit 3; }
            [ -f "$PROJECT_PATH/vendor/autoload.php" ] || { echo '{"diagnostic_state":"FAILED_SAFE","reason":"COMPOSER_AUTOLOAD_MISSING"}'; exit 4; }
            PHP_BIN="/opt/alt/php85/usr/bin/php"
            [ -x "$PHP_BIN" ] || { echo '{"diagnostic_state":"FAILED_SAFE","reason":"APPROVED_PHP_UNAVAILABLE"}'; exit 5; }
            umask 077
            collector_tmp="$(mktemp /tmp/phase1c-readonly-diagnostic.XXXXXX.php)"
            evidence_tmp="$(mktemp /tmp/phase1c-readonly-evidence.XXXXXX.json)"
            compressed_tmp="$(mktemp /tmp/phase1c-readonly-evidence.XXXXXX.gz)"
            manifest_tmp="$(mktemp /tmp/phase1c-readonly-manifest.XXXXXX.json)"
            trap 'rm -f "$collector_tmp" "$evidence_tmp" "$compressed_tmp" "$manifest_tmp"' EXIT HUP INT TERM
            printf '%s' "$COLLECTOR_B64" | base64 -d > "$collector_tmp"
            chmod 600 "$collector_tmp" "$evidence_tmp" "$compressed_tmp" "$manifest_tmp"
            "$PHP_BIN" "$collector_tmp" "$PROJECT_PATH" > "$evidence_tmp"
            gzip -c "$evidence_tmp" > "$compressed_tmp"
            compressed_bytes="$(wc -c < "$compressed_tmp" | tr -d ' ')"
            if [ "$compressed_bytes" -gt 70000 ]; then
              echo '{"diagnostic_state":"FAILED_SAFE","reason":"COMPRESSED_EVIDENCE_EXCEEDS_SAFE_TRANSFER_LIMIT"}'
              exit 6
            fi
            compressed_sha256="$(sha256sum "$compressed_tmp" | awk '{print $1}')"
            remote_prefix="/tmp/phase1c-readonly-evidence-$TRANSFER_ID"
            printf '{"workflow_run_id":"%s","target_sha":"%s","compressed_bytes":%s,"compressed_sha256":"%s"}\n' \
              "${GITHUB_RUN_ID:-${TRANSFER_ID%%-*}}" "$TARGET_SHA" "$compressed_bytes" "$compressed_sha256" > "$manifest_tmp"
            chmod 600 "$compressed_tmp" "$manifest_tmp"
            mv "$compressed_tmp" "${remote_prefix}.gz"
            mv "$manifest_tmp" "${remote_prefix}.manifest.json"
            echo "evidence_ready=1 compressed_bytes=$compressed_bytes compressed_sha256=$compressed_sha256"

      - name: Stream evidence over SSH and validate before materialization
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_USER }}
          SSH_PORT: ${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_PORT }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          transfer_id="$RUN_ID-$RUN_ATTEMPT"
          case "$transfer_id" in ''|*[!0-9-]*) echo "transfer_validation=FAIL reason=invalid_transfer_id"; exit 1 ;; esac
          remote_prefix="/tmp/phase1c-readonly-evidence-$transfer_id"
          key_file="$RUNNER_TEMP/phase1c-hostinger-readonly-key"
          known_hosts_file="$RUNNER_TEMP/phase1c-hostinger-known-hosts"
          ssh_options=(-T -q -p "$SSH_PORT" -i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts_file")
          ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" "cat '$remote_prefix.manifest.json'" > remote-evidence-manifest.json
          ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" "cat '$remote_prefix.gz'" > evidence.gz.part
          mv evidence.gz.part evidence.gz
          python3 .target-source/scripts/phase1c/validate-evidence-transfer.py \
            --manifest remote-evidence-manifest.json \
            --compressed evidence.gz \
            --schema .target-source/scripts/phase1c/readonly-diagnostic.schema.json \
            --validator .target-source/scripts/phase1c/validate-readonly-evidence.py \
            --evidence-output phase1c-readonly-evidence.json \
            --run-id "$RUN_ID" \
            --target-sha "$TARGET_SHA"

      - name: Remove temporary remote and runner transfer files
        if: always()
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_USER }}
          SSH_PORT: ${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_PORT }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set +e
          transfer_id="$RUN_ID-$RUN_ATTEMPT"
          if [[ "$transfer_id" =~ ^[0-9-]+$ ]]; then
            remote_prefix="/tmp/phase1c-readonly-evidence-$transfer_id"
            key_file="$RUNNER_TEMP/phase1c-hostinger-readonly-key"
            known_hosts_file="$RUNNER_TEMP/phase1c-hostinger-known-hosts"
            if [[ -s "$key_file" && -s "$known_hosts_file" ]]; then
              ssh -T -q -p "$SSH_PORT" -i "$key_file" \
                -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                -o "UserKnownHostsFile=$known_hosts_file" \
                "$SSH_USER@$SSH_HOST" "rm -f '$remote_prefix.gz' '$remote_prefix.manifest.json'" \
                || echo "remote_transfer_cleanup=WARNING"
            fi
          fi
          rm -f "$RUNNER_TEMP/phase1c-hostinger-readonly-key" \
            "$RUNNER_TEMP/phase1c-hostinger-known-hosts" evidence.gz evidence.gz.part remote-evidence-manifest.json

      - name: Retain sanitized evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase1c-readonly-diagnostic-${{ github.run_id }}
          path: |
            phase1c-readonly-evidence.json
            evidence-manifest.json
            evidence.sha256
          if-no-files-found: error
          retention-days: 7
