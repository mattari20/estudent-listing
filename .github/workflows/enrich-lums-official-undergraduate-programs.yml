name: Enrich LUMS Official Undergraduate Programs
on:
  push:
    branches:
      - ops/enrich-lums-official-undergraduate-programs
permissions:
  contents: read
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Add source-verified LUMS programs and main-campus offerings
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          command_timeout: 3m
          script: |
            set -euo pipefail
            cd /home/u537436044/domains/estudent.pk/public_html/institutes
            php <<'PHP'
            <?php
            require 'vendor/autoload.php';
            $app=require_once 'bootstrap/app.php';
            $kernel=$app->make(Illuminate\Contracts\Console\Kernel::class);
            $kernel->bootstrap();
            $db=Illuminate\Support\Facades\DB::class;
            $source='https://admission.lums.edu.pk/undergraduate-programmes';
            $specs=[
              ['name'=>'BS Biology','slug'=>'lums-bs-biology','award'=>'BS','discipline'=>'Biology'],
              ['name'=>'BSc (Honours) Accounting and Finance','slug'=>'lums-bsc-honours-accounting-and-finance','award'=>'BSc (Honours)','discipline'=>'Accounting and Finance'],
            ];
            $db::transaction(function() use ($db,$source,$specs) {
              $i=$db::table('institutions')->where('id',8)->lockForUpdate()->first();
              $c=$db::table('campuses')->where('id',2)->lockForUpdate()->first();
              if(!$i || $i->name!=='Lahore University of Management Sciences' || $i->status!=='active') throw new RuntimeException('LUMS identity guard failed');
              if(!$c || (int)$c->institution_id!==8 || $c->name!=='LUMS Main Campus' || $c->status!=='active' || (int)$c->geography_id!==9) throw new RuntimeException('LUMS campus guard failed');
              foreach($specs as $s) {
                $found=$db::table('programs')->where('institution_id',8)->where('slug',$s['slug'])->lockForUpdate()->get();
                if($found->count()>1) throw new RuntimeException('Duplicate program identity '.$s['slug']);
                if($found->count()===0) {
                  $pid=$db::table('programs')->insertGetId(['institution_id'=>8,'name'=>$s['name'],'slug'=>$s['slug'],'program_level'=>'undergraduate','award'=>$s['award'],'discipline'=>$s['discipline'],'status'=>'active','description'=>'Official LUMS undergraduate programme listing: '.$source,'created_at'=>now(),'updated_at'=>now()]);
                  echo "PROGRAM_ADDED=".$s['slug'].";ID=".$pid."\n";
                } else {
                  $p=$found->first();
                  if($p->name!==$s['name'] || $p->status!=='active') throw new RuntimeException('Existing program mismatch '.$s['slug']);
                  $pid=(int)$p->id;
                  $desc=(string)$p->description;
                  if(strpos($desc,$source)===false) $db::table('programs')->where('id',$pid)->update(['description'=>trim($desc.' | Official LUMS undergraduate programme listing: '.$source),'updated_at'=>now()]);
                  echo "PROGRAM_REUSED=".$s['slug'].";ID=".$pid."\n";
                }
                $offers=$db::table('program_offerings')->where('program_id',$pid)->where('campus_id',2)->where('delivery_mode','on_campus')->lockForUpdate()->get();
                if($offers->count()>1) throw new RuntimeException('Duplicate LUMS offering '.$s['slug']);
                if($offers->count()===0) {
                  $oid=$db::table('program_offerings')->insertGetId(['program_id'=>$pid,'campus_id'=>2,'delivery_mode'=>'on_campus','status'=>'active','intake_label'=>null,'duration'=>null,'availability'=>'unknown','effective_from'=>null,'effective_until'=>null,'created_at'=>now(),'updated_at'=>now()]);
                  echo "OFFERING_ADDED=".$s['slug'].";ID=".$oid."\n";
                } elseif($offers->first()->status!=='active') throw new RuntimeException('LUMS offering is not active '.$s['slug']);
              }
            });
            $counts=['active_programs'=>$db::table('programs')->where('status','active')->count(),'active_offerings'=>$db::table('program_offerings')->where('status','active')->count(),'lums_programs'=>$db::table('programs')->where('institution_id',8)->where('status','active')->count(),'lums_offerings'=>$db::table('program_offerings as o')->join('programs as p','p.id','=','o.program_id')->where('p.institution_id',8)->where('o.status','active')->count(),'broken_offerings'=>$db::table('program_offerings as o')->leftJoin('programs as p','p.id','=','o.program_id')->leftJoin('campuses as c','c.id','=','o.campus_id')->where('o.status','active')->where(function($q){$q->whereNull('p.id')->orWhereNull('c.id')->orWhere('p.status','<>','active')->orWhere('c.status','<>','active');})->count()];
            echo "LUMS_ENRICHMENT_COUNTS=".json_encode($counts)."\n";
            if($counts['active_programs']!==76 || $counts['active_offerings']!==41 || $counts['lums_programs']!==5 || $counts['lums_offerings']!==3 || $counts['broken_offerings']!==0) throw new RuntimeException('LUMS enrichment verification failed');
            PHP
            php artisan institutes:data-gap-report --json | php -r '$d=json_decode(stream_get_contents(STDIN),true); if(!is_array($d)) exit(2); echo "DATA_GAP_STATUS=".($d["status"]??"unknown")."\n"; echo "POPULATION=".json_encode($d["sections"]["canonical_population"]??null)."\n"; echo "GAPS=".json_encode($d["sections"]["canonical_relationship_gaps"]??null)."\n"; if(($d["mutation_performed"]??null)!==false || ($d["status"]??null)!=="healthy") exit(5);'
