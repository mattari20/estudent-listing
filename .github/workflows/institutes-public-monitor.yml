name: Institutes Public Site Monitor

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # Daily at 08:30 Pakistan Standard Time (03:30 UTC).
    - cron: "30 3 * * *"

permissions:
  contents: read

concurrency:
  group: institutes-public-site-monitor
  # A stale monitor should not block verification of the latest deployment.
  cancel-in-progress: true

jobs:
  public-smoke-check:
    name: Public directory smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check public directory pages
        shell: bash
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/institutes-public-health.txt"
          : > "$report"
          failures=0

          check_url() {
            local url="$1"
            local expected_pattern="${2:-}"
            local extra_pattern="${3:-}"
            local body="$RUNNER_TEMP/response-$RANDOM.html"
            local status="request-error"
            local attempt

            # Hostinger Git deployment can start shortly after a push. Retry
            # for up to ~5 minutes rather than failing on the first transient response.
            for attempt in {1..6}; do
              status="$(curl --location --silent --show-error --max-time 15 \
                --output "$body" --write-out '%{http_code}' "$url" 2>"$RUNNER_TEMP/curl-error.txt" || true)"
              if [[ "$status" == "200" && -s "$body" ]]; then
                # HTML templates may wrap visible text across source lines. Normalize line
                # breaks before checking content so formatting does not create false failures.
                if [[ -n "$expected_pattern" ]] && ! tr '\n\r' '  ' < "$body" | grep -Eiq "$expected_pattern"; then
                  status="content-mismatch"
                elif [[ -n "$extra_pattern" ]] && ! grep -Eiq "$extra_pattern" "$body"; then
                  status="page-size-mismatch"
                else
                  printf 'PASS | HTTP %s | expected content present | %s | attempt %s/6\n' "$status" "$url" "$attempt" | tee -a "$report"
                  rm -f "$body" "$RUNNER_TEMP/curl-error.txt"
                  return
                fi
              fi
              if (( attempt < 6 )); then
                sleep 15
              fi
            done

            printf 'FAIL | %s | expected content missing or request failed | %s | retries exhausted\n' "${status:-request-error}" "$url" | tee -a "$report"
            if [[ -s "$RUNNER_TEMP/curl-error.txt" ]]; then
              sed -n '1,2p' "$RUNNER_TEMP/curl-error.txt" | tee -a "$report"
            fi
            failures=$((failures + 1))
            rm -f "$body" "$RUNNER_TEMP/curl-error.txt"
          }

          # Check the result summary and confirm 24 per page is the selected default.
          check_url "https://estudent.pk/institutes/" 'Showing.*of.*institutions|No institutions to display' 'value="24"[^>]*selected|selected[^>]*value="24"'
          # Resolve a detail URL from the live listing instead of assuming a
          # particular canonical institution exists. Empty listings are a clear blocker.
          listing_html="$RUNNER_TEMP/institutes-listing-for-detail.html"
          listing_status="$(curl --location --silent --show-error --max-time 20 --output "$listing_html" --write-out '%{http_code}' "https://estudent.pk/institutes/" 2>"$RUNNER_TEMP/listing-curl-error.txt" || true)"
          detail_path=""
          if [[ "$listing_status" == "200" && -s "$listing_html" ]]; then
            detail_path="$(python - "$listing_html" <<'PY'
          import re, sys
          from html import unescape
          from pathlib import Path
          html = unescape(Path(sys.argv[1]).read_text(errors="replace"))
          for href in re.findall(r'''href=["']([^"']+)["']''', html, flags=re.I):
              match = re.fullmatch(r'(?:https://estudent\.pk)?(/institutes/([a-z0-9-]+))/?', href, flags=re.I)
              if match and match.group(2).lower() not in {"search", "login", "setup", "automation", "sitemap", "robots"}:
                  print(match.group(1))
                  break
          PY
          )"
          fi
          if [[ -n "$detail_path" ]]; then
            check_url "https://estudent.pk${detail_path}"
          else
            printf 'BLOCKED | no institution detail URL found in live listing | HTTP %s | canonical record availability must be verified; no record was created\n' "$listing_status" | tee -a "$report"
            failures=$((failures + 1))
          fi

          {
            echo "## Institutes public-site health check"
            echo
            echo "- Checked at (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "- Scope: post-push public HTTP and expected-content check with retries (not Hostinger deployment-commit confirmation)"
            echo "- Production database queried: no"
            echo "- Production data changed: no"
            echo
            echo '~~~text'
            cat "$report"
            echo '~~~'
            echo
            echo "Failure count: $failures"
          } >> "$GITHUB_STEP_SUMMARY"

          if (( failures > 0 )); then
            echo "::error::One or more public Institutes pages failed the HTTP smoke check."
            exit 1
          fi

      - name: Save sanitized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: institutes-public-health-report
          path: ${{ runner.temp }}/institutes-public-health.txt
          if-no-files-found: ignore
          retention-days: 14
