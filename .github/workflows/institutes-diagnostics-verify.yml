name: Institutes Protected Diagnostics Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: institutes-protected-diagnostics-verification
  cancel-in-progress: false

jobs:
  verify-protected-diagnostics:
    name: Verify protected diagnostics without exposing report data
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      INSTITUTES_DIAGNOSTICS_TOKEN: ${{ secrets.INSTITUTES_DIAGNOSTICS_TOKEN }}
    steps:
      - name: Verify authentication and all read-only report contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import ssl
          import sys
          import urllib.error
          import urllib.request

          endpoint = "https://estudent.pk/institutes/automation/diagnostics"
          token = os.environ.get("INSTITUTES_DIAGNOSTICS_TOKEN", "")

          # Never print the token, request headers, response body, or report fields.
          if len(token) < 32:
              print("FAIL | required repository secret is missing or too short")
              sys.exit(1)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(
              NoRedirect(),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
          )

          def request_status(auth_value=None):
              headers = {"Accept": "application/json"}
              if auth_value is not None:
                  headers["Authorization"] = auth_value
              request = urllib.request.Request(endpoint, headers=headers, method="GET")
              try:
                  with opener.open(request, timeout=20) as response:
                      return response.status, response.read(), dict(response.headers)
              except urllib.error.HTTPError as error:
                  body = error.read()
                  return error.code, body, dict(error.headers)
              except Exception:
                  print("FAIL | HTTPS request failed; details suppressed")
                  sys.exit(1)

          missing_status, _, _ = request_status()
          if missing_status != 403:
              print("FAIL | unauthenticated request was not rejected with HTTP 403")
              sys.exit(1)
          print("PASS | unauthenticated request rejected")

          invalid_status, _, _ = request_status("Bearer invalid-token-for-negative-test")
          if invalid_status != 403:
              print("FAIL | invalid bearer token was not rejected with HTTP 403")
              sys.exit(1)
          print("PASS | invalid bearer token rejected")

          valid_status, body, headers = request_status("Bearer " + token)
          if valid_status != 200:
              print("FAIL | configured token did not receive HTTP 200; response details suppressed")
              sys.exit(1)

          if "no-store" not in headers.get("Cache-Control", "").lower():
              print("FAIL | response did not include the expected no-store cache policy")
              sys.exit(1)

          try:
              payload = json.loads(body.decode("utf-8"))
          except Exception:
              print("FAIL | successful response was not valid JSON; body suppressed")
              sys.exit(1)

          expected = {
              "report": "institutes_data_gap_report",
              "record_audit": "institutes_data_gap_record_audit",
              "geography_preflight": "institutes_geography_seed_preflight",
          }
          reports = payload.get("reports")
          if not isinstance(reports, dict):
              print("FAIL | expected reports object missing; response details suppressed")
              sys.exit(1)

          for key, check_name in expected.items():
              entry = reports.get(key)
              data = entry.get("data") if isinstance(entry, dict) else None
              if not isinstance(data, dict) or data.get("check") != check_name:
                  print("FAIL | report contract failed for " + key + "; response details suppressed")
                  sys.exit(1)
              if data.get("mutation_performed") is not False:
                  print("FAIL | read-only safety marker failed for " + key)
                  sys.exit(1)
              if "exit_code" not in entry:
                  print("FAIL | report exit code missing for " + key)
                  sys.exit(1)

          geography = reports["geography_preflight"]["data"]
          if geography.get("seed_command_executed") is not False:
              print("FAIL | geography preflight indicates seed command execution")
              sys.exit(1)
          if payload.get("mutation_performed") is not False:
              print("FAIL | combined response does not confirm read-only execution")
              sys.exit(1)
          if payload.get("status") not in ("complete", "warning", "critical"):
              print("FAIL | combined status field missing or invalid")
              sys.exit(1)

          print("PASS | valid bearer token accepted")
          print("PASS | all three report contracts verified without displaying report data")
          print("PASS | no-store cache policy verified")
          print("PASS | every report and combined response confirms mutation_performed=false")
          print("PASS | geography seed command was not executed")
          print("SUMMARY | verification passed; production report contents and counts were not logged or saved")
          PY
