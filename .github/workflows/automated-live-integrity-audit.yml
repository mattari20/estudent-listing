name: Automated Live Data Integrity Audit

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact 40-character SHA of the current main revision."
        required: true
        type: string
      operation_reason:
        description: "Reason or ticket reference for this read-only production audit."
        required: true
        type: string
      confirm_production_operation:
        description: "Type the exact operation-specific confirmation phrase."
        required: true
        type: string
permissions:
  contents: read

concurrency:
  group: automated-live-integrity-audit
  cancel-in-progress: false

jobs:
  audit:
    environment: production-readonly-diagnostics
    name: Run read-only integrity report on Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact dispatch revision for authorization checks
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: .production-dispatch-guard
      - name: Validate protected production dispatch
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          OPERATION_REASON: ${{ inputs.operation_reason }}
          CONFIRM_PRODUCTION_OPERATION: ${{ inputs.confirm_production_operation }}
          EXPECTED_CONFIRMATION: "AUTHORIZE-READONLY-DIAGNOSTICS-LIVE-INTEGRITY"
        run: bash .production-dispatch-guard/scripts/ci/validate-production-dispatch.sh
      - name: Validate environment-scoped production credentials
        env:
          PRODUCTION_READONLY_HOSTINGER_SSH_HOST: ${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_HOST }}
          PRODUCTION_READONLY_HOSTINGER_SSH_USER: ${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_USER }}
          PRODUCTION_READONLY_HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_PRIVATE_KEY }}
          PRODUCTION_READONLY_HOSTINGER_SSH_PORT: ${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          for name in
          "PRODUCTION_READONLY_HOSTINGER_SSH_HOST"
          "PRODUCTION_READONLY_HOSTINGER_SSH_USER"
          "PRODUCTION_READONLY_HOSTINGER_SSH_PRIVATE_KEY"
          "PRODUCTION_READONLY_HOSTINGER_SSH_PORT"
          ; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required environment-scoped credential: $name"
              exit 1
            fi
          done
          echo "environment_scoped_credentials=present"

      - name: Checkout main and resolve expected application-code revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Resolve expected application-code revision
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git log -1 --format=%H -- app bootstrap config database resources routes composer.json composer.lock public artisan)"
          test -n "$revision"
          echo "target_revision=$revision" >> "$GITHUB_OUTPUT"
          echo "expected_application_revision=$revision"

      - name: Verify deployed application-code revision and run read-only audit
        uses: appleboy/ssh-action@v1.2.0
        env:
          PROJECT_PATH: /home/u537436044/domains/estudent.pk/public_html/institutes
          TARGET_REVISION: ${{ steps.revision.outputs.target_revision }}
        with:
          host: ${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_USER }}
          key: ${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_PORT }}
          envs: PROJECT_PATH,TARGET_REVISION
          command_timeout: 7m
          script: |
            set -eu
            case "$PROJECT_PATH" in /*) ;; *) echo "ERROR: invalid project path"; exit 2 ;; esac
            case "$PROJECT_PATH" in *".."*) echo "ERROR: invalid project path"; exit 2 ;; esac
            test -f "$PROJECT_PATH/artisan" || { echo "ERROR: artisan not found"; exit 3; }
            cd "$PROJECT_PATH"
            git rev-parse --is-inside-work-tree >/dev/null
            DEPLOYED_CHECKOUT_REVISION="$(git rev-parse HEAD)"
            if ! git cat-file -e "$TARGET_REVISION^{commit}" 2>/dev/null; then
              git fetch --quiet --no-tags origin "$TARGET_REVISION" || git fetch --quiet --no-tags origin main
            fi
            git cat-file -e "$TARGET_REVISION^{commit}" || {
              echo "ERROR: target application-code revision could not be fetched into Hostinger Git metadata"
              exit 12
            }
            echo "deployed_checkout_revision=$DEPLOYED_CHECKOUT_REVISION"
            echo "expected_application_revision=$TARGET_REVISION"
            # Compare the deployed checkout's tracked application tree to the target
            # application-code commit, then reject any local tracked app-code drift.
            # This matches the read-only diagnostics semantics and avoids comparing
            # the target commit against the working tree as if it were a commit.
            if ! git diff --quiet "$TARGET_REVISION" "$DEPLOYED_CHECKOUT_REVISION" -- app bootstrap config database resources routes composer.json composer.lock public artisan; then
              echo "audit_status=BLOCKED_APPLICATION_CODE_MISMATCH"
              echo "No live database query was run because deployed checkout code differs from the expected application revision."
              exit 10
            fi
            if ! git diff --quiet HEAD -- app bootstrap config database resources routes composer.json composer.lock public artisan || ! git diff --cached --quiet HEAD -- app bootstrap config database resources routes composer.json composer.lock public artisan; then
              echo "audit_status=BLOCKED_LOCAL_APPLICATION_CODE_DRIFT"
              echo "No live database query was run because tracked application files differ from the deployed checkout commit."
              exit 11
            fi
            echo "deployed_application_code_status=APPLICATION_CODE_MATCH"
            echo "audit_status=RUNNING_READ_ONLY_REPORT"
            php artisan institutes:data-integrity-report --no-ansi
            echo "audit_status=READ_ONLY_REPORT_COMPLETED"
            echo "production_data_mutations=NOT_RUN"
            echo "database_migrations=NOT_RUN"
