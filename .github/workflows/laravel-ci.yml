name: Laravel CI

on:
  push:
    branches: [main, feat/persistent-project-controller]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: database/testing.sqlite

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, mbstring, xml, curl, sqlite3, pdo_sqlite, mysql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare SQLite database
        run: |
          mkdir -p database
          touch database/testing.sqlite

      - name: Prepare test database
        run: php artisan migrate:fresh --force

      - name: Run Laravel tests
        run: composer test

      - name: Format changed discovery files
        run: >-
          vendor/bin/pint
          bootstrap/app.php
          app/Services/StructuredEnrichmentService.php
          tests/Feature/InstitutesDirectoryTest.php
          tests/Feature/InstituteAgentBootstrapTest.php
          app/Console/Commands/DatabaseHealthCheck.php
          app/Console/Commands/AuditLegacyIdentityKeys.php
          app/Console/Commands/GeographySeedPreflight.php
          app/Services/InstituteDiscoveryCandidateExtractor.php
          tests/Unit/InstituteDiscoveryCandidateExtractorTest.php
          tests/Feature/DatabaseHealthCheckTest.php
          tests/Feature/LegacyIdentityKeyInventoryTest.php
          tests/Feature/AuditLegacyIdentityKeysCommandSafetyTest.php
          tests/Feature/GeographySeedPreflightTest.php
          app/Services/ExecutionLeaseService.php
          app/Console/Commands/BootstrapInstituteAgent.php
          app/Console/Commands/MonitorSourceChanges.php
          app/Console/Commands/RunInstituteDiscoveryAgent.php
          database/migrations/2026_11_03_000001_create_governed_execution_leases_table.php
          database/migrations/2026_11_03_000002_create_governed_execution_runs_table.php
          tests/Feature/ExecutionLeaseServiceTest.php
          app/Services/SourceRetrievalService.php
          app/Services/SourceMonitoringPipeline.php
          app/Models/SourceRetrievalRun.php
          tests/Feature/SourceRetrievalTest.php
          database/migrations/2026_11_03_000003_add_source_retrieval_idempotency_key.php
          app/Services/SourceMonitoringBatchService.php
          app/Services/MonitoringPolicyCheckpointService.php
          app/Services/MonitoringPolicyStateService.php
          app/Console/Commands/MonitorSourceChanges.php
