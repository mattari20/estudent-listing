name: Hostinger Read-only Offering Gap Audit

on:
  workflow_dispatch:
    inputs:
      project_path:
        description: "Absolute path to the Institutes Laravel project directory containing artisan"
        required: true
        type: string
        default: "/home/u537436044/domains/estudent.pk/public_html/institutes"

permissions:
  contents: read

concurrency:
  group: hostinger-readonly-offering-gap-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Run host-local read-only offering-gap audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run audit through existing Hostinger SSH connection
        id: hostinger_audit
        uses: appleboy/ssh-action@v1.2.0
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.HOSTINGER_SSH_FINGERPRINT }}
          capture_stdout: true
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          envs: PROJECT_PATH
          command_timeout: 8m
          script: |
            set -eu
            case "$PROJECT_PATH" in /*) ;; *) echo "ERROR: project_path must be absolute"; exit 2 ;; esac
            case "$PROJECT_PATH" in *".."*) echo "ERROR: project_path must not contain .."; exit 2 ;; esac
            test -f "$PROJECT_PATH/artisan" || { echo "ERROR: artisan not found"; exit 3; }
            test -f "$PROJECT_PATH/vendor/autoload.php" || { echo "ERROR: Composer dependencies are missing"; exit 4; }
            test -f "$PROJECT_PATH/.env" || { echo "ERROR: application .env is missing"; exit 5; }
            cd "$PROJECT_PATH"

            # Credentials remain on Hostinger; this workflow is read-only.
            echo "database_credentials_location=HOSTINGER_ONLY" >&2
            echo "database_grants_check=SKIPPED_HOSTINGER_SHARED_HOSTING_LIMITATION" >&2
            echo "audit_mode=APPLICATION_COMMANDS_READ_ONLY" >&2
            echo "database_migrations=NOT_RUN" >&2
            echo "production_data_mutations=NOT_AUTHORIZED" >&2

            umask 077
            REPORT_DIR="$PROJECT_PATH/storage/app/private/phase2-offering-gap-audits"
            mkdir -p "$REPORT_DIR"
            chmod 700 "$REPORT_DIR"
            STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
            PREFLIGHT="$REPORT_DIR/preflight-$STAMP.json"
            RECON="$REPORT_DIR/reconciliation-$STAMP.json"
            CHECKER="$REPORT_DIR/validate-report-$STAMP.php"
            trap 'rm -f "$CHECKER"' EXIT

            echo "=== Run read-only preflight (no migrations) ===" >&2
            if php artisan institutes:offering-gap-preflight --json --no-ansi > "$PREFLIGHT"; then
              echo "preflight_command_status=PASS" >&2
            else
              echo "preflight_command_status=FAIL" >&2
              exit 40
            fi

            echo "=== Run read-only row-level reconciliation (no mutations) ===" >&2
            if php artisan institutes:offering-gap-reconcile --json --no-ansi > "$RECON"; then
              echo "reconciliation_command_status=PASS" >&2
            else
              echo "reconciliation_command_status=FAIL" >&2
              exit 41
            fi

            # Use a private temporary PHP file rather than "php -" because
            # this Hostinger PHP CLI treats "-" as a filename.
            cat > "$CHECKER" <<'PHP'
            <?php
            foreach (array_slice($argv, 1) as $path) {
                $data = json_decode((string) file_get_contents($path), true);
                if (! is_array($data)) {
                    echo basename($path).'_json_status=INVALID'.PHP_EOL;
                    exit(30);
                }
                $name = str_starts_with(basename($path), 'preflight-') ? 'preflight' : 'reconciliation';
                $summary = $data['summary'] ?? [];
                if (($data['errors'] ?? []) !== []) {
                    echo $name.'_report_errors=present'.PHP_EOL;
                    exit(32);
                }
                if ((int) ($summary['register_rows'] ?? 0) !== 36) {
                    echo $name.'_register_row_count_status=INVALID'.PHP_EOL;
                    exit(33);
                }
                if ($name === 'reconciliation' && ($data['reconciliation_status'] ?? '') !== 'ROW_LEVEL_REPORT_CREATED_REVIEW_REQUIRED') {
                    echo 'reconciliation_status=UNEXPECTED'.PHP_EOL;
                    exit(34);
                }
                echo $name.'_register_rows='.(int) ($summary['register_rows'] ?? 0).PHP_EOL;
                echo $name.'_database_mutations='.(int) ($data['database_mutations'] ?? -1).PHP_EOL;
                echo $name.'_mutation_performed='.((($data['mutation_performed'] ?? null) === false) ? 'false' : 'unexpected').PHP_EOL;
                if (($data['database_mutations'] ?? null) !== 0 || ($data['mutation_performed'] ?? null) !== false) {
                    echo 'ERROR: Audit report failed its zero-mutation contract.'.PHP_EOL;
                    exit(31);
                }
            }
            echo 'report_storage=PRIVATE_HOSTINGER_STORAGE'.PHP_EOL;
            echo 'database_migrations=NOT_RUN'.PHP_EOL;
            echo 'production_data_mutations=NOT_RUN'.PHP_EOL;
            PHP

            php "$CHECKER" "$PREFLIGHT" "$RECON" >&2
            printf 'PREFLIGHT_PATH=%s\nRECON_PATH=%s\n' "$PREFLIGHT" "$RECON"

      - name: Validate report paths from Hostinger
        id: report_paths
        if: success()
        shell: bash
        env:
          AUDIT_STDOUT: ${{ steps.hostinger_audit.outputs.stdout }}
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          # The SSH action may normalize line endings; trim CR and select the last exact marker.
          preflight_path="$(printf '%s\n' "$AUDIT_STDOUT" | tr -d '\r' | sed -n 's/^PREFLIGHT_PATH=//p' | tail -n 1)"
          recon_path="$(printf '%s\n' "$AUDIT_STDOUT" | tr -d '\r' | sed -n 's/^RECON_PATH=//p' | tail -n 1)"
          expected_prefix="${PROJECT_PATH%/}/storage/app/private/phase2-offering-gap-audits/"
          if [[ -z "$preflight_path" || -z "$recon_path" ]]; then
            echo "::error::Hostinger SSH action did not return both report-path markers; refusing to guess report locations."
            echo "preflight_marker_found=$([[ -n "$preflight_path" ]] && echo yes || echo no)"
            echo "reconciliation_marker_found=$([[ -n "$recon_path" ]] && echo yes || echo no)"
            exit 1
          fi
          case "$preflight_path" in "${expected_prefix}"preflight-*.json) ;; *) echo "::error::Unexpected preflight report path (path prefix or filename did not match the configured project directory)."; exit 1 ;; esac
          case "$recon_path" in "${expected_prefix}"reconciliation-*.json) ;; *) echo "::error::Unexpected reconciliation report path (path prefix or filename did not match the configured project directory)."; exit 1 ;; esac
          echo "preflight_path=$preflight_path" >> "$GITHUB_OUTPUT"
          echo "reconciliation_path=$recon_path" >> "$GITHUB_OUTPUT"

      - name: Verify Hostinger SSH fingerprint and download private reports
        if: success()
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_FINGERPRINT: ${{ secrets.HOSTINGER_SSH_FINGERPRINT }}
          PREFLIGHT_PATH: ${{ steps.report_paths.outputs.preflight_path }}
          RECON_PATH: ${{ steps.report_paths.outputs.reconciliation_path }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_HOST" && -n "$SSH_USER" && -n "$SSH_PORT" && -n "$SSH_PRIVATE_KEY" && -n "$SSH_FINGERPRINT" ]] || { echo "::error::Hostinger SSH secrets and the verified host fingerprint are required."; exit 1; }
          key_file="$RUNNER_TEMP/hostinger_audit_key"
          known_hosts="$RUNNER_TEMP/hostinger_known_hosts"
          report_dir="$RUNNER_TEMP/offering-gap-reports"
          mkdir -p "$report_dir"
          chmod 700 "$report_dir"
          trap 'rm -f "$key_file" "$known_hosts"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          scanned_hosts="$RUNNER_TEMP/hostinger_scanned_hosts"
          : > "$known_hosts"
          trap 'rm -f "$key_file" "$known_hosts" "$scanned_hosts"' EXIT
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" 2>/dev/null > "$scanned_hosts"
          [[ -s "$scanned_hosts" ]] || { echo "::error::Could not obtain Hostinger SSH host key."; exit 1; }
          while IFS= read -r host_key_line; do
            printf '%s\n' "$host_key_line" > "$RUNNER_TEMP/host_key_candidate"
            candidate_fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/host_key_candidate" -E sha256 2>/dev/null | awk '{print $2}')"
            if [[ "$candidate_fingerprint" == "$SSH_FINGERPRINT" ]]; then
              printf '%s\n' "$host_key_line" >> "$known_hosts"
            fi
          done < "$scanned_hosts"
          rm -f "$RUNNER_TEMP/host_key_candidate"
          [[ -s "$known_hosts" ]] || { echo "::error::Hostinger SSH fingerprint did not match the configured trusted fingerprint."; exit 1; }
          scp -i "$key_file" -o IdentitiesOnly=yes -o UserKnownHostsFile="$known_hosts" -o StrictHostKeyChecking=yes -P "$SSH_PORT" "$SSH_USER@$SSH_HOST:$PREFLIGHT_PATH" "$report_dir/preflight.json"
          scp -i "$key_file" -o IdentitiesOnly=yes -o UserKnownHostsFile="$known_hosts" -o StrictHostKeyChecking=yes -P "$SSH_PORT" "$SSH_USER@$SSH_HOST:$RECON_PATH" "$report_dir/reconciliation.json"
          jq -e 'type == "object" and .database_mutations == 0 and .mutation_performed == false and (.records | length) == 36' "$report_dir/reconciliation.json" >/dev/null
          jq -e 'type == "object" and .database_mutations == 0 and .mutation_performed == false and (.records | length) == 36' "$report_dir/preflight.json" >/dev/null

      - name: Upload restricted short-retention report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-offering-gap-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/offering-gap-reports/
          if-no-files-found: warn
          retention-days: 3
