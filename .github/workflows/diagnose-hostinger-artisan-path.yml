name: Diagnose Hostinger Laravel Path

on:
  workflow_dispatch:

    inputs:
      target_sha:
        description: "Exact 40-character SHA of the current main revision."
        required: true
        type: string
      operation_reason:
        description: "Reason or ticket reference for this read-only production audit."
        required: true
        type: string
      confirm_production_operation:
        description: "Type the exact operation-specific confirmation phrase."
        required: true
        type: string
permissions:
  contents: read

concurrency:
  group: estudent-production-access
  cancel-in-progress: false
  queue: max
jobs:
  diagnose:
    environment: production-readonly-diagnostics
    name: Find Laravel artisan path (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout exact dispatch revision for authorization checks
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: .production-dispatch-guard
      - name: Validate protected production dispatch
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          OPERATION_REASON: ${{ inputs.operation_reason }}
          CONFIRM_PRODUCTION_OPERATION: ${{ inputs.confirm_production_operation }}
          EXPECTED_CONFIRMATION: "AUTHORIZE-READONLY-DIAGNOSTICS-ARTISAN-PATH"
        run: bash .production-dispatch-guard/scripts/ci/validate-production-dispatch.sh
      - name: Inspect likely project locations over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_USER }}
          key: ${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PRODUCTION_READONLY_HOSTINGER_SSH_PORT }}
          command_timeout: 2m
          script: |
            set -eu
            echo "=== SSH account and home ==="
            id
            printf 'HOME=%s\n' "$HOME"
            pwd
            echo "=== Domain directory candidates ==="
            for base in "$HOME/domains/estudent.pk" "$HOME/domains" "$HOME/public_html" "/home/$(id -un)/domains/estudent.pk" "/home/$(id -un)/public_html"; do
              if [ -d "$base" ]; then
                echo "--- $base ---"
                ls -ld "$base"
                ls -la "$base" | head -40
              fi
            done
            echo "=== artisan files under likely account locations (read-only) ==="
            for base in "$HOME/domains/estudent.pk" "$HOME/public_html" "$HOME"; do
              if [ -d "$base" ]; then
                find "$base" -maxdepth 7 -type f -name artisan -print 2>/dev/null | head -30
              fi
            done
            echo "=== End of read-only path diagnostics ==="
