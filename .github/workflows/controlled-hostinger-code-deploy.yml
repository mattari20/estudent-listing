name: Controlled Hostinger Code Deployment

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: "Set true to deploy the latest application-code revision to production. False performs a read-only preflight."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: controlled-hostinger-code-deployment
  cancel-in-progress: false

jobs:
  resolve-target:
    name: Resolve approved application-code revision
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      target_revision: ${{ steps.revision.outputs.target_revision }}
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve latest application-code commit
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git log -1 --format=%H -- app bootstrap config database resources routes composer.json composer.lock public artisan)"
          test -n "$revision"
          echo "target_revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Resolved latest application-code revision: $revision"

  deploy:
    name: Preflight and optionally deploy application code
    needs: resolve-target
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify remote checkout and deploy only when explicitly confirmed
        uses: appleboy/ssh-action@v1.2.0
        env:
          PROJECT_PATH: /home/u537436044/domains/estudent.pk/public_html/institutes
          TARGET_REVISION: ${{ needs.resolve-target.outputs.target_revision }}
          CONFIRM_DEPLOYMENT: ${{ inputs.confirm_deployment }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          envs: PROJECT_PATH,TARGET_REVISION,CONFIRM_DEPLOYMENT
          command_timeout: 6m
          script: |
            set -eu
            case "$PROJECT_PATH" in /*) ;; *) echo "ERROR: invalid project path"; exit 2 ;; esac
            case "$PROJECT_PATH" in *".."*) echo "ERROR: invalid project path"; exit 2 ;; esac
            test -f "$PROJECT_PATH/artisan" || { echo "ERROR: artisan not found"; exit 3; }
            cd "$PROJECT_PATH"
            git rev-parse --is-inside-work-tree >/dev/null
            PREVIOUS_REVISION="$(git rev-parse HEAD)"
            echo "current_revision=$PREVIOUS_REVISION"
            echo "target_revision=$TARGET_REVISION"
            if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
              echo "ERROR: tracked working-tree changes found; refusing deployment"
              exit 4
            fi
            # Git commit IDs are not application-code identities: main may advance via
            # workflow/docs-only commits. Compare deployed application-path content to target.
            if [ -f .git/shallow ]; then
              git fetch --quiet --no-tags --unshallow origin main || {
                echo "ERROR: unable to obtain history for application-code verification"
                exit 4
              }
            else
              git fetch --quiet --no-tags origin main || {
                echo "ERROR: unable to fetch origin/main for application-code verification"
                exit 4
              }
            fi
            if ! git cat-file -e "$TARGET_REVISION^{commit}" 2>/dev/null; then
              git fetch --quiet --no-tags origin "$TARGET_REVISION" || {
                echo "ERROR: target application revision could not be fetched"
                exit 4
              }
            fi
            git cat-file -e "$TARGET_REVISION^{commit}" || { echo "ERROR: approved target commit unavailable"; exit 4; }
            git fetch --quiet --no-tags origin main || { echo "ERROR: unable to refresh origin/main"; exit 4; }
            git merge-base --is-ancestor "$TARGET_REVISION" FETCH_HEAD || {
              echo "ERROR: approved target is not reachable from origin/main"
              exit 4
            }
            APP_CODE_PATHS='app bootstrap config database resources routes composer.json composer.lock public artisan'
            if ! git diff --quiet HEAD -- $APP_CODE_PATHS ||
               ! git diff --cached --quiet HEAD -- $APP_CODE_PATHS; then
              echo "ERROR: tracked application-code modifications exist in the Hostinger working tree/index"
              exit 4
            fi
            APPLICATION_CODE_MATCH=false
            if git diff --quiet "$TARGET_REVISION" "$PREVIOUS_REVISION" -- $APP_CODE_PATHS; then
              APPLICATION_CODE_MATCH=true
            fi
            DID_DEPLOY=false
            echo "current_git_revision=$PREVIOUS_REVISION"
            echo "target_application_revision=$TARGET_REVISION"
            echo "application_code_parity=$APPLICATION_CODE_MATCH"

            if [ "$CONFIRM_DEPLOYMENT" != "true" ]; then
              echo "deployment_status=NOT_DEPLOYED_DRY_RUN"
              if [ "$APPLICATION_CODE_MATCH" = true ]; then
                echo "dry_run_result=APPLICATION_CODE_ALREADY_ALIGNED"
              else
                echo "dry_run_result=APPLICATION_CODE_DEPLOYMENT_REQUIRED"
              fi
              echo "No application files were changed."
              exit 0
            fi
            if [ "$APPLICATION_CODE_MATCH" = false ]; then
              echo "deployment_status=DEPLOYMENT_CONFIRMED"
              if ! git checkout --detach "$TARGET_REVISION"; then
                git checkout --detach "$PREVIOUS_REVISION" >/dev/null 2>&1 || true
                echo "ERROR: checkout failed; attempted to restore previous revision"
                exit 5
              fi
              DID_DEPLOY=true
            else
              echo "No checkout required: application-code content already matches target."
            fi

            if ! php artisan --version; then
              git checkout --detach "$PREVIOUS_REVISION" >/dev/null 2>&1 || true
              echo "ERROR: Laravel bootstrap smoke test failed; attempted rollback"
              exit 6
            fi
            DEPLOYED_REVISION="$(git rev-parse HEAD)"
            if ! git diff --quiet "$TARGET_REVISION" "$DEPLOYED_REVISION" -- $APP_CODE_PATHS ||
               ! git diff --quiet HEAD -- $APP_CODE_PATHS ||
               ! git diff --cached --quiet HEAD -- $APP_CODE_PATHS; then
              git checkout --detach "$PREVIOUS_REVISION" >/dev/null 2>&1 || true
              echo "ERROR: deployed application code failed independent content-parity verification; attempted rollback"
              exit 7
            fi
            echo "application_code_parity=VERIFIED"
            if [ "$DID_DEPLOY" = true ]; then
              echo "deployment_status=CODE_DEPLOYED_AND_VERIFIED"
            else
              echo "deployment_status=APPLICATION_CODE_ALREADY_ALIGNED_AND_VERIFIED"
            fi
            echo "deployed_git_revision=$DEPLOYED_REVISION"
            echo "verified_target_application_revision=$TARGET_REVISION"
            echo "=== Run read-only Step 3 live offering preflight ==="
            if ! php artisan institutes:offering-gap-preflight --json --no-ansi; then
              git checkout --detach "$PREVIOUS_REVISION" >/dev/null 2>&1 || true
              echo "ERROR: live offering preflight command failed; attempted application-code rollback"
              echo "database_migrations=NOT_RUN"
              echo "production_data_mutations=NOT_RUN"
              exit 8
            fi
            echo "offering_gap_preflight=COMPLETED_READ_ONLY"
            echo "database_migrations=NOT_RUN"
            echo "production_data_mutations=NOT_RUN"
