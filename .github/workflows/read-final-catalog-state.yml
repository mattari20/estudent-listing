name: Read Final Catalog State
on:
  push:
    branches:
      - ops/read-final-catalog-state
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only final counts and current intake state
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            set -euo pipefail
            cd /home/u537436044/domains/estudent.pk/public_html/institutes
            php <<'PHP'
            <?php
            require 'vendor/autoload.php';
            $app=require_once 'bootstrap/app.php';
            $kernel=$app->make(Illuminate\Contracts\Console\Kernel::class);
            $kernel->bootstrap();
            $db=Illuminate\Support\Facades\DB::class;
            $counts=['institutions'=>$db::table('institutions')->where('status','active')->count(),'programs'=>$db::table('programs')->where('status','active')->count(),'offerings'=>$db::table('program_offerings')->where('status','active')->count(),'intakes'=>$db::table('admission_intakes')->count(),'covered'=>$db::table('institutions as i')->join('programs as p','p.institution_id','=','i.id')->where('i.status','active')->where('p.status','active')->distinct()->count('i.id'),'broken'=>$db::table('program_offerings as o')->leftJoin('programs as p','p.id','=','o.program_id')->leftJoin('campuses as c','c.id','=','o.campus_id')->where('o.status','active')->where(function($q){$q->whereNull('p.id')->orWhereNull('c.id')->orWhere('p.status','<>','active')->orWhere('c.status','<>','active');})->count(),'orphan_intakes'=>$db::table('admission_intakes as a')->leftJoin('program_offerings as o','o.id','=','a.program_offering_id')->whereNull('o.id')->count(),'null_geography'=>$db::table('campuses')->where('status','active')->whereNull('geography_id')->count()];
            echo "COUNTS=".json_encode($counts)."\n";
            echo "LUMS_PROGRAMS=".json_encode($db::table('programs')->where('institution_id',8)->get(['id','slug']),JSON_UNESCAPED_SLASHES)."\n";
            echo "LUMS_OFFERINGS=".json_encode($db::table('program_offerings as o')->join('programs as p','p.id','=','o.program_id')->where('p.institution_id',8)->get(['o.id','o.program_id','o.campus_id','o.status','p.slug']),JSON_UNESCAPED_SLASHES)."\n";
            echo "INTAKES=".json_encode($db::table('admission_intakes')->get(['id','program_offering_id','label','status','application_open_at','application_close_at','test_date','application_url']),JSON_UNESCAPED_SLASHES)."\n";
            PHP
            php artisan institutes:data-gap-report --json | php -r '$d=json_decode(stream_get_contents(STDIN),true); if(!is_array($d)) exit(2); echo "REPORT_STATUS=".($d["status"]??"unknown")."\n"; echo "POPULATION=".json_encode($d["sections"]["canonical_population"]??null)."\n"; echo "GAPS=".json_encode($d["sections"]["canonical_relationship_gaps"]??null)."\n";'
