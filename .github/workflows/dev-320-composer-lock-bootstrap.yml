name: DEV-320 Composer Lock Bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'dev-320-composer-lock-final-verification'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Resolve dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --with-all-dependencies

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Commit generated lock
        run: |
          if [ ! -f composer.lock ]; then
            echo "composer.lock was not generated"
            exit 1
          fi
          git add composer.lock
          if git diff --cached --quiet -- composer.lock; then
            echo "composer.lock already tracked and current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "DEV-320: add Composer lockfile"
          git push origin "HEAD:${{ github.head_ref }}"
