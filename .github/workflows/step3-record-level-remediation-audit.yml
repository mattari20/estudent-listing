name: Step 3 Record-Level Remediation Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/step3-record-level-remediation-audit.yml"

permissions:
  contents: read

concurrency:
  group: step3-record-level-remediation-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Run read-only record-level gap audit on Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main and resolve approved application revision
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve approved application-code revision
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git log -1 --format=%H -- app bootstrap config database resources routes composer.json composer.lock public artisan)"
          test -n "$revision"
          echo "target_revision=$revision" >> "$GITHUB_OUTPUT"
          echo "expected_application_revision=$revision"

      - name: Verify deployed application files and run read-only record-level audit
        uses: appleboy/ssh-action@v1.2.0
        env:
          PROJECT_PATH: /home/u537436044/domains/estudent.pk/public_html/institutes
          TARGET_REVISION: ${{ steps.revision.outputs.target_revision }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          envs: PROJECT_PATH,TARGET_REVISION
          command_timeout: 7m
          script: |
            set -eu
            case "$PROJECT_PATH" in /*) ;; *) echo "ERROR: invalid project path"; exit 2 ;; esac
            case "$PROJECT_PATH" in *".. "*) echo "ERROR: invalid project path"; exit 2 ;; esac
            case "$PROJECT_PATH" in *".."*) echo "ERROR: invalid project path"; exit 2 ;; esac
            test -f "$PROJECT_PATH/artisan" || { echo "ERROR: artisan not found"; exit 3; }
            cd "$PROJECT_PATH"
            test -n "$TARGET_REVISION"
            if ! git cat-file -e "$TARGET_REVISION^{commit}" 2>/dev/null; then
              git fetch --quiet --no-tags origin main
            fi
            git cat-file -e "$TARGET_REVISION^{commit}"
            echo "deployed_checkout_revision=$(git rev-parse HEAD)"
            echo "expected_application_revision=$TARGET_REVISION"
            if git diff --quiet "$TARGET_REVISION" HEAD -- app bootstrap config database resources routes composer.json composer.lock public artisan; then
              echo "deployed_application_code_status=APPLICATION_CODE_MATCH"
            else
              echo "audit_status=BLOCKED_APPLICATION_CODE_MISMATCH"
              echo "production_data_mutations=NOT_RUN"
              echo "database_migrations=NOT_RUN"
              exit 10
            fi
            echo "audit_status=RUNNING_READ_ONLY_RECORD_LEVEL_AUDIT"
            php artisan institutes:data-gap-record-audit --json --no-ansi
            echo "audit_status=READ_ONLY_RECORD_LEVEL_AUDIT_COMPLETED"
            echo "production_data_mutations=NOT_RUN"
            echo "database_migrations=NOT_RUN"
