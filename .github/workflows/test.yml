name: Test

on:
  pull_request:
    branches: [main, feat/persistent-project-controller]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: database/testing.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, dom, fileinfo, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend assets
        run: npm run build

      - name: Prepare SQLite database
        run: |
          mkdir -p database
          touch database/testing.sqlite

      - name: Require committed Composer lock
        run: test -f composer.lock

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Prepare test database
        run: php artisan migrate:fresh --force

      - name: Test public listing detail-link state classification
        run: python3 scripts/ci/test-resolve-institute-detail-link.py

      - name: Verify application-code revision parity edge cases
        run: bash scripts/ci/test-application-code-parity.sh

      - name: Test controlled migration revision guard scenarios
        run: sh scripts/ci/test-approved-application-revision-guard.sh

      - name: Validate controlled migration rendered remote script
        run: ruby scripts/ci/test-controlled-migration-workflow.rb
      - name: Validate duplicate_rows read-only schema diagnostics contract
        run: ruby scripts/ci/test-duplicate-rows-migration-workflow.rb
      - name: Validate scheduled discovery dependency conditions
        run: ruby scripts/ci/test-scheduled-discovery-workflow.rb
      - name: Validate bounded Hostinger-to-runner GCU report transfer contract
        run: ruby scripts/ci/test-gcu-qualification-workflow.rb
      - name: Validate read-only Hostinger Artisan runtime diagnostic contract
        run: ruby scripts/ci/test-hostinger-artisan-runtime-diagnostic.rb

      - name: Lint guarded production schema diagnostic
        run: php -l scripts/ops/official-source-refresh-diagnostic.php

      - name: Run tests
        run: composer test
