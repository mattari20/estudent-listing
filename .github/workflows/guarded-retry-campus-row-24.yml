name: Guarded retry for campus row 24 after optional-coordinate normalization

on:
  push:
    branches:
      - ops/retry-campus-row-24-normalized

permissions:
  contents: read

concurrency:
  group: one-time-campus-row-24-normalized-retry
  cancel-in-progress: false

jobs:
  normalize-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Normalize optional coordinates and promote only row 24
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          command_timeout: 3m
          script: |
            set -eu
            cd "/home/u537436044/domains/estudent.pk/public_html/institutes"
            php <<'PHP'
            <?php
            require __DIR__.'/vendor/autoload.php';
            $app = require __DIR__.'/bootstrap/app.php';
            $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();

            $rowId = 24;
            $batchId = 5;
            $result = \Illuminate\Support\Facades\DB::transaction(function () use ($rowId, $batchId) {
                $row = \App\Models\ImportRow::query()->with('batch')->lockForUpdate()->find($rowId);
                if (!$row || (int) $row->import_batch_id !== $batchId || $row->batch?->entity_type !== 'campus' || $row->status !== 'candidate') {
                    throw new RuntimeException('STOP: row 24 is not the expected campus candidate in batch 5.');
                }
                if ($row->parent_subject_type !== \App\Models\Institution::class || !$row->parent_subject_id || !\App\Models\Institution::query()->whereKey($row->parent_subject_id)->exists()) {
                    throw new RuntimeException('STOP: parent institution validation failed.');
                }
                if (\App\Models\ImportConflict::query()->where('import_row_id', $rowId)->where('status', 'open')->exists()) {
                    throw new RuntimeException('STOP: row 24 has an open conflict.');
                }
                $decision = \App\Models\ImportPromotionDecision::query()
                    ->where('import_row_id', $rowId)->where('decision', 'approved')->latest('id')->first();
                if (!$decision) {
                    throw new RuntimeException('STOP: row 24 has no explicit approved decision.');
                }
                $rejected = \App\Models\ImportRow::query()->with('batch')->find(23);
                if (!$rejected || (int) $rejected->import_batch_id !== 4 || $rejected->batch?->entity_type !== 'campus' || $rejected->status !== 'rejected') {
                    throw new RuntimeException('STOP: rejected row 23 is not unchanged.');
                }

                $payload = $row->normalized_payload ?? $row->payload ?? [];
                $name = trim((string) ($payload['name'] ?? ''));
                if ($name === '') {
                    throw new RuntimeException('STOP: campus name is missing.');
                }
                $slug = trim((string) ($payload['slug'] ?? \Illuminate\Support\Str::slug($name)));
                if ($slug === '') {
                    throw new RuntimeException('STOP: campus slug is missing.');
                }
                $geographyId = $payload['geography_id'] ?? null;
                if ($geographyId !== null && $geographyId !== '' && !\App\Models\Geography::query()->whereKey($geographyId)->where('status', 'active')->exists()) {
                    throw new RuntimeException('STOP: geography is missing or inactive.');
                }
                if (\App\Models\Campus::query()->where('institution_id', $row->parent_subject_id)->where('slug', $slug)->exists()) {
                    throw new RuntimeException('STOP: canonical campus duplicate found; no overwrite allowed.');
                }

                $normalizedFields = [];
                foreach (['latitude', 'longitude'] as $field) {
                    $value = $payload[$field] ?? null;
                    if ($value === '') {
                        $payload[$field] = null;
                        $normalizedFields[] = $field;
                    } elseif ($value !== null && !is_numeric($value)) {
                        throw new RuntimeException('STOP: optional coordinate '.$field.' is not numeric or empty.');
                    }
                }
                if ($normalizedFields === []) {
                    throw new RuntimeException('STOP: no empty optional coordinate fields found; do not retry automatically.');
                }

                $row->normalized_payload = $payload;
                $row->save();
                app(\App\Services\ImportPromotionAuditService::class)->record(
                    $row,
                    'promotion_preflight_normalized',
                    (int) $decision->actor_id,
                    'Normalized empty optional coordinate value(s) to null for the explicitly approved campus row before promotion.',
                    ['normalized_fields' => $normalizedFields, 'previous_status' => 'candidate', 'new_status' => 'candidate'],
                    'import_promotion',
                    (int) $decision->id
                );

                $beforeCount = \App\Models\Campus::query()->where('institution_id', $row->parent_subject_id)->count();
                $promotion = app(\App\Services\BulkImportPromotionService::class)->promote([$rowId], (int) $decision->actor_id);
                $fresh = \App\Models\ImportRow::query()->with('batch')->findOrFail($rowId);
                $campus = $fresh->status === 'promoted' && $fresh->canonical_subject_type === \App\Models\Campus::class
                    ? \App\Models\Campus::query()->find($fresh->canonical_subject_id)
                    : null;
                $rejectedAfter = \App\Models\ImportRow::query()->findOrFail(23);
                $afterCount = \App\Models\Campus::query()->where('institution_id', $row->parent_subject_id)->count();

                $verified = $promotion === ['promoted' => 1, 'skipped' => 0, 'failed' => 0]
                    && $fresh->status === 'promoted'
                    && $campus !== null
                    && (int) $campus->institution_id === (int) $row->parent_subject_id
                    && $rejectedAfter->status === 'rejected'
                    && (int) $rejectedAfter->import_batch_id === 4
                    && $afterCount === $beforeCount + 1;
                if (!$verified) {
                    throw new RuntimeException('Promotion verification failed; transaction rolled back to avoid partial repair.');
                }

                return [
                    'check' => 'campus_row_24_promoted_and_verified',
                    'mutation_performed' => true,
                    'row_id' => $rowId,
                    'batch_id' => $batchId,
                    'normalized_optional_fields' => $normalizedFields,
                    'promotion_result' => $promotion,
                    'final_row_status' => $fresh->status,
                    'canonical_campus_id' => (int) $campus->id,
                    'parent_institution_id' => (int) $campus->institution_id,
                    'canonical_campus_count_before' => $beforeCount,
                    'canonical_campus_count_after' => $afterCount,
                    'rejected_row_23_status' => $rejectedAfter->status,
                    'only_authorized_row_targeted' => true,
                    'transaction_verified' => true,
                ];
            });

            echo json_encode($result, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES), PHP_EOL;
            PHP