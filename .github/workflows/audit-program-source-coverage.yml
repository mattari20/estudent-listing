name: Audit Program Source Coverage
on:
  push:
    branches:
      - ops/audit-program-source-coverage
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only source coverage, duplicates and public catalog audit
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          command_timeout: 3m
          script: |
            set -euo pipefail
            cd /home/u537436044/domains/estudent.pk/public_html/institutes
            php <<'PHP'
            <?php
            require 'vendor/autoload.php';
            $app=require_once 'bootstrap/app.php';
            $kernel=$app->make(Illuminate\Contracts\Console\Kernel::class);
            $kernel->bootstrap();
            $db=Illuminate\Support\Facades\DB::class;
            $programs=$db::table('programs as p')->join('institutions as i','i.id','=','p.institution_id')->where('p.status','active')->orderBy('i.id')->orderBy('p.name')->get(['p.id','p.institution_id','i.name as institution','p.name','p.slug','p.program_level','p.award','p.discipline','p.description']);
            $missing=[]; $coverage=[];
            foreach($programs as $p) {
              $hasUrl=is_string($p->description) && preg_match('~https?://[^\\s]+~',$p->description)===1;
              if(!$hasUrl) $missing[]=['id'=>$p->id,'institution'=>$p->institution,'name'=>$p->name,'slug'=>$p->slug];
              $coverage[$p->institution_id]??=['institution'=>$p->institution,'count'=>0,'with_source_url'=>0];
              $coverage[$p->institution_id]['count']++;
              if($hasUrl) $coverage[$p->institution_id]['with_source_url']++;
            }
            $duplicates=$db::table('programs')->select('institution_id','slug',$db::raw('COUNT(*) as n'))->groupBy('institution_id','slug')->havingRaw('COUNT(*) > 1')->get();
            $badOfferings=$db::table('program_offerings as o')->leftJoin('programs as p','p.id','=','o.program_id')->leftJoin('campuses as c','c.id','=','o.campus_id')->where('o.status','active')->where(function($q){$q->whereNull('p.id')->orWhereNull('c.id')->orWhere('p.status','<>','active')->orWhere('c.status','<>','active');})->count();
            $intakes=$db::table('admission_intakes as a')->join('program_offerings as o','o.id','=','a.program_offering_id')->join('programs as p','p.id','=','o.program_id')->orderBy('a.id')->get(['a.id','a.label','a.status','a.application_open_at','a.application_close_at','a.test_date','a.application_url','p.name as program','p.slug']);
            echo "ACTIVE_PROGRAM_COUNT=".$programs->count()."\n";
            echo "SOURCE_URL_COVERAGE=".json_encode(['with_url'=>$programs->count()-count($missing),'without_url'=>count($missing),'by_institution'=>array_values($coverage)],JSON_UNESCAPED_SLASHES)."\n";
            echo "PROGRAMS_MISSING_SOURCE_URL=".json_encode($missing,JSON_UNESCAPED_SLASHES)."\n";
            echo "DUPLICATE_PROGRAM_IDENTITIES=".json_encode($duplicates,JSON_UNESCAPED_SLASHES)."\n";
            echo "BROKEN_ACTIVE_OFFERINGS=".$badOfferings."\n";
            echo "ADMISSION_INTAKES=".json_encode($intakes,JSON_UNESCAPED_SLASHES)."\n";
            PHP
            php artisan institutes:data-gap-report --json | php -r '$d=json_decode(stream_get_contents(STDIN),true); if(!is_array($d)) exit(2); echo "DATA_GAP_STATUS=".($d["status"]??"unknown")."\n"; echo "POPULATION=".json_encode($d["sections"]["canonical_population"]??null)."\n"; echo "RELATIONSHIP_GAPS=".json_encode($d["sections"]["canonical_relationship_gaps"]??null)."\n"; if(($d["mutation_performed"]??null)!==false || ($d["status"]??null)!=="healthy") exit(5);'
