name: Step 3 Evidence Register Validation

on:
  pull_request:
    paths:
      - "docs/step3-offering-gap-evidence-register.csv"
      - "scripts/validate_step3_offering_gap_register.py"
      - ".github/workflows/step3-evidence-register-validation.yml"
  push:
    branches:
      - main
    paths:
      - "docs/step3-offering-gap-evidence-register.csv"
      - "scripts/validate_step3_offering_gap_register.py"
      - ".github/workflows/step3-evidence-register-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate evidence register
        run: python scripts/validate_step3_offering_gap_register.py
