name: Read LUMS Intake Dates
on:
  push:
    branches:
      - ops/read-lums-intake-dates
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only current intake row
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            set -euo pipefail
            cd /home/u537436044/domains/estudent.pk/public_html/institutes
            php <<'PHP'
            <?php
            require 'vendor/autoload.php';
            $app=require_once 'bootstrap/app.php';
            $kernel=$app->make(Illuminate\Contracts\Console\Kernel::class);
            $kernel->bootstrap();
            $db=Illuminate\Support\Facades\DB::class;
            echo "PROGRAMS=".json_encode($db::table('programs')->where('institution_id',8)->get(['id','name','slug','status']),JSON_UNESCAPED_SLASHES)."\\n";
            echo "OFFERINGS=".json_encode($db::table('program_offerings as o')->join('programs as p','p.id','=','o.program_id')->where('p.institution_id',8)->get(['o.id','o.program_id','o.campus_id','o.status','p.slug']),JSON_UNESCAPED_SLASHES)."\\n";
            echo "INTAKES=".json_encode($db::table('admission_intakes')->get(['id','program_offering_id','label','status','application_close_at','test_date','application_url']),JSON_UNESCAPED_SLASHES)."\\n";
            PHP
