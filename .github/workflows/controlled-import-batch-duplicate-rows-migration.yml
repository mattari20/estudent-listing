name: Controlled Import Batch Duplicate Rows Migration

on:
  workflow_dispatch:
    inputs:
      confirm_migration:
        description: "Set true only to apply the single reviewed import_batches duplicate_rows migration after its read-only preflight passes."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: controlled-import-batch-duplicate-rows-migration
  cancel-in-progress: false

jobs:
  resolve-target:
    name: Resolve approved application-code revision
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      target_revision: ${{ steps.revision.outputs.target_revision }}
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve latest application-code commit
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git log -1 --format=%H -- app bootstrap config database resources routes composer.json composer.lock public artisan)"
          test -n "$revision"
          echo "target_revision=$revision" >> "$GITHUB_OUTPUT"
          echo "target_application_revision=$revision"

  migrate:
    name: Preflight and optionally apply only duplicate_rows migration
    needs: resolve-target
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify deployed code and run guarded single migration
        uses: appleboy/ssh-action@v1.2.0
        env:
          PROJECT_PATH: /home/u537436044/domains/estudent.pk/public_html/institutes
          TARGET_REVISION: ${{ needs.resolve-target.outputs.target_revision }}
          CONFIRM_MIGRATION: ${{ inputs.confirm_migration }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          envs: PROJECT_PATH,TARGET_REVISION,CONFIRM_MIGRATION
          command_timeout: 6m
          script: |
            set -eu
            case "$PROJECT_PATH" in /*) ;; *) echo "ERROR: project path must be absolute"; exit 2 ;; esac
            case "$PROJECT_PATH" in *".."*) echo "ERROR: project path must not contain .."; exit 2 ;; esac
            test -f "$PROJECT_PATH/artisan" || { echo "ERROR: artisan missing"; exit 3; }
            test -f "$PROJECT_PATH/vendor/autoload.php" || { echo "ERROR: Composer autoloader missing; refusing migration"; exit 3; }
            MIGRATION_FILE="database/migrations/2026_10_23_000001_add_duplicate_rows_to_import_batches_table.php"
            test -f "$PROJECT_PATH/$MIGRATION_FILE" || { echo "ERROR: target migration file missing on Hostinger"; exit 4; }
            cd "$PROJECT_PATH"
            git rev-parse --is-inside-work-tree >/dev/null 2>&1 || { echo "ERROR: Git metadata unavailable; refusing migration"; exit 4; }
            PREVIOUS_REVISION="$(git rev-parse HEAD)"
            echo "deployed_revision=$PREVIOUS_REVISION"
            echo "target_application_revision=$TARGET_REVISION"
            echo "git_fetch_stage=starting"
            echo "git_shell=$SHELL"
            echo "git_worktree=$(git rev-parse --show-toplevel)"
            if export GIT_TERMINAL_PROMPT=0; then
              echo "git_prompt_suppression=enabled"
            else
              echo "ERROR: unable to disable interactive Git prompts"
              exit 4
            fi

            FETCH_OUTPUT_FILE="$(mktemp)"
            trap 'rm -f "$FETCH_OUTPUT_FILE"' EXIT
            if [ -f .git/shallow ]; then
              echo "git_fetch_mode=unshallow"
              if git fetch --no-tags --unshallow origin main >"$FETCH_OUTPUT_FILE" 2>&1; then
                FETCH_STATUS=0
              else
                FETCH_STATUS=$?
              fi
            else
              echo "git_fetch_mode=normal"
              if git fetch --no-tags origin main >"$FETCH_OUTPUT_FILE" 2>&1; then
                FETCH_STATUS=0
              else
                FETCH_STATUS=$?
              fi
            fi
            cat "$FETCH_OUTPUT_FILE"
            if [ "$FETCH_STATUS" -ne 0 ]; then
              echo "ERROR: git fetch failed (exit $FETCH_STATUS); no database checks or writes were attempted."
              exit 4
            fi
            echo "git_fetch_stage=completed"
            git cat-file -e "$TARGET_REVISION^{commit}" 2>/dev/null || { echo "ERROR: target commit unavailable"; exit 4; }
            git merge-base --is-ancestor "$TARGET_REVISION" FETCH_HEAD || { echo "ERROR: target commit is not reachable from origin/main"; exit 4; }
            APP_CODE_PATHS='app bootstrap config database resources routes composer.json composer.lock public artisan'
            git diff --quiet "$TARGET_REVISION" "$PREVIOUS_REVISION" -- $APP_CODE_PATHS || { echo "ERROR: deployed application code differs from target; deploy/verify code first"; exit 5; }
            git diff --quiet HEAD -- $APP_CODE_PATHS || { echo "ERROR: application working tree has modifications"; exit 5; }
            git diff --cached --quiet HEAD -- $APP_CODE_PATHS || { echo "ERROR: application index has modifications"; exit 5; }
            echo "application_code_parity=VERIFIED"

            # Use shell-level set -eu for failure handling. The upstream SSH action's
            # legacy script_stop option is known to mishandle some compound commands.
            echo "php_cli_probe_stage=starting"
            PHP_BIN="$(command -v php || true)"
            if [ -z "$PHP_BIN" ]; then
              echo "ERROR: PHP CLI executable not found in non-interactive SSH PATH"
              exit 6
            fi
            echo "php_cli_binary=$PHP_BIN"
            PHP_PROBE_OUTPUT_FILE="$(mktemp)"
            trap 'rm -f "$PHP_PROBE_OUTPUT_FILE"' EXIT
            if "$PHP_BIN" -v >"$PHP_PROBE_OUTPUT_FILE" 2>&1; then
              PHP_VERSION_EXIT=0
            else
              PHP_VERSION_EXIT=$?
            fi
            cat "$PHP_PROBE_OUTPUT_FILE"
            echo "php_cli_version_exit_code=$PHP_VERSION_EXIT"
            if [ "$PHP_VERSION_EXIT" -ne 0 ]; then
              echo "ERROR: PHP CLI version probe failed"
              exit 6
            fi
            if "$PHP_BIN" -r 'echo "php_cli_probe=ok\\n";'; then
              echo "php_cli_probe_stage=completed"
            else
              PHP_EVAL_EXIT=$?
              echo "ERROR: PHP CLI inline execution failed with exit code $PHP_EVAL_EXIT"
              exit "$PHP_EVAL_EXIT"
            fi
            rm -f "$PHP_PROBE_OUTPUT_FILE"

            PREFLIGHT_OUTPUT_FILE="$(mktemp)"
            PREFLIGHT_SCRIPT_FILE="$(mktemp)"
            trap 'rm -f "$PREFLIGHT_OUTPUT_FILE" "$PREFLIGHT_SCRIPT_FILE"' EXIT
            cat > "$PREFLIGHT_SCRIPT_FILE" <<'PHP'
            <?php
            $projectPath = getenv('PROJECT_PATH');
            if (!is_string($projectPath) || $projectPath === '') { fwrite(STDERR, "ERROR: PROJECT_PATH unavailable to PHP preflight.\\n"); exit(2); }
            require $projectPath.'/vendor/autoload.php';
            $app = require $projectPath.'/bootstrap/app.php';
            $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();

            $db = \Illuminate\Support\Facades\DB::connection();
            $schema = \Illuminate\Support\Facades\Schema::connection($db->getName());
            $table = 'import_batches';
            $migration = '2026_10_23_000001_add_duplicate_rows_to_import_batches_table';
            $tableExists = $schema->hasTable($table);
            $columnExists = $tableExists && $schema->hasColumn($table, 'duplicate_rows');
            $ledgerExists = $schema->hasTable('migrations');
            $migrationRecorded = $ledgerExists && $db->table('migrations')->where('migration', $migration)->exists();
            echo json_encode([
                'check' => 'controlled_import_batch_duplicate_rows_migration_preflight',
                'mutation_performed' => false,
                'table_exists' => $tableExists,
                'duplicate_rows_column_exists' => $columnExists,
                'migration_file_exists' => is_file(base_path('database/migrations/'.$migration.'.php')),
                'migration_ledger_exists' => $ledgerExists,
                'migration_recorded' => $migrationRecorded,
                'write_requested' => getenv('CONFIRM_MIGRATION') === 'true',
            ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES), PHP_EOL;

            if (!$tableExists) { fwrite(STDERR, "ERROR: import_batches table is missing; refusing.\n"); exit(10); }
            if (!$ledgerExists) { fwrite(STDERR, "ERROR: migrations ledger is missing; refusing.\n"); exit(11); }
            if (!is_file(base_path('database/migrations/'.$migration.'.php'))) { fwrite(STDERR, "ERROR: target migration file missing; refusing.\n"); exit(12); }
            if ($migrationRecorded && !$columnExists) { fwrite(STDERR, "ERROR: migration recorded but column absent; schema drift requires separate review.\n"); exit(13); }
            if ($migrationRecorded && $columnExists) { echo "decision=ALREADY_APPLIED_AND_VERIFIED\n"; exit(0); }
            if ($columnExists && !$migrationRecorded) {
                fwrite(STDERR, "ERROR: duplicate_rows column exists but migration is not recorded; partial schema requires separate review.\n");
                exit(14);
            }
            echo "decision=READY_FOR_SINGLE_MIGRATION\n";
            PHP
            echo "php_preflight_stage=starting"
            if "$PHP_BIN" -d display_errors=1 -d log_errors=0 "$PREFLIGHT_SCRIPT_FILE" >"$PREFLIGHT_OUTPUT_FILE" 2>&1; then
              PREFLIGHT_PHP_EXIT=0
            else
              PREFLIGHT_PHP_EXIT=$?
            fi
            cat "$PREFLIGHT_OUTPUT_FILE"
            echo "php_preflight_exit_code=$PREFLIGHT_PHP_EXIT"
            if [ "$PREFLIGHT_PHP_EXIT" -ne 0 ]; then
              echo "ERROR: PHP preflight failed with exit code $PREFLIGHT_PHP_EXIT; see PHP output above."
              exit "$PREFLIGHT_PHP_EXIT"
            fi
            echo "php_preflight_stage=completed"
            PREFLIGHT_OUTPUT="$(cat "$PREFLIGHT_OUTPUT_FILE")"
            if printf '%s\n' "$PREFLIGHT_OUTPUT" | grep -q 'decision=ALREADY_APPLIED_AND_VERIFIED'; then
              echo "migration_status=ALREADY_APPLIED_NO_CHANGE"
              exit 0
            fi
            if [ "$CONFIRM_MIGRATION" != "true" ]; then
              echo "migration_status=DRY_RUN_PREFLIGHT_PASSED_NO_CHANGES"
              echo "production_schema_writes=NOT_RUN"
              exit 0
            fi
            printf '%s\n' "$PREFLIGHT_OUTPUT" | grep -q 'decision=READY_FOR_SINGLE_MIGRATION' || { echo "ERROR: preflight did not authorize migration"; exit 14; }

            echo "Applying exactly one migration: $MIGRATION_FILE"
            php artisan migrate --force --path="$MIGRATION_FILE" --no-interaction

            POSTCHECK_SCRIPT_FILE="$(mktemp)"
            POSTCHECK_OUTPUT_FILE="$(mktemp)"
            trap 'rm -f "$PREFLIGHT_OUTPUT_FILE" "$PREFLIGHT_SCRIPT_FILE" "$POSTCHECK_SCRIPT_FILE" "$POSTCHECK_OUTPUT_FILE"' EXIT
            cat > "$POSTCHECK_SCRIPT_FILE" <<'PHP'
            <?php
            $projectPath = getenv('PROJECT_PATH');
            if (!is_string($projectPath) || $projectPath === '') { fwrite(STDERR, "ERROR: PROJECT_PATH unavailable to post-migration verification.\\n"); exit(2); }
            require $projectPath.'/vendor/autoload.php';
            $app = require $projectPath.'/bootstrap/app.php';
            $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $db = \Illuminate\Support\Facades\DB::connection();
            $schema = \Illuminate\Support\Facades\Schema::connection($db->getName());
            $migration = '2026_10_23_000001_add_duplicate_rows_to_import_batches_table';
            $columnExists = $schema->hasTable('import_batches') && $schema->hasColumn('import_batches', 'duplicate_rows');
            $migrationRecorded = $schema->hasTable('migrations') && $db->table('migrations')->where('migration', $migration)->exists();
            echo json_encode([
                'check' => 'post_migration_verification',
                'mutation_performed' => false,
                'duplicate_rows_column_exists' => $columnExists,
                'migration_recorded' => $migrationRecorded,
            ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES), PHP_EOL;
            if (!$columnExists || !$migrationRecorded) { fwrite(STDERR, "ERROR: post-migration verification failed.\n"); exit(20); }
            PHP
            echo "post_migration_verification_stage=starting"
            if "$PHP_BIN" -d display_errors=1 -d log_errors=0 "$POSTCHECK_SCRIPT_FILE" >"$POSTCHECK_OUTPUT_FILE" 2>&1; then
              POSTCHECK_PHP_EXIT=0
            else
              POSTCHECK_PHP_EXIT=$?
            fi
            cat "$POSTCHECK_OUTPUT_FILE"
            echo "post_migration_php_exit_code=$POSTCHECK_PHP_EXIT"
            if [ "$POSTCHECK_PHP_EXIT" -ne 0 ]; then
              echo "ERROR: post-migration verification PHP failed; inspect output above."
              exit "$POSTCHECK_PHP_EXIT"
            fi
            echo "migration_status=TARGET_MIGRATION_APPLIED_AND_VERIFIED"
