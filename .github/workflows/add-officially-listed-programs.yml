name: Add Officially Listed Programs

on:
  push:
    branches:
      - ops/add-officially-listed-programs

permissions:
  contents: read

jobs:
  add-programs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Insert source-documented programs with guarded transaction
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          command_timeout: 3m
          script: |
            set -euo pipefail
            cd /home/u537436044/domains/estudent.pk/public_html/institutes
            php <<'PHP'
            <?php
            require 'vendor/autoload.php';
            $app=require_once 'bootstrap/app.php';
            $kernel=$app->make(Illuminate\Contracts\Console\Kernel::class);
            $kernel->bootstrap();
            $db=Illuminate\Support\Facades\DB::class;
            $programs=[
              ['institution_id'=>2,'institution'=>'University of Engineering and Technology Lahore','name'=>'BSc. Computer Science','slug'=>'uet-lahore-bsc-computer-science','level'=>'undergraduate','award'=>'BSc','discipline'=>'Computer Science','source'=>'https://uet.edu.pk/academics/academics/undergraduate-academic-programs/'],
              ['institution_id'=>3,'institution'=>'University of the Punjab','name'=>'BS Computer Science','slug'=>'punjab-university-bs-computer-science','level'=>'undergraduate','award'=>'BS','discipline'=>'Computer Science','source'=>'https://pu.edu.pk/home/admission_notice/698'],
              ['institution_id'=>4,'institution'=>'University of Central Punjab','name'=>'BS Computer Science','slug'=>'ucp-bs-computer-science','level'=>'undergraduate','award'=>'BS','discipline'=>'Computer Science','source'=>'https://ucp.edu.pk/admissions/offered-programs-fall-2026/'],
              ['institution_id'=>5,'institution'=>'University of Veterinary and Animal Sciences Lahore','name'=>'Doctor of Veterinary Medicine','slug'=>'uvas-doctor-of-veterinary-medicine','level'=>'undergraduate','award'=>'DVM','discipline'=>'Veterinary Medicine','source'=>'https://www.uvas.edu.pk/Admissions/undergraduate/Admission_guidelines/index.htm'],
              ['institution_id'=>14,'institution'=>'Bahria University','name'=>'BS Computer Science','slug'=>'bahria-university-bs-computer-science','level'=>'undergraduate','award'=>'BS','discipline'=>'Computer Science','source'=>'https://www.bahria.edu.pk/Home/AdmissionRoadmap?campus=lahore&programType=UnderGraduate'],
              ['institution_id'=>16,'institution'=>'Virtual University of Pakistan','name'=>'BS Computer Science','slug'=>'virtual-university-bs-computer-science','level'=>'undergraduate','award'=>'BS','discipline'=>'Computer Science','source'=>'https://www.vu.edu.pk/AboutUs/ProgramsOffered?Degree=BS'],
              ['institution_id'=>17,'institution'=>'Karakoram International University','name'=>'BS Computer Science','slug'=>'kiu-bs-computer-science','level'=>'undergraduate','award'=>'BS','discipline'=>'Computer Science','source'=>'https://admissions.kiu.edu.pk/all-degrees'],
              ['institution_id'=>18,'institution'=>'National Textile University','name'=>'BS Textile Engineering','slug'=>'ntu-bs-textile-engineering','level'=>'undergraduate','award'=>'BS','discipline'=>'Textile Engineering','source'=>'https://ntu.edu.pk/ug-programs.php'],
              ['institution_id'=>19,'institution'=>'National University of Sciences & Technology','name'=>'BS Computer Science','slug'=>'nust-bs-computer-science','level'=>'undergraduate','award'=>'BS','discipline'=>'Computer Science','source'=>'https://nust.edu.pk/admissions/undergraduates/list-of-ug-programmes-and-institutions'],
              ['institution_id'=>12,'institution'=>'National University of Modern Languages','name'=>'BS English','slug'=>'numl-bs-english','level'=>'undergraduate','award'=>'BS','discipline'=>'English Language and Literature','source'=>'https://numlrwp.numl.edu.pk/Numl/BS_Eng_Program'],
            ];
            $db::transaction(function() use ($db,$programs) {
              foreach($programs as $p) {
                $i=$db::table('institutions')->where('id',$p['institution_id'])->lockForUpdate()->first();
                if(!$i || $i->name!==$p['institution'] || $i->status!=='active') throw new RuntimeException("Institution guard failed for program ".$p['slug']);
                $existing=$db::table('programs')->where('slug',$p['slug'])->lockForUpdate()->get();
                if($existing->count()>1) throw new RuntimeException("Duplicate program slug ".$p['slug']);
                if($existing->count()===1) {
                  $e=$existing->first();
                  if((int)$e->institution_id!==$p['institution_id'] || $e->name!==$p['name'] || $e->status!=='active') throw new RuntimeException("Existing program mismatch ".$p['slug']);
                  echo "REUSED_PROGRAM=".$p['slug']."\n";
                  continue;
                }
                $db::table('programs')->insert([
                  'institution_id'=>$p['institution_id'],'name'=>$p['name'],'slug'=>$p['slug'],
                  'program_level'=>$p['level'],'award'=>$p['award'],'discipline'=>$p['discipline'],
                  'status'=>'active','description'=>'Official listing source: '.$p['source'],
                  'created_at'=>now(),'updated_at'=>now()
                ]);
                echo "CREATED_PROGRAM=".$p['slug'].";SOURCE=".$p['source']."\n";
              }
            });
            $rows=$db::table('programs')->whereIn('slug',array_column($programs,'slug'))->orderBy('institution_id')->get(['institution_id','name','slug','program_level','award','discipline','status','description']);
            foreach($rows as $r) echo json_encode($r,JSON_UNESCAPED_SLASHES)."\n";
            if($rows->count()!==10) throw new RuntimeException("Expected 10 sourced programs; found ".$rows->count());
            PHP
            php artisan institutes:data-gap-report --json | php -r '$d=json_decode(stream_get_contents(STDIN),true); if(!is_array($d)) exit(2); echo "POST_PROGRAM_REPORT_STATUS=".($d["status"]??"unknown")."\n"; echo "PROGRAM_POPULATION=".json_encode($d["sections"]["canonical_population"]??null)."\n"; if (($d["mutation_performed"]??null)!==false) exit(4);'
