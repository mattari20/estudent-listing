name: Controlled Official-Source Refresh Migration

on:
  workflow_dispatch:
    inputs:
      confirm_index_repair:
        description: "Set true only to add the two specifically missing non-unique refresh indexes after reviewing read-only schema diagnostics. Does not reconcile the migration ledger."
        required: true
        type: boolean
        default: false
      confirm_migration:
        description: "Set true only after readiness proves the complete schema matches and the only discrepancy is the missing migration-ledger row."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: controlled-official-source-refresh-migration
  cancel-in-progress: false

jobs:
  resolve-target:
    name: Resolve approved application-code revision
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      target_revision: ${{ steps.revision.outputs.target_revision }}
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve latest application-code commit
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git log -1 --format=%H -- app bootstrap config database resources routes composer.json composer.lock public artisan)"
          test -n "$revision"
          echo "target_revision=$revision" >> "$GITHUB_OUTPUT"
          echo "expected_application_revision=$revision"

  migrate:
    name: Verify deployed code and optionally apply one additive migration
    needs: resolve-target
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate target and run guarded migration
        uses: appleboy/ssh-action@v1.2.0
        env:
          PROJECT_PATH: /home/u537436044/domains/estudent.pk/public_html/institutes
          TARGET_REVISION: ${{ needs.resolve-target.outputs.target_revision }}
          CONFIRM_INDEX_REPAIR: ${{ inputs.confirm_index_repair }}
          CONFIRM_MIGRATION: ${{ inputs.confirm_migration }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          envs: PROJECT_PATH,TARGET_REVISION,CONFIRM_INDEX_REPAIR,CONFIRM_MIGRATION
          command_timeout: 6m
          script_stop: true
          script: |
            set -eu
            case "$PROJECT_PATH" in /*) ;; *) echo "ERROR: project path must be absolute"; exit 2 ;; esac
            case "$PROJECT_PATH" in *".."*) echo "ERROR: project path must not contain .."; exit 2 ;; esac
            test -f "$PROJECT_PATH/artisan" || { echo "ERROR: artisan not found"; exit 3; }
            cd "$PROJECT_PATH"

            git rev-parse --is-inside-work-tree >/dev/null 2>&1 || {
              echo "ERROR: Hostinger checkout Git metadata is required to verify the deployed code"
              exit 4
            }
            if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              echo "ERROR: Hostinger checkout Git metadata is required to verify deployed code"
              exit 4
            fi
            if DEPLOYED_REVISION="$(git rev-parse HEAD 2>&1)"; then HEAD_STATUS=0; else
              HEAD_STATUS=$?; echo "deployed_head_status=$HEAD_STATUS"; echo "ERROR: unable to resolve deployed HEAD"; exit 4
            fi
            echo "deployed_head_status=$HEAD_STATUS"
            echo "deployed_revision=$DEPLOYED_REVISION"
            echo "expected_application_revision=$TARGET_REVISION"
            if REMOTE_URL="$(git remote get-url origin 2>/dev/null)"; then REMOTE_STATUS=0; else REMOTE_STATUS=$?; REMOTE_URL=""; fi
            echo "origin_remote_present=$([ "$REMOTE_STATUS" -eq 0 ] && [ -n "$REMOTE_URL" ] && echo true || echo false)"
            if [ "$REMOTE_STATUS" -ne 0 ] || [ -z "$REMOTE_URL" ]; then echo "ERROR: origin remote absent or unreadable; cannot verify code"; exit 5; fi
            echo "diagnostic_checkpoint=before_unset_remote_url"
            if unset REMOTE_URL; then UNSET_REMOTE_URL_STATUS=0; else UNSET_REMOTE_URL_STATUS=$?; fi
            echo "unset_remote_url_status=$UNSET_REMOTE_URL_STATUS"
            if [ "$UNSET_REMOTE_URL_STATUS" -ne 0 ]; then echo "ERROR: unable to clear temporary remote URL variable"; exit 5; fi
            echo "diagnostic_checkpoint=after_unset_remote_url"

            echo "diagnostic_checkpoint=before_git_shallow_detection"
            if SHALLOW_REPOSITORY="$(git rev-parse --is-shallow-repository 2>&1)"; then
              SHALLOW_DETECTION_STATUS=0
            else
              SHALLOW_DETECTION_STATUS=$?
              echo "git_shallow_detection_status=$SHALLOW_DETECTION_STATUS"
              echo "ERROR: unable to determine whether the Hostinger repository is shallow"
              exit 5
            fi
            echo "git_shallow_detection_status=$SHALLOW_DETECTION_STATUS"
            echo "git_is_shallow_repository=$SHALLOW_REPOSITORY"
            BOOTSTRAP_REF=refs/remotes/origin/step1-bootstrap-main
            if [ "$SHALLOW_REPOSITORY" = "true" ]; then
              echo "git_shallow_file_present=true"
              echo "hostinger_git_shallow=true"
              echo "diagnostic_checkpoint=before_unshallow_fetch"
              if git fetch --unshallow --no-tags origin "main:$BOOTSTRAP_REF"
              then
                BOOTSTRAP_FETCH_STATUS=0
              else
                BOOTSTRAP_FETCH_STATUS=$?
              fi
            elif [ "$SHALLOW_REPOSITORY" = "false" ]; then
              echo "git_shallow_file_present=false"
              echo "hostinger_git_shallow=false"
              echo "diagnostic_checkpoint=before_main_fetch"
              if git fetch --no-tags origin "main:$BOOTSTRAP_REF"
              then
                BOOTSTRAP_FETCH_STATUS=0
              else
                BOOTSTRAP_FETCH_STATUS=$?
              fi
            else
              echo "ERROR: Git returned an unrecognized shallow-repository status"
              exit 5
            fi
            echo "bootstrap_main_fetch_status=$BOOTSTRAP_FETCH_STATUS"
            if [ "$BOOTSTRAP_FETCH_STATUS" -ne 0 ]; then echo "ERROR: cannot fetch approved main history; schema inspection blocked"; exit 5; fi
            echo "diagnostic_checkpoint=after_main_fetch"
            if VERIFIED_MAIN_REVISION="$(git rev-parse "$BOOTSTRAP_REF" 2>&1)"; then BOOTSTRAP_REF_STATUS=0; else BOOTSTRAP_REF_STATUS=$?; VERIFIED_MAIN_REVISION=UNAVAILABLE; fi
            echo "bootstrap_main_revision_status=$BOOTSTRAP_REF_STATUS"
            echo "bootstrap_main_revision=$VERIFIED_MAIN_REVISION"
            if [ "$BOOTSTRAP_REF_STATUS" -ne 0 ]; then echo "ERROR: fetched main ref cannot be resolved"; exit 5; fi
            echo "diagnostic_checkpoint=after_main_ref_resolution"

            VERIFY_HELPER="$(mktemp "${TMPDIR:-/tmp}/estudent-approved-revision-guard.XXXXXX")"
            trap 'rm -f "$VERIFY_HELPER"' EXIT HUP INT TERM
            if git show "$BOOTSTRAP_REF:scripts/ci/verify-approved-application-revision.sh" > "$VERIFY_HELPER"; then HELPER_LOAD_STATUS=0; else HELPER_LOAD_STATUS=$?; fi
            echo "revision_guard_helper_load_status=$HELPER_LOAD_STATUS"
            if [ "$HELPER_LOAD_STATUS" -ne 0 ]; then echo "ERROR: verification helper missing from approved main; schema inspection blocked"; exit 5; fi
            if sh "$VERIFY_HELPER" "$PROJECT_PATH" "$TARGET_REVISION"; then REVISION_GUARD_STATUS=0; else REVISION_GUARD_STATUS=$?; fi
            echo "revision_guard_helper_status=$REVISION_GUARD_STATUS"
            if [ "$REVISION_GUARD_STATUS" -ne 0 ]; then echo "ERROR: approved revision/worktree verification failed; schema inspection blocked"; exit "$REVISION_GUARD_STATUS"; fi
            echo "deployed_application_code_status=APPLICATION_CODE_MATCH"



            export CONFIRM_MIGRATION
            export PROJECT_PATH
            echo "diagnostic_checkpoint=php_runtime_preflight"
            if PHP_VERSION_OUTPUT="$(php -r 'fwrite(STDOUT, PHP_VERSION);' 2>/dev/null)"; then
              echo "php_cli_preflight_status=0"
              echo "php_cli_version=$PHP_VERSION_OUTPUT"
            else
              PHP_PREFLIGHT_STATUS=$?
              echo "php_cli_preflight_status=$PHP_PREFLIGHT_STATUS"
              echo "ERROR: remote PHP CLI preflight failed; schema inspection blocked"
              exit 30
            fi
            if php -r 'fwrite(STDOUT, "php_minimal_execution=ok".PHP_EOL);' 2>/dev/null; then
              echo "php_minimal_execution_status=0"
            else
              PHP_PREFLIGHT_STATUS=$?
              echo "php_minimal_execution_status=$PHP_PREFLIGHT_STATUS"
              echo "ERROR: remote PHP CLI cannot execute a minimal script; schema inspection blocked"
              exit 30
            fi
            if [ -f "$PROJECT_PATH/vendor/autoload.php" ] && [ -f "$PROJECT_PATH/bootstrap/app.php" ]; then
              echo "laravel_bootstrap_files_present=true"
            else
              echo "laravel_bootstrap_files_present=false"
              echo "ERROR: required Laravel bootstrap files are missing; schema inspection blocked"
              exit 31
            fi
            echo "diagnostic_checkpoint=before_php_program"
            PHP_DIAGNOSTIC_FILE="$(mktemp "${TMPDIR:-/tmp}/estudent-schema-diagnostic.XXXXXX.php")"
            PHP_SYNTAX_OUTPUT_FILE="$(mktemp "${TMPDIR:-/tmp}/estudent-schema-diagnostic-lint.XXXXXX")"
            trap 'rm -f "$VERIFY_HELPER" "$PHP_DIAGNOSTIC_FILE" "$PHP_SYNTAX_OUTPUT_FILE"' EXIT HUP INT TERM
            if git show "$BOOTSTRAP_REF:scripts/ops/official-source-refresh-diagnostic.php" > "$PHP_DIAGNOSTIC_FILE"; then
              PHP_SOURCE_LOAD_STATUS=0
            else
              PHP_SOURCE_LOAD_STATUS=$?
            fi
            echo "php_diagnostic_source_load_status=$PHP_SOURCE_LOAD_STATUS"
            if [ "$PHP_SOURCE_LOAD_STATUS" -ne 0 ]; then
              echo "ERROR: approved PHP diagnostic source could not be loaded; schema inspection blocked"
              exit 32
            fi
              PHP_SOURCE_WRITE_STATUS=0
            else
              PHP_SOURCE_WRITE_STATUS=$?
            fi
            echo "php_diagnostic_source_write_status=$PHP_SOURCE_WRITE_STATUS"
            if [ "$PHP_SOURCE_WRITE_STATUS" -ne 0 ]; then
              echo "ERROR: unable to prepare the guarded PHP diagnostic file"
              exit 32
            fi
            # The approved PHP diagnostic is a checked-in source file validated by CI.
            # Avoid remote php -l on a temporary file: on this Hostinger runner it terminates
            # the SSH command with status 255 before returning diagnostics.
            echo "diagnostic_checkpoint=php_program_execution"
            if php "$PHP_DIAGNOSTIC_FILE"; then
              PHP_EXIT_STATUS=0
            else
              PHP_EXIT_STATUS=$?
            fi
            echo "php_program_exit_status=$PHP_EXIT_STATUS"
            if [ "$PHP_EXIT_STATUS" -ne 0 ]; then
              echo "ERROR: guarded PHP schema diagnostic failed; no successful schema report was emitted"
              exit "$PHP_EXIT_STATUS"
            fi
            echo "production_canonical_records_changed=NO"

      - name: Prepare verified source-refresh schema handoff
        if: ${{ inputs.confirm_migration }}
        env:
          TARGET_REVISION: ${{ needs.resolve-target.outputs.target_revision }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-refresh-handoff
          {
            echo "verified=true"
            echo "schema_ready=true"
            echo "migration_confirmation=true"
            echo "target_revision=$TARGET_REVISION"
            echo "migration_run_id=$GITHUB_RUN_ID"
            echo "workflow_run_head_sha=$GITHUB_SHA"
            echo "workflow_run_name=Controlled Official-Source Refresh Migration"
            echo "workflow_attempt=$GITHUB_RUN_ATTEMPT"
          } > source-refresh-handoff/schema-verification.txt

      - name: Publish verified source-refresh schema handoff
        if: ${{ inputs.confirm_migration }}
        uses: actions/upload-artifact@v4
        with:
          name: official-source-refresh-verified-handoff
          path: source-refresh-handoff/schema-verification.txt
          if-no-files-found: error
          retention-days: 2
