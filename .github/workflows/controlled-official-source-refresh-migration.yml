name: Controlled Official-Source Refresh Migration

on:
  workflow_dispatch:
    inputs:
      confirm_index_repair:
        description: "Set true only to add the two specifically missing non-unique refresh indexes after reviewing read-only schema diagnostics. Does not reconcile the migration ledger."
        required: true
        type: boolean
        default: false
      confirm_migration:
        description: "Set true only after readiness proves the complete schema matches and the only discrepancy is the missing migration-ledger row."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: controlled-official-source-refresh-migration
  cancel-in-progress: false

jobs:
  resolve-target:
    name: Resolve approved application-code revision
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      target_revision: ${{ steps.revision.outputs.target_revision }}
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve latest application-code commit
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git log -1 --format=%H -- app bootstrap config database resources routes composer.json composer.lock public artisan)"
          test -n "$revision"
          echo "target_revision=$revision" >> "$GITHUB_OUTPUT"
          echo "expected_application_revision=$revision"

  migrate:
    name: Verify deployed code and optionally apply one additive migration
    needs: resolve-target
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate target and run guarded migration
        uses: appleboy/ssh-action@v1.2.0
        env:
          PROJECT_PATH: /home/u537436044/domains/estudent.pk/public_html/institutes
          TARGET_REVISION: ${{ needs.resolve-target.outputs.target_revision }}
          CONFIRM_INDEX_REPAIR: ${{ inputs.confirm_index_repair }}
          CONFIRM_MIGRATION: ${{ inputs.confirm_migration }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          envs: PROJECT_PATH,TARGET_REVISION,CONFIRM_INDEX_REPAIR,CONFIRM_MIGRATION
          command_timeout: 6m
          script_stop: true
          script: |
            set -eu
            case "$PROJECT_PATH" in /*) ;; *) echo "ERROR: project path must be absolute"; exit 2 ;; esac
            case "$PROJECT_PATH" in *".."*) echo "ERROR: project path must not contain .."; exit 2 ;; esac
            test -f "$PROJECT_PATH/artisan" || { echo "ERROR: artisan not found"; exit 3; }
            cd "$PROJECT_PATH"

            git rev-parse --is-inside-work-tree >/dev/null 2>&1 || {
              echo "ERROR: Hostinger checkout Git metadata is required to verify the deployed code"
              exit 4
            }
            # Keep shell execution explicit: capture and print each Git guard's result
            # before deciding whether the database phase is allowed to begin.
            DEPLOYED_REVISION="$(git rev-parse HEAD 2>&1)"
            HEAD_STATUS=$?
            echo "deployed_head_status=$HEAD_STATUS"
            if [ "$HEAD_STATUS" -ne 0 ]; then
              echo "ERROR: unable to resolve deployed HEAD; migration blocked"
              exit 4
            fi
            echo "deployed_revision=$DEPLOYED_REVISION"
            echo "expected_application_revision=$TARGET_REVISION"
            case "$TARGET_REVISION" in
              [0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
              *) echo "ERROR: expected application revision is not a hexadecimal commit SHA"; exit 5 ;;
            esac

            # Record whether origin exists without revealing a possibly credentialed URL.
            REMOTE_STATUS=0
            REMOTE_URL="$(git remote get-url origin 2>/dev/null)"
            REMOTE_STATUS=$?
            echo "origin_remote_present=$([ "$REMOTE_STATUS" -eq 0 ] && echo true || echo false)"
            if [ "$REMOTE_STATUS" -ne 0 ] || [ -z "$REMOTE_URL" ]; then
              echo "ERROR: origin remote is absent or unreadable; cannot verify approved code safely"
              exit 5
            fi
            unset REMOTE_URL

            TARGET_OBJECT_STATUS=0
            git cat-file -e "$TARGET_REVISION^{commit}" 2>/dev/null
            TARGET_OBJECT_STATUS=$?
            echo "target_object_initial_status=$TARGET_OBJECT_STATUS"
            if [ "$TARGET_OBJECT_STATUS" -ne 0 ]; then
              FETCH_MAIN_STATUS=0
              git fetch --no-tags origin main:refs/remotes/origin/step1-verification-main
              FETCH_MAIN_STATUS=$?
              echo "fetch_main_status=$FETCH_MAIN_STATUS"
              if [ "$FETCH_MAIN_STATUS" -ne 0 ]; then
                echo "WARNING: origin/main fetch failed; trying the exact approved commit SHA"
              fi
            else
              echo "fetch_main_status=NOT_REQUIRED_TARGET_OBJECT_ALREADY_PRESENT"
            fi

            TARGET_OBJECT_STATUS=0
            git cat-file -e "$TARGET_REVISION^{commit}" 2>/dev/null
            TARGET_OBJECT_STATUS=$?
            echo "target_object_after_branch_fetch_status=$TARGET_OBJECT_STATUS"
            if [ "$TARGET_OBJECT_STATUS" -ne 0 ]; then
              FETCH_TARGET_STATUS=0
              git fetch --no-tags origin "$TARGET_REVISION"
              FETCH_TARGET_STATUS=$?
              echo "fetch_exact_target_status=$FETCH_TARGET_STATUS"
              if [ "$FETCH_TARGET_STATUS" -ne 0 ]; then
                echo "ERROR: exact approved commit fetch failed; cannot verify deployed application safely"
                exit 5
              fi
            else
              echo "fetch_exact_target_status=NOT_REQUIRED_TARGET_OBJECT_PRESENT"
            fi

            TARGET_OBJECT_STATUS=0
            git cat-file -e "$TARGET_REVISION^{commit}" 2>/dev/null
            TARGET_OBJECT_STATUS=$?
            echo "target_object_commit_status=$TARGET_OBJECT_STATUS"
            if [ "$TARGET_OBJECT_STATUS" -ne 0 ]; then
              echo "ERROR: approved target object is unavailable or is not a commit; migration blocked"
              exit 5
            fi

            FETCH_MAIN_STATUS=0
            git fetch --no-tags origin main:refs/remotes/origin/step1-verification-main
            FETCH_MAIN_STATUS=$?
            echo "fetch_verified_main_status=$FETCH_MAIN_STATUS"
            if [ "$FETCH_MAIN_STATUS" -ne 0 ]; then
              echo "ERROR: unable to refresh named verification ref for origin/main; migration blocked"
              exit 5
            fi
            VERIFIED_MAIN_REVISION="$(git rev-parse refs/remotes/origin/step1-verification-main 2>&1)"
            VERIFIED_MAIN_STATUS=$?
            echo "verified_main_revision_status=$VERIFIED_MAIN_STATUS"
            if [ "$VERIFIED_MAIN_STATUS" -ne 0 ]; then
              echo "ERROR: fetched main verification ref could not be resolved; migration blocked"
              exit 5
            fi
            echo "verified_main_revision=$VERIFIED_MAIN_REVISION"

            REACHABILITY_STATUS=0
            git merge-base --is-ancestor "$TARGET_REVISION" refs/remotes/origin/step1-verification-main
            REACHABILITY_STATUS=$?
            echo "target_reachability_status=$REACHABILITY_STATUS"
            MERGE_BASE="$(git merge-base "$TARGET_REVISION" refs/remotes/origin/step1-verification-main 2>&1)"
            MERGE_BASE_STATUS=$?
            echo "merge_base_status=$MERGE_BASE_STATUS"
            if [ "$MERGE_BASE_STATUS" -eq 0 ]; then
              echo "merge_base_sha=$MERGE_BASE"
            else
              echo "merge_base_sha=UNAVAILABLE"
            fi
            if [ "$REACHABILITY_STATUS" -ne 0 ] || [ "$MERGE_BASE_STATUS" -ne 0 ]; then
              echo "ERROR: approved target is not proven reachable from current origin/main; migration blocked"
              exit 5
            fi

            APP_CODE_PATHS="app bootstrap config database resources routes composer.json composer.lock public artisan"
            APP_DIFF_STATUS=0
            git diff --quiet "$TARGET_REVISION" "$DEPLOYED_REVISION" -- $APP_CODE_PATHS
            APP_DIFF_STATUS=$?
            echo "target_vs_deployed_application_diff_status=$APP_DIFF_STATUS"
            if [ "$APP_DIFF_STATUS" -eq 1 ]; then
              echo "ERROR: deployed application code differs from approved target; migration blocked"
              exit 6
            elif [ "$APP_DIFF_STATUS" -ne 0 ]; then
              echo "ERROR: git diff could not verify target/deployed application parity; migration blocked"
              exit 6
            fi

            WORKTREE_DIFF_STATUS=0
            git diff --quiet HEAD -- $APP_CODE_PATHS
            WORKTREE_DIFF_STATUS=$?
            echo "tracked_worktree_application_drift_status=$WORKTREE_DIFF_STATUS"
            INDEX_DIFF_STATUS=0
            git diff --cached --quiet HEAD -- $APP_CODE_PATHS
            INDEX_DIFF_STATUS=$?
            echo "tracked_index_application_drift_status=$INDEX_DIFF_STATUS"
            if [ "$WORKTREE_DIFF_STATUS" -ne 0 ] || [ "$INDEX_DIFF_STATUS" -ne 0 ]; then
              echo "ERROR: tracked application-code worktree/index drift detected; migration blocked"
              exit 7
            fi
            echo "deployed_application_code_status=APPLICATION_CODE_MATCH"

            export CONFIRM_MIGRATION
            php <<'PHP'
            <?php
            require __DIR__.'/vendor/autoload.php';
            $app = require __DIR__.'/bootstrap/app.php';
            $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();

            $schema = \Illuminate\Support\Facades\Schema::class;
            $db = \Illuminate\Support\Facades\DB::class;
            $artisan = \Illuminate\Support\Facades\Artisan::class;
            $table = 'official_source_refresh_events';
            $migration = '2026_10_25_000002_create_official_source_refresh_events_table';
            $path = 'database/migrations/'.$migration.'.php';
            $requiredColumns = [
                'id', 'source_id', 'source_change_observation_id', 'canonical_type',
                'canonical_id', 'field_name', 'before_value', 'after_value',
                'evidence_url', 'evidence_excerpt', 'content_fingerprint',
                'observed_at', 'occurred_at', 'created_at', 'updated_at',
            ];

            if (! is_file(base_path($path))) {
                fwrite(STDERR, "ERROR: required migration file is missing.".PHP_EOL);
                exit(20);
            }
            if (! $schema::hasTable('migrations')) {
                fwrite(STDERR, "ERROR: migrations table is missing; manual schema review is required.".PHP_EOL);
                exit(21);
            }

            if (getenv('CONFIRM_INDEX_REPAIR') === 'true' && getenv('CONFIRM_MIGRATION') === 'true') {
                fwrite(STDERR, "ERROR: index repair and migration-ledger reconciliation are separate operations; select only one confirmation.".PHP_EOL);
                exit(19);
            }

            $requiredIndexes = [
                'official_refresh_source_idx' => ['source_id'],
                'official_refresh_observation_idx' => ['source_change_observation_id'],
                'official_refresh_canonical_field_idx' => ['canonical_type', 'canonical_id', 'field_name'],
            ];
            // Treat an equivalent non-unique index with identical ordered columns as satisfying the logical contract.
            // Preserve its existing name; never rename or create a duplicate index.
            $indexSatisfaction = static function (array $allIndexes) use ($requiredIndexes): array {
                $existing = [];
                foreach ($allIndexes as $index) {
                    $name = $index['name'] ?? null;
                    if (is_string($name) && $name !== '') {
                        $existing[$name] = [
                            'columns' => array_values($index['columns'] ?? []),
                            'unique' => (bool) ($index['unique'] ?? false),
                        ];
                    }
                }

                $missing = [];
                $satisfiedBy = [];
                foreach ($requiredIndexes as $name => $columns) {
                    $actual = $existing[$name] ?? null;
                    if ($actual !== null) {
                        if ($actual['columns'] === $columns && $actual['unique'] === false) {
                            $satisfiedBy[$name] = $name;
                            continue;
                        }
                        $missing[$name] = $columns;
                        continue;
                    }

                    foreach ($existing as $existingName => $definition) {
                        if ($definition['columns'] === $columns && $definition['unique'] === false) {
                            $satisfiedBy[$name] = $existingName;
                            continue 2;
                        }
                    }
                    $missing[$name] = $columns;
                }

                return [$missing, $satisfiedBy, $existing];
            };
            $tableExists = $schema::hasTable($table);
            $migrationApplied = $db::table('migrations')->where('migration', $migration)->exists();
            $missingColumns = [];
            $missingIndexes = [];
            $inspectSchema = static function () use ($schema, $table, $requiredColumns, $indexSatisfaction): array {
                $missingColumns = [];
                foreach ($requiredColumns as $column) {
                    if (! $schema::hasColumn($table, $column)) {
                        $missingColumns[] = $column;
                    }
                }

                [$missingIndexes] = $indexSatisfaction($schema::getIndexes($table));

                return [$missingColumns, $missingIndexes];
            };

            if ($tableExists) {
                [$missingColumns, $missingIndexes] = $inspectSchema();
            }
            $schemaMatches = $tableExists && $missingColumns === [] && $missingIndexes === [];

            // Explicit, separate, additive index repair. Never infer approval from
            // confirm_migration; the latter is reserved for ledger-only reconciliation.
            if (getenv('CONFIRM_INDEX_REPAIR') === 'true') {
                if (! $tableExists || $missingColumns !== []) {
                    fwrite(STDERR, json_encode([
                        'migration_status' => 'BLOCKED_INDEX_REPAIR_SCHEMA_COLUMNS_NOT_READY',
                        'table_exists' => $tableExists,
                        'missing_columns' => $missingColumns,
                        'migration_executed_this_run' => false,
                    ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES).PHP_EOL);
                    exit(25);
                }

                $allIndexes = $schema::getIndexes($table);
                [$missing, $satisfiedBy, $existingByName] = $indexSatisfaction($allIndexes);
                foreach ($requiredIndexes as $name => $columns) {
                    if (isset($existingByName[$name]) && ! isset($satisfiedBy[$name])) {
                        fwrite(STDERR, json_encode([
                            'migration_status' => 'BLOCKED_INDEX_NAME_COLLISION',
                            'index' => $name,
                            'actual' => $existingByName[$name],
                            'expected' => ['columns' => $columns, 'unique' => false],
                            'production_schema_mutations' => 'NONE',
                        ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES).PHP_EOL);
                        exit(26);
                    }
                }
                $repairable = $missing;

                if ($repairable === []) {
                    echo json_encode([
                        'migration_status' => 'INDEX_REPAIR_NOT_NEEDED',
                        'missing_indexes' => [],
                        'migration_ledger_changed' => false,
                        'production_data_mutations' => 'NONE',
                    ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES), PHP_EOL;
                    exit(0);
                }

                $applied = [];
                foreach ($repairable as $name => $columns) {
                    $schema::table($table, static function (\Illuminate\Database\Schema\Blueprint $blueprint) use ($name, $columns): void {
                        $blueprint->index($columns, $name);
                    });
                    $applied[] = $name;
                }

                [$missingColumnsAfter, $missingIndexesAfter] = $inspectSchema();
                if ($missingColumnsAfter !== [] || $missingIndexesAfter !== []) {
                    fwrite(STDERR, json_encode([
                        'migration_status' => 'INDEX_REPAIR_POSTCHECK_FAILED',
                        'indexes_added' => $applied,
                        'missing_columns' => $missingColumnsAfter,
                        'missing_indexes' => $missingIndexesAfter,
                        'migration_ledger_changed' => false,
                    ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES).PHP_EOL);
                    exit(28);
                }

                echo json_encode([
                    'migration_status' => 'INDEX_REPAIR_APPLIED_AND_VERIFIED',
                    'indexes_added' => $applied,
                    'indexes_satisfied_by_existing_equivalent' => $satisfiedBy,
                    'migration_ledger_changed' => false,
                    'production_canonical_records_changed' => 'NO',
                    'next_action' => 'rerun_readiness_read_only_then_reconcile_ledger_only_if_schema_is_fully_ready',
                ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES), PHP_EOL;
                exit(0);
            }

            if ($schemaMatches && $migrationApplied) {
                echo json_encode([
                    'migration_status' => 'ALREADY_READY',
                    'table_exists' => true,
                    'migration_applied' => true,
                    'missing_columns' => [],
                    'missing_indexes' => [],
                    'migration_executed_this_run' => false,
                    'production_data_mutations' => 'NONE',
                ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES), PHP_EOL;
                exit(0);
            }

            // Existing-but-untracked schema is recoverable only when the physical
            // columns and named indexes exactly match the migration. The migration's
            // idempotent up() verifies that same contract and makes no schema changes;
            // Laravel records the missing migration ledger row only after it returns.
            if (($tableExists && ! $schemaMatches) || ($migrationApplied && ! $tableExists)) {
                fwrite(STDERR, json_encode([
                    'migration_status' => 'BLOCKED_INCONSISTENT_SCHEMA',
                    'table_exists' => $tableExists,
                    'migration_applied' => $migrationApplied,
                    'missing_columns' => $missingColumns,
                    'missing_indexes' => $missingIndexes,
                    'migration_executed_this_run' => false,
                ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES).PHP_EOL);
                exit(22);
            }

            if ($schemaMatches && ! $migrationApplied && getenv('CONFIRM_MIGRATION') !== 'true') {
                echo json_encode([
                    'migration_status' => 'SCHEMA_PRESENT_LEDGER_RECONCILIATION_AVAILABLE',
                    'table_exists' => true,
                    'migration_applied' => false,
                    'missing_columns' => [],
                    'missing_indexes' => [],
                    'migration_would_run' => true,
                    'migration_executed_this_run' => false,
                    'production_data_mutations' => 'NONE',
                    'next_action' => 'rerun_with_confirm_migration_true_after reviewing verified schema and missing ledger row',
                ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES), PHP_EOL;
                exit(0);
            }

            if (getenv('CONFIRM_MIGRATION') !== 'true') {
                echo json_encode([
                    'migration_status' => 'NOT_APPLIED_DRY_RUN',
                    'table_exists' => false,
                    'migration_applied' => false,
                    'required_columns' => $requiredColumns,
                    'migration_would_run' => true,
                    'migration_executed_this_run' => false,
                    'production_data_mutations' => 'NONE',
                    'next_action' => 'rerun_with_confirm_migration_true_after reviewing this report',
                ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES), PHP_EOL;
                exit(0);
            }

            try {
                $exitCode = $artisan::call('migrate', [
                    '--force' => true,
                    '--path' => $path,
                ]);
                echo $artisan::output();
            } catch (\Throwable $exception) {
                fwrite(STDERR, "ERROR: targeted migration threw an exception: ".$exception->getMessage().PHP_EOL);
                exit(23);
            }
            if ($exitCode !== 0) {
                fwrite(STDERR, "ERROR: targeted migration command failed with exit code ".$exitCode.".".PHP_EOL);
                exit(23);
            }

            $tableExists = $schema::hasTable($table);
            $migrationApplied = $db::table('migrations')->where('migration', $migration)->exists();
            $missingColumns = [];
            $missingIndexes = [];
            if ($tableExists) {
                [$missingColumns, $missingIndexes] = $inspectSchema();
            }
            $ready = $tableExists && $migrationApplied && $missingColumns === [] && $missingIndexes === [];
            echo json_encode([
                'migration_status' => $ready ? 'APPLIED_AND_VERIFIED' : 'POST_MIGRATION_VERIFICATION_FAILED',
                'table_exists' => $tableExists,
                'migration_applied' => $migrationApplied,
                'missing_columns' => $missingColumns,
                'missing_indexes' => $missingIndexes,
                'migration_executed_this_run' => true,
                'production_data_mutations' => 'NO_CANONICAL_RECORDS_CHANGED',
            ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES), PHP_EOL;
            if (! $ready) {
                exit(24);
            }
            PHP
            echo "production_canonical_records_changed=NO"

      - name: Prepare verified source-refresh schema handoff
        if: ${{ inputs.confirm_migration }}
        env:
          TARGET_REVISION: ${{ needs.resolve-target.outputs.target_revision }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-refresh-handoff
          {
            echo "verified=true"
            echo "schema_ready=true"
            echo "migration_confirmation=true"
            echo "target_revision=$TARGET_REVISION"
            echo "migration_run_id=$GITHUB_RUN_ID"
            echo "workflow_run_head_sha=$GITHUB_SHA"
            echo "workflow_run_name=Controlled Official-Source Refresh Migration"
            echo "workflow_attempt=$GITHUB_RUN_ATTEMPT"
          } > source-refresh-handoff/schema-verification.txt

      - name: Publish verified source-refresh schema handoff
        if: ${{ inputs.confirm_migration }}
        uses: actions/upload-artifact@v4
        with:
          name: official-source-refresh-verified-handoff
          path: source-refresh-handoff/schema-verification.txt
          if-no-files-found: error
          retention-days: 2
